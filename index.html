<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NOVA = window.NOVA;
  var app = $('#app');

  /* :active на iOS Safari работает только при наличии touch-слушателя */
  document.addEventListener('touchstart', function () {}, { passive: true });

  /* ===================================================================
     ХРАНИЛИЩЕ
     Сейчас localStorage. Позже этот слой заменяется на Firebase,
     остальной код не меняется.
     =================================================================== */
  var storage = {
    read: function (key, def) {
      try { var v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
    },
    write: function (key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }
  };
  NOVA.storage = storage;

  /* ===================================================================
     ЛОКАЛИЗАЦИЯ
     =================================================================== */
  var i18n = (function () {
    var dict = NOVA.translations, KEY = 'nova.lang.v1';
    var lang = storage.read(KEY, 'ru');
    if (!dict[lang]) lang = 'ru';

    function t(key) {
      var d = dict[lang];
      if (d && d[key] != null) return d[key];
      if (dict.ru[key] != null) return dict.ru[key];
      return key;
    }
    function apply(rootEl) {
      var r = rootEl || document;
      $$('[data-i18n]', r).forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
      $$('[data-i18n-attr]', r).forEach(function (el) {
        el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
          var p = pair.split(':');
          if (p.length === 2) el.setAttribute(p[0].trim(), t(p[1].trim()));
        });
      });
      if (r === document) document.documentElement.lang = lang;
    }
    function set(l) {
      if (!dict[l] || l === lang) return;
      lang = l;
      storage.write(KEY, lang);
      apply();
      window.dispatchEvent(new CustomEvent('nova:langchange', { detail: { lang: lang } }));
    }
    return { t: t, apply: apply, set: set, get: function () { return lang; }, add: function (code, d) { dict[code] = d; } };
  })();
  NOVA.i18n = i18n;

  /* ===================================================================
     ДАННЫЕ ПОЛЬЗОВАТЕЛЯ (профиль, приватность)
     Значения по умолчанию — демонстрационные; позже приходят из аккаунта.
     =================================================================== */
  var PROFILE_COLORS = ['blue', 'violet', 'pink', 'orange', 'green'];
  var PROFILE_BGS = ['', 'nova', 'midnight', 'ocean', 'aurora', 'neon'];

  var profile = (function () {
    var KEY = 'nova.profile.v1';
    var state = { name: 'ZEVS', username: 'zevs', color: 'blue', avatar: null, bg: '' };
    var saved = storage.read(KEY, {});
    if (saved && typeof saved === 'object') {
      ['name', 'username', 'avatar'].forEach(function (k) { if (typeof saved[k] === 'string' && saved[k]) state[k] = saved[k]; });
      if (PROFILE_COLORS.indexOf(saved.color) !== -1) state.color = saved.color;
      if (PROFILE_BGS.indexOf(saved.bg) !== -1) state.bg = saved.bg;
    }
    return {
      get: function () { return state; },
      set: function (patch) { Object.keys(patch).forEach(function (k) { state[k] = patch[k]; }); storage.write(KEY, state); renderProfile(); }
    };
  })();
  NOVA.profile = profile;

  var privacy = (function () {
    var KEY = 'nova.privacy.v1';
    var state = { photo: 'everyone', bg: 'everyone' };
    var saved = storage.read(KEY, {});
    if (saved && ['everyone', 'contacts', 'nobody'].indexOf(saved.photo) !== -1) state.photo = saved.photo;
    if (saved && ['everyone', 'nobody'].indexOf(saved.bg) !== -1) state.bg = saved.bg;
    return {
      get: function () { return state; },
      set: function (patch) { Object.keys(patch).forEach(function (k) { state[k] = patch[k]; }); storage.write(KEY, state); renderPrivacy(); renderProfile(); }
    };
  })();
  NOVA.privacy = privacy;

  function renderAvatars() {
    var p = profile.get(), vis = privacy.get().photo;
    $$('[data-avatar]').forEach(function (el) {
      var isPublic = el.getAttribute('data-avatar') === 'public';
      var show = p.avatar && (!isPublic || vis !== 'nobody');
      el.textContent = '';
      if (show) {
        var img = document.createElement('img');
        img.alt = ''; img.src = p.avatar; img.draggable = false;
        el.appendChild(img);
      } else {
        el.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#av-me"/></svg>';
      }
    });
    var note = $('#photoNote');
    if (note) {
      note.hidden = vis === 'everyone';
      note.textContent = i18n.t(vis === 'contacts' ? 'profile.photoContacts' : 'profile.photoHidden');
    }
  }

  function renderProfile() {
    var p = profile.get(), c = NOVA.theme.presets[p.color] || NOVA.theme.presets.blue;
    $$('[data-profile="name"]').forEach(function (el) { el.textContent = p.name; });
    $$('[data-profile="username"]').forEach(function (el) { el.textContent = '@' + p.username; });
    var hideBg = privacy.get().bg === 'nobody';
    $$('[data-profile-card]').forEach(function (el) {
      var pub = hideBg && !!el.closest('#pg-profile'), cc = pub ? NOVA.theme.presets.blue : c;
      el.style.setProperty('--pc-h', cc.h);
      el.style.setProperty('--pc-s', cc.s + '%');
      el.style.setProperty('--pc-l', cc.l + '%');
      if (p.bg && !pub) el.setAttribute('data-pbg', p.bg); else el.removeAttribute('data-pbg');
    });
    $$('[data-pcolor]').forEach(function (b) { b.setAttribute('aria-pressed', String(!p.bg && b.getAttribute('data-pcolor') === p.color)); });
    $$('[data-pbg-opt]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-pbg-opt') === p.bg)); });
    renderAvatars();
    window.dispatchEvent(new Event('nova:profile'));
  }

  function renderPrivacy() {
    var v = privacy.get().photo, bv = privacy.get().bg;
    $$('#photoVis .option').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-value') === v)); });
    $$('#bgVis .option').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-value') === bv)); });
  }
  function renderLang() {
    var l = i18n.get();
    $$('#langList .option').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-value') === l)); });
  }

  /* ===================================================================
     TOAST
     =================================================================== */
  var toastTimer;
  function toast(text) {
    var el = $('#toast');
    el.textContent = text;
    el.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-show'); }, 1800);
  }

  /* ===================================================================
     ГЛАВНЫЙ ЭКРАН: данные и рендер
     Список чатов пуст, пока не подключены реальные данные.
     Позже: NOVA.chats.set([...]) из Firebase.
     =================================================================== */
  var data = {
    quick: [{ id: 'group', labelKey: 'quick.group', icon: 'ic-users' }],
    chats: []
  };

  function renderQuick() {
    $('#quick').innerHTML = data.quick.map(function (q) {
      return '<button class="quick-item" type="button" data-quick="' + esc(q.id) + '">' +
        '<span class="quick-tile glass"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#' + esc(q.icon) + '"/></svg></span>' +
        '<span class="quick-label" data-i18n="' + esc(q.labelKey) + '"></span></button>';
    }).join('');
    i18n.apply($('#quick'));
  }

  function renderChats() {
    var list = $('#chats'), empty = $('#chatsEmpty'), items = data.chats;
    empty.hidden = items.length > 0;
    list.hidden = items.length === 0;
    list.innerHTML = items.map(function (c) {
      var avatar = c.avatarUrl
        ? '<span class="avatar"><img src="' + esc(c.avatarUrl) + '" alt=""></span>'
        : '<span class="avatar avatar--initial">' + esc(String(c.title || '?').trim().charAt(0).toUpperCase()) + '</span>';
      var verified = c.verified ? '<svg class="verified" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-verified"/></svg>' : '';
      var lines = (c.lines || []).map(function (l) { return '<span class="chat-line">' + esc(l) + '</span>'; }).join('');
      var dot = c.online ? '<i class="odot"></i>' : '';
      var badge = c.unread ? '<span class="badge' + (c.muted ? ' badge--muted' : '') + '">' + esc(c.unread) + '</span>' : '';
      return '<li class="chat-item"><button class="chat" type="button" data-id="' + esc(c.id) + '"><span class="avw">' + avatar + dot + '</span>' +
        '<span class="chat-main"><span class="chat-title"><span class="chat-name">' + esc(c.title) + '</span>' + verified + '</span>' +
        '<span class="chat-preview">' + lines + '</span></span>' +
        '<span class="chat-meta"><time class="chat-time">' + esc(c.time || '') + '</time>' + badge + '</span></button></li>';
    }).join('');
  }
  NOVA.chats = { set: function (list) { data.chats = Array.isArray(list) ? list : []; renderChats(); } };

  $('#quick').addEventListener('click', function (e) {
    if (e.target.closest('[data-quick="group"]')) toast(i18n.t('toast.soon'));
  });

  /* ===================================================================
     LIQUID GLASS: физика перемещения активной вкладки
     Пружина (spring) + лёгкая «тягучесть» по скорости + реакция на нажатие.
     Двигается только .lens; капсула и иконки остаются на месте.
     =================================================================== */
  function Spring(x, k, c) { this.x = x; this.t = x; this.v = 0; this.k = k; this.c = c; }
  Spring.prototype.step = function (dt) {
    var a = this.k * (this.t - this.x) - this.c * this.v;
    this.v += a * dt;
    this.x += this.v * dt;
  };

  var nav = $('#nav'), tabsEl = $('#tabs'), lens = $('#lens'), lensTabs = $('#lensTabs');
  var tabs = $$('.tab', tabsEl);

  /* подсвеченная копия вкладок внутри линзы */
  lensTabs.innerHTML = tabs.map(function (b) { return '<span class="tab">' + b.innerHTML + '</span>'; }).join('');

  var pos   = reduce ? new Spring(0, 700, 52) : new Spring(0, 170, 19);   /* свободное движение: лёгкая инерция */
  var press = new Spring(0, 420, 28);
  var str   = new Spring(0, 240, 20);      /* растяжение «жидкого» стекла по скорости */
  var dirv  = 0;                            /* сглаженное направление движения, −1…1 */
  var xs = [0, 0, 0, 0], index = 0, running = false, last = 0, lensW = 80, navW = 320;
  var drag = null, swallowClick = false;
  var flash = $('.lens-flash', lens);
  var FOLLOW = 0.009;                       /* «приклеивание» к пальцу, с (≈ один кадр) */
  var STRETCH_MAX = 0.62;                   /* максимум: +62% ширины капсулы */

  function measure() {
    var ex = parseFloat(getComputedStyle(nav).getPropertyValue('--nav-ex')) || 3;
    lensW = tabs[0].offsetWidth + ex * 2; navW = nav.clientWidth;
    lens.style.width = lensW + 'px';
    lensTabs.style.width = navW + 'px';
    xs = tabs.map(function (t) { return t.offsetLeft - ex; });
  }

  function render() {
    var p = press.x, s = clamp(str.x, 0, 1.2);
    var extra = s * lensW * STRETCH_MAX;
    var left = pos.x - extra * (0.5 - 0.3 * dirv);          /* передний по ходу край тянется сильнее */
    var right = left + lensW + extra;
    if (left < 1.5) left = 1.5;
    if (right > navW - 1.5) right = navW - 1.5;
    var w = Math.max(right - left, lensW * 0.85);
    var sx = 1 - 0.045 * p, sy = 1 - 0.03 * p - 0.05 * Math.min(s, 1);
    lens.style.width = w.toFixed(1) + 'px';
    lens.style.transform = 'translate3d(' + left.toFixed(2) + 'px,0,0) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
    lensTabs.style.transform = 'translate3d(' + (-left).toFixed(2) + 'px,0,0)';
    flash.style.opacity = (clamp(p, 0, 1) * 0.5).toFixed(3);
  }

  function tick(now) {
    var dt = clamp((now - last) / 1000, 0.001, 1 / 30);
    last = now;
    var dragging = drag && drag.moved;
    if (dragging) {                                          /* капсула гладко «догоняет» палец между событиями */
      var ramp = Math.max(0, 1 - (now - drag.t0) / 160);
      var px = pos.x;
      pos.x += (pos.t - pos.x) * (1 - Math.exp(-dt / (FOLLOW + 0.05 * ramp)));
      pos.v += ((pos.x - px) / dt - pos.v) * (1 - Math.exp(-dt / 0.05));
    }
    str.t = 1 - Math.exp(-Math.max(0, Math.abs(pos.v) - 150) / 1400);   /* медленно — почти 0, быстро — до максимума */
    var n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    for (var i = 0; i < n; i++) {
      if (!dragging) pos.step(h);
      press.step(h); str.step(h);
    }
    dirv += (clamp(pos.v / 500, -1, 1) - dirv) * (1 - Math.exp(-dt / 0.07));
    render();
    var settled = !dragging &&

    a3: art('#7a4bff', '#1a0c4e', '<circle cx="50" cy="50" r="32" fill="#1c1456" stroke="#b08cff" stroke-width="2.6"/><ellipse cx="50" cy="52" rx="22" ry="17" fill="#09062a"/><circle cx="42" cy="52" r="3.6" fill="#7be0ff"/><circle cx="58" cy="52" r="3.6" fill="#7be0ff"/><path d="M33 44q9-9 22-6" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" fill="none" stroke-linecap="round"/>'),
    a4: art('#1d6a4a', '#06231a', '<path d="M50 17c25 0 37 21 30 42-5 16-18 26-30 26S25 75 20 59C13 38 25 17 50 17z" fill="#a4e638"/><path d="M26 45q11 4 21 17-15 2-21-17zM74 45q-11 4-21 17 15 2 21-17z" fill="#0a1a0b"/><circle cx="35" cy="52" r="2.4" fill="#fff" opacity=".8"/><circle cx="65" cy="52" r="2.4" fill="#fff" opacity=".8"/>'),
    a5: art('#ff8a3d', '#3a1260', '<path d="M50 34V22" stroke="#d6e6ff" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="19" r="4.5" fill="#ffd23b"/><rect x="25" y="34" width="50" height="44" rx="13" fill="#d6e6ff"/><rect x="33" y="46" width="14" height="14" rx="6" fill="#09112e"/><rect x="53" y="46" width="14" height="14" rx="6" fill="#09112e"/><circle cx="40" cy="53" r="3.2" fill="#37e6ff"/><circle cx="60" cy="53" r="3.2" fill="#37e6ff"/><path d="M40 68h20" stroke="#09112e" stroke-width="3.5" stroke-linecap="round"/>')
  };
  var AVIDS = Object.keys(AV);
  var avUrl = function (id) { return AV[id] || AV.a1; };
  NOVA.avUrl = avUrl;
  NOVA.avIds = AVIDS;

  /* ---------- «Оформление профиля»: готовые аватары NOVA ---------- */
  (function () {
    var box = $('#psAvs'), ttl = $('#psPhotoTitle');
    box.innerHTML = AVIDS.map(function (id, i) { return '<button class="ps-av pressable" type="button" data-ps-av="' + id + '" aria-pressed="false" aria-label="Avatar ' + (i + 1) + '"><img alt="" draggable="false" src="' + AV[id] + '"></button>'; }).join('');
    function sync() {
      var cur = NOVA.profile.get().avatar, own = typeof cur === 'string' && cur.indexOf('data:image/jpeg') === 0;
      $$('[data-ps-av]', box).forEach(function (b) { b.setAttribute('aria-pressed', String(!own && avUrl(b.getAttribute('data-ps-av')) === cur)); });
      ttl.setAttribute('data-i18n', own ? 'ps.change' : 'ps.pick'); ttl.textContent = NOVA.i18n.t(own ? 'ps.change' : 'ps.pick');
    }
    box.addEventListener('click', function (e) { var b = e.target.closest('[data-ps-av]'); if (b) { var id = b.getAttribute('data-ps-av'); NOVA.profile.set({ avatar: avUrl(id), avatarId: id }); } });
    window.addEventListener('nova:profile', sync); window.addEventListener('nova:langchange', sync); sync();
  })();

  /* ---------- состояние ---------- */
  var ob = $('#ob'), steps = $$('.ob-step', ob);
  var S = { step: 0, uid: null, name: '', avatar: 'a1', username: '', theme: NOVA.theme.get().effective, color: 'blue' };
  var fb = null, initFailed = false, busy = false, saving = false, unOk = false, tok = 0, tmr;
  var ICON_OK = '<svg class="ic" viewBox="0 0 24 24"><use href="#ic-check"/></svg>';
  var ICON_X = '<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function save() {
    if (S.uid) NOVA.storage.write(KEY, { uid: S.uid, step: S.step, avatar: S.avatar, username: S.username, theme: S.theme, color: S.color });
  }
  function msg(id, key) { var el = $(id); el.textContent = key ? t(key) : ''; }

  /* ---------- навигация (единый transition: уход влево, приход справа; назад — наоборот) ---------- */
  function go(n) {
    if (n >= 2 && !S.uid) n = 1;
    S.step = n; ob.setAttribute('data-s', n);
    steps.forEach(function (el, i) { el.classList.toggle('is-active', i === n); el.classList.toggle('is-left', i < n); });
    if (n === 3) unEl.dispatchEvent(new Event('input'));
    if (n >= 5) renderCards();
    if (n === 6) fillPreview();
    syncThemeUI(); save();
  }
  function show(n) { ob.classList.remove('is-boot'); go(n); }
  function close() {
    var src = ob.classList.contains('is-boot') ? $('.ob-boot svg', ob) : ob.classList.contains('is-done') ? $('.ob-done .ob-star', ob) : null;
    if (NOVA.intro) NOVA.intro(src);
    if (src) ob.classList.add('is-fly');
    ob.classList.add('is-out'); setTimeout(function () { ob.hidden = true; }, 800);
  }

  $('#obBack').addEventListener('click', function () { if (S.step > 0) go(S.step - 1); });
  $$('[data-next]', ob).forEach(function (b) {
    b.addEventListener('click', function () {
      var s = S.step;
      if (s === 3 && !unOk) return;        /* валидация обязательна */
      if (s < 6 && s !== 1) go(s + 1);
    });
  });

  /* ---------- аватары ---------- */
  $('#obAvs').innerHTML = AVIDS.map(function (id, i) {
    return '<button class="ob-av pressable" type="button" data-id="' + id + '" aria-label="Avatar ' + (i + 1) + '" aria-pressed="false"><img alt="" draggable="false" src="' + AV[id] + '"><i><svg class="ic" viewBox="0 0 24 24"><use href="#ic-check"/></svg></i></button>';
  }).join('');
  function syncAv() { $$('.ob-av').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-id') === S.avatar)); }); }
  $('#obAvs').addEventListener('click', function (e) { var b = e.target.closest('.ob-av'); if (b) { S.avatar = b.getAttribute('data-id'); syncAv(); save(); } });

  /* ---------- username: проверка уникальности через Firestore ---------- */
  var unEl = $('#obUn');
  function unUI(st) {
    $('#obField').className = 'ob-field glass' + (st === 'free' ? ' ok' : (st === 'taken' || st === 'bad') ? ' bad' : '');
    $('#obUnState').innerHTML = st === 'check' ? '<span class="ob-spin"></span>' : st === 'free' ? ICON_OK : (st === 'taken' || st === 'bad') ? ICON_X : '';
    var h = $('#obUnHint');
    h.className = 'ob-hint' + (st === 'free' ? ' ok' : (st === 'taken' || st === 'bad') ? ' bad' : '');
    h.textContent = { free: t('ob.un.free'), taken: t('ob.un.taken'), bad: t('ob.un.bad'), check: t('ob.un.check') }[st] || '';

  }
  unEl.addEventListener('input', function () {
    var v = unEl.value.replace(/^@+/, ''); if (v !== unEl.value) unEl.value = v;
    S.username = v; clearTimeout(tmr); var my = ++tok;
    if (!v) return unUI('idle');
    if (!/^[a-z0-9_]{3,20}$/i.test(v)) return unUI('bad');

    tmr = setTimeout(function () {
      if (!fb) { if (my === tok) { unUI('idle'); $('#obUnHint').className = 'ob-hint bad'; $('#obUnHint').textContent = t('ob.err.cfg'); } return; }
      fb.F.getDoc(fb.F.doc(fb.db, 'usernames', v.toLowerCase())).then(function (s) {
        if (my !== tok) return;
        unUI(s.exists() && s.data().uid !== S.uid ? 'taken' : 'free'); save();
      }).catch(function () {
        if (my !== tok) return; unUI('idle'); $('#obUnHint').className = 'ob-hint bad'; $('#obUnHint').textContent = t('ob.err.net');
      });
    }, 380);
  });
  unEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && unOk) { unEl.blur(); go(4); } });

  /* ---------- тема: существующая система NOVA.theme ---------- */
  function syncThemeUI() { $$('#obThemes [data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === S.theme)); }); }
  $('#obThemes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-mode]'); if (!b) return;
    S.theme = b.getAttribute('data-mode'); NOVA.theme.setMode(S.theme); syncThemeUI(); save();
  });

  /* ---------- цвет профиля: те же цвета, что в настройках ---------- */
  $('#obSw').innerHTML = COLORS.map(function (k) {
    var p = NOVA.theme.presets[k];
    return '<button class="pc-sw" type="button" data-oc="' + k + '" aria-pressed="false" data-i18n-attr="aria-label:accent.' + k + '" style="--h:' + p.h + ';--s:' + p.s + '%;--l:' + p.l + '%"></button>';
  }).join('');
  $('#obSw').addEventListener('click', function (e) { var b = e.target.closest('[data-oc]'); if (b) { S.color = b.getAttribute('data-oc'); renderCards(); save(); } });
  function renderCards() {
    var c = NOVA.theme.presets[S.color];
    $$('[data-ob-card]', ob).forEach(function (el) { el.style.setProperty('--pc-h', c.h); el.style.setProperty('--pc-s', c.s + '%'); el.style.setProperty('--pc-l', c.l + '%'); });
    $$('[data-ob-av]', ob).forEach(function (el) { el.innerHTML = '<img alt="" src="' + avUrl(S.avatar) + '">'; });
    $$('[data-ob-un]', ob).forEach(function (el) { el.textContent = '@' + S.username; });
    $$('#obSw [data-oc]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-oc') === S.color)); });
  }
  function fillPreview() {
    var c = NOVA.theme.presets[S.color];
    $('#obName').textContent = S.name;
    $('#obKvColor i').style.cssText = '--h:' + c.h + ';--s:' + c.s + '%;--l:' + c.l + '%';
    $('#obKvColor em').textContent = t('accent.' + S.color);
    $('#obKvTheme').textContent = t(S.theme === 'light' ? 'ob.light' : 'ob.dark');
  }
  window.addEventListener('nova:langchange', function () { if (S.step === 6) fillPreview(); if (S.step === 3) unEl.dispatchEvent(new Event('input')); });

  /* ---------- Google Sign-In ---------- */
  var gBtn = $('#obGoogle'), gHtml = gBtn.innerHTML;
  function gLoad(on) { busy = on; gBtn.disabled = on; gBtn.innerHTML = on ? '<span class="ob-spin"></span><span>' + t('ob.connecting') + '</span>' : gHtml; if (!on) NOVA.i18n.apply(gBtn); }
  /* человекочитаемая ошибка входа внутри интерфейса NOVA (без alert) */
  function loginError(e) {
    var c = e && e.code;

    console.error('[NOVA] Google sign-in', e);
    msg('#obLoginMsg', c === 'auth/unauthorized-domain' ? 'ob.err.domain' : c === 'auth/network-request-failed' ? 'ob.err.net' : 'ob.err.login');
  }

  gBtn.addEventListener('click', function () {
    if (busy) return; msg('#obLoginMsg');
    if (!fb) return msg('#obLoginMsg', 'ob.err.cfg');

    if (fb.auth.currentUser) return afterAuth(fb.auth.currentUser).then(function () { gLoad(false); });
    var p = new fb.A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    fb.A.signInWithPopup(fb.auth, p).then(function (r) { return afterAuth(r.user); }).catch(function (e) {
      var c = e && e.code;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') {

      }

    }).then(function () { gLoad(false); });
  });

  /* после входа: есть профиль → в приложение; нет → продолжаем onboarding */
  function afterAuth(u) {
    S.uid = u.uid; S.photoURL = u.photoURL || ''; S.name = u.displayName || (u.email || '').split('@')[0] || 'NOVA';
    return fb.F.getDoc(fb.F.doc(fb.db, 'users', u.uid)).then(function (snap) {
      var d = snap.exists() ? snap.data() : null;
      if (d && d.onboardingCompleted === true) { applyRemote(d); NOVA.uid = u.uid; window.dispatchEvent(new CustomEvent('nova:user', { detail: { uid: u.uid } })); close(); return; }
      var p = NOVA.storage.read(KEY, null), start = 2;
      if (p && p.uid === u.uid) {
        if (AV[p.avatar]) S.avatar = p.avatar;
        if (typeof p.username === 'string') { S.username = p.username; unEl.value = p.username; }
        if (p.theme === 'light' || p.theme === 'dark') { S.theme = p.theme; NOVA.theme.setMode(p.theme); }
        if (COLORS.indexOf(p.color) !== -1) S.color = p.color;
        start = Math.min(6, Math.max(2, p.step || 2));
      }
      syncAv(); show(start);
    }).catch(function (e) { console.error('[NOVA] profile load', e); msg('#obLoginMsg', e && e.code === 'permission-denied' ? 'ob.err.login' : 'ob.err.net'); show(1); });
  }
  /* на новом устройстве подтягиваем профиль из Firestore; локальные правки из настроек не затираем */
  function applyRemote(d) {
    if (NOVA.storage.read(SYNC, null) === S.uid) return;
    var patch = { name: d.displayName || S.name };
    if (d.username) patch.username = d.username;
    if (COLORS.indexOf(d.profileColor) !== -1) patch.color = d.profileColor;
    if (AV[d.avatar]) patch.avatar = AV[d.avatar];
    if (d.photo) patch.avatar = d.photo;
    if (typeof d.profileBg === 'string') patch.bg = d.profileBg;
    NOVA.profile.set(patch);
    if (d.theme === 'light' || d.theme === 'dark') NOVA.theme.setMode(d.theme);
    NOVA.storage.write(SYNC, S.uid);
  }

  /* ---------- «Готово»: users/{uid} + usernames/{lower} одной транзакцией ---------- */
  $('#obDone').addEventListener('click', function () {
    if (saving || !fb || !fb.auth.currentUser) return;
    saving = true; msg('#obSaveMsg');
    var btn = $('#obDone'), u = fb.auth.currentUser, lower = S.username.toLowerCase(), F = fb.F;
    btn.disabled = true; btn.firstElementChild.textContent = t('ob.saving');
    var nref = F.doc(fb.db, 'usernames', lower), uref = F.doc(fb.db, 'users', u.uid);
    F.runTransaction(fb.db, function (tx) {
      return tx.get(nref).then(function (n) {
        if (n.exists() && n.data().uid !== u.uid) throw { code: 'nova/taken' };
        if (!n.exists()) tx.set(nref, { uid: u.uid });
        tx.set(uref, { uid: u.uid, displayName: S.name, username: S.username, usernameLower: lower, email: u.email || '', avatar: S.avatar, profileColor: S.color, theme: S.theme, createdAt: F.serverTimestamp(), onboardingCompleted: true, online: true, lastSeen: F.serverTimestamp(), privacy: { lastSeen: 'everyone', allow: [] } });
      });
    }).then(function () {
      NOVA.profile.set({ name: S.name, username: S.username, color: S.color, avatar: avUrl(S.avatar) });
      NOVA.theme.setMode(S.theme);
      NOVA.storage.write(SYNC, S.uid); NOVA.storage.write(KEY, null);
      NOVA.uid = u.uid; window.dispatchEvent(new CustomEvent('nova:user', { detail: { uid: u.uid } }));

      saving = false; btn.disabled = false; btn.firstElementChild.textContent = t('ob.done');

      console.error('[NOVA] save profile', e); msg('#obSaveMsg', 'ob.err.save');
    });
  });

  /* ---------- старт: Firebase проверяет сессию, пока показан splash ---------- */
  NOVA.i18n.apply(ob); syncAv(); syncThemeUI(); unUI('idle');
  var resolved = false;
  function boot(u) {
    if (!resolved) { resolved = true; if (u) afterAuth(u); else show(0); return; }
    /* сессия восстановилась позже таймаута, пока пользователь ещё на приветствии */
    if (u && !S.uid && S.step === 0 && !busy) afterAuth(u);
  }
  Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]).then(function (m) {
    var app = m[0].initializeApp(firebaseConfig);
    fb = { A: m[1], F: m[2], auth: m[1].getAuth(app), db: m[2].initializeFirestore(app, { experimentalAutoDetectLongPolling: true }) };
    NOVA.fb = fb;
    /* результат входа через redirect (если popup был заблокирован) */
    fb.A.getRedirectResult(fb.auth).catch(loginError);
    fb.A.onAuthStateChanged(fb.auth, boot, function (e) { console.error('[NOVA] auth state', e); boot(null); });
    setTimeout(function () { boot(null); }, 8000);
  }).catch(function (e) { initFailed = true; console.error('[NOVA] Firebase init', e); show(0); });
})();
</script>

<script>
/* =====================================================================
   NOVA MESSENGER — поиск по username, чаты, сообщения, статусы, presence.
   Данные: Firestore (users / chats / chats/{id}/messages / users/{uid}/chatSettings).
   Правила Firestore — см. комментарий в конце блока.
   ===================================================================== */
(function () {
  'use strict';
  var NOVA = window.NOVA, F, db, me = null, meDoc = null, started = false;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var tr = function (ru, en) { return NOVA.i18n.get() === 'en' ? en : ru; };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE = 'cubic-bezier(.22,1,.36,1)';
  var app = $('#app'), cw = $('#cw'), list = $('#cwList'), scroller = $('#cwScroll'), input = $('#cwInput');
  var S = { users: {}, unsub: {}, chats: {}, cs: {}, cur: null, other: null, msgs: [], outbox: {}, reply: null, first: true, openedAt: 0, lastSend: null, csWarn: false, msgUnsub: null, srcAv: null, srcEl: null, sheet: null };
  var QUICK = ['❤️', '👍', '😂', '😮', '😢', '🔥'];
  var MORE = ['😀', '😍', '🥰', '😎', '🤔', '😅', '🙏', '👏', '🎉', '💯', '😭', '😡', '🤝', '👀', '💔', '✨', '🙌', '😴'];
  var IC = {
    send: '<svg class="ic" viewBox="0 0 24 24"><path d="M21.5 3 10.5 14"/><path d="M21.5 3l-7 18-4-7-7-4Z"/></svg>',
    back: '<svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
    x: '<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    pen: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    reply: '<svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/></svg>'
  };

  /* ---------- утилиты ---------- */
  function ms(ts) { return ts && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); }
  function hm(t) { return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function dk(t) { var d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel(t) {
    if (dk(t) === dk(Date.now())) return tr('Сегодня', 'Today');
    if (dk(t) === dk(Date.now() - 864e5)) return tr('Вчера', 'Yesterday');
    var o = { day: 'numeric', month: 'long' }; if (new Date(t).getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    return new Date(t).toLocaleDateString([], o);
  }
  function listTime(t) { return !t ? '' : dk(t) === dk(Date.now()) ? hm(t) : new Date(t).toLocaleDateString([], { day: '2-digit', month: '2-digit' }); }
  function snapData(d) { return Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })); }
  function toast(text) { var el = $('#toast'); el.textContent = text; el.classList.add('is-show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('is-show'); }, 1800); }
  function reasonOf(e) { return String((e && (e.code || e.message)) || 'unknown').replace('firestore/', ''); }
  function hintOf(r) {
    return /permission/.test(r) ? tr('нет доступа — опубликуй правила Firestore для чатов', 'no access — publish the Firestore rules for chats')
      : /unavailable|network|timeout|deadline/.test(r) ? tr('нет соединения с сервером', 'cannot reach the server') : '';
  }
  var csKey = function (id) { return 'nova.cs.v1.' + me + '.' + id; };
  function csLoad() { try { var p = 'nova.cs.v1.' + me + '.'; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(p) === 0) S.cs[k.slice(p.length)] = JSON.parse(localStorage.getItem(k)); } } catch (e) {} }
  function csStore(id, s) { try { localStorage.setItem(csKey(id), JSON.stringify(s)); return true; } catch (e) { return false; } }
  function chatId(a, b) { return [a, b].sort().join('_'); }
  function otherOf(c) { return (c.members || []).filter(function (x) { return x !== me; })[0]; }
  function avSrc(u) { return !u ? '' : (u.photo || (u.avatar && NOVA.avUrl ? NOVA.avUrl(u.avatar) : '')); }
  function avHTML(u) {
    var s = avSrc(u);

    var bgs = [['', tr('Нет', 'None')], ['aurora', tr('Аврора', 'Aurora')], ['dusk', tr('Сумерки', 'Dusk')], ['spots', tr('Огни', 'Glow')]];
    return '<p class="sh-l">' + tr('Фон чата', 'Chat background') + '</p><div class="chips">' + bgs.map(function (b) { var on = b[0] ? (s.bgType === 'preset' && s.bg === b[0]) : (!s.bgType || s.bgType === 'none'); return '<button class="chip" type="button" data-bg="' + b[0] + '" aria-pressed="' + on + '">' + b[1] + '</button>'; }).join('') +
      '<button class="chip" type="button" data-img aria-pressed="' + (s.bgType === 'image') + '">' + tr('Своё изображение', 'Custom image') + '</button></div>' +
      '<p class="sh-l">' + tr('Акцентный цвет чата', 'Chat accent color') + '</p><div class="chips"><button class="csw none" type="button" data-hue="" aria-pressed="' + (s.hue == null) + '">' + tr('авто', 'auto') + '</button>' +
      Object.keys(pr).map(function (k) { var p = pr[k]; return '<button class="csw" type="button" data-hue="' + k + '" style="--h:' + p.h + ';--s:' + p.s + '%;--l:' + p.l + '%" aria-pressed="' + (s.hue != null && +s.hue === +p.h) + '" aria-label="' + esc(k) + '"></button>'; }).join('') + '</div>' +
      '<p class="sh-l">' + tr('Стиль сообщений', 'Message style') + '</p><div class="chips"><button class="chip" type="button" data-bs="glass" aria-pressed="' + (s.bubble !== 'solid') + '">' + tr('Градиент', 'Gradient') + '</button><button class="chip" type="button" data-bs="solid" aria-pressed="' + (s.bubble === 'solid') + '">' + tr('Сплошной', 'Solid') + '</button></div>' +
      '<p class="sh-l"></p><button class="chip" type="button" data-reset>' + tr('Сбросить настройки чата', 'Reset chat settings') + '</button>';
  }
  function openChatSettings() {
    openSheet(tr('Настройка чата', 'Chat settings'), csHTML(), function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-bg')) { var v = b.getAttribute('data-bg'); saveCS(v ? { bgType: 'preset', bg: v } : { bgType: 'none', bg: null }); }
      else if (b.hasAttribute('data-img')) return pickImage(function (d) { saveCS({ bgType: 'image', bg: d }); $('#shB').innerHTML = csHTML(); });
      else if (b.hasAttribute('data-hue')) { var k = b.getAttribute('data-hue'), p = NOVA.theme.presets[k]; saveCS(p ? { hue: p.h, sat: p.s, l: p.l } : { hue: null, sat: null, l: null }); }
      else if (b.hasAttribute('data-bs')) saveCS({ bubble: b.getAttribute('data-bs') });
      else if (b.hasAttribute('data-reset')) saveCS({ bgType: 'none', bg: null, hue: null, sat: null, l: null, bubble: 'glass' });
      else return;
      $('#shB').innerHTML = csHTML();
    }, 'cs', 'sh--prev');
  }

  /* ---------- конфиденциальность: «Кто видит, когда я был(а) в сети» ---------- */
  function setTexts() {
    $('#lsLabel').textContent = tr('Кто видит, когда я был(а) в сети', 'Who can see my last seen time');
    var o = $$('#lsVis .option span:last-child'); o[0].textContent = tr('Все', 'Everyone'); o[1].textContent = tr('Никто', 'Nobody'); o[2].textContent = tr('Выбрать пользователей', 'Select users');
    $('#lsPickT').textContent = tr('Выбрать пользователей', 'Select users');
    $('#cwInput').placeholder = tr('Написать сообщение…', 'Write a message…'); $('#usrInput').placeholder = tr('@username', '@username');
    $('#lsHint').textContent = tr('Если ты скрываешь время посещения, другие увидят «Был(а) недавно». Статус «В сети» виден всегда.', 'If hidden, others see “Last seen recently”. The “Online” status is always visible.');
  }
  function renderPrivacy() {
    var p = (meDoc && meDoc.privacy) || {}, v = p.lastSeen || 'everyone';
    $$('#lsVis .option').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-value') === v)); });
    $('#lsPickWrap').hidden = v !== 'custom'; $('#lsCnt').textContent = (p.allow || []).length || '';
  }
  $('#lsVis').addEventListener('click', function (e) {
    var b = e.target.closest('.option'); if (!b || !me) return;
    F.setDoc(F.doc(db, 'users', me), { privacy: { lastSeen: b.getAttribute('data-value') } }, { merge: true }).catch(fail);
    if (b.getAttribute('data-value') === 'custom') setTimeout(openPicker, 150);
  });
  $('#lsPick').addEventListener('click', openPicker);
  var pickRes = [], pickTok = 0, pickTmr;
  function openPicker() {
    pickRes = [];
    openSheet(tr('Выбрать пользователей', 'Select users'), '<input class="sh-in" id="pkIn" type="search" autocomplete="off" autocapitalize="off" placeholder="@username"><div id="pkList"></div>', function (e) {
      var b = e.target.closest('[data-pu]'); if (!b) return; var uid = b.getAttribute('data-pu'), on = ((meDoc.privacy || {}).allow || []).indexOf(uid) >= 0;
      F.setDoc(F.doc(db, 'users', me), { privacy: { allow: on ? F.arrayRemove(uid) : F.arrayUnion(uid) } }, { merge: true }).catch(fail);
    }, 'picker');
    $('#pkIn').addEventListener('input', function () {
      clearTimeout(pickTmr); var q = this.value.trim().replace(/^@+/, '').toLowerCase(), tok = ++pickTok;
      pickTmr = setTimeout(function () {
        if (!q) { pickRes = []; return pickerRender(); }
        F.getDocs(F.query(F.collection(db, 'users'), F.where('usernameLower', '>=', q), F.where('usernameLower', '<=', q + '\uf8ff'), F.limit(10))).then(function (s) {
          if (tok !== pickTok) return; pickRes = []; s.forEach(function (d) { if (d.id !== me) { var u = snapData(d); u.uid = d.id; S.users[d.id] = u; pickRes.push(d.id); } }); pickerRender();
        }).catch(function (e) { console.error('[NOVA] picker', e); });
      }, 260);
    });
    pickerRender();
  }
  function pickerRender() {
    var box = $('#pkList'); if (!box || !meDoc) return;
    var allow = (meDoc.privacy || {}).allow || [], ids = [];
    var add = function (id) { if (id && id !== me && ids.indexOf(id) < 0) ids.push(id); };
    if (pickRes.length) pickRes.forEach(add); else { allow.forEach(add); Object.keys(S.chats).forEach(function (c) { add(otherOf(S.chats[c])); }); }
    ids.forEach(function (id) { if (!S.users[id]) { watch(id); F.getDoc(F.doc(db, 'users', id)).then(function (d) { if (d.exists()) { S.users[id] = snapData(d); pickerRender(); } }).catch(function () {}); } });
    box.innerHTML = ids.length ? ids.map(function (id) {
      var u = S.users[id] || {}, on = allow.indexOf(id) >= 0;
      return '<button class="urow" type="button" data-pu="' + esc(id) + '">' + avHTML(u) + '<span class="un">' + esc(u.displayName || u.username || '…') + '<small>@' + esc(u.username || '') + '</small></span><span class="radio" style="' + (on ? 'background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--glow)' : '') + '"><svg class="ic" viewBox="0 0 24 24" style="' + (on ? 'opacity:1;transform:none' : '') + '"><use href="#ic-check"/></svg></span></button>';
    }).join('') : '<p class="sh-l">' + tr('Никого нет. Найди человека по @username.', 'Nobody here. Find someone by @username.') + '</p>';
  }

  /* ---------- клавиатура на мобильных ---------- */
  if (window.visualViewport) {
    var vv = window.visualViewport, fit = function () {
      var open = innerHeight - vv.height > 80;
      cw.style.setProperty('--vvh', open ? vv.height + 'px' : '100%'); cw.style.transform = open && vv.offsetTop ? 'translateY(' + vv.offsetTop + 'px)' : '';
      if (S.cur && open) scroller.scrollTop = scroller.scrollHeight;
    };
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
  }
  /* ---------- «Оформление профиля»: имя и username ---------- */
  var psName = $('#psName'), psUn = $('#psUn'), psSave = $('#psSave'), psTok = 0, psTmr, psUnOk = true, psDirty = false, psBusy = false;
  var UN_RE = /^[a-z0-9_]{3,20}$/i, DAY = 864e5;
  var OKI = '<svg class="ic" viewBox="0 0 24 24"><use href="#ic-check"/></svg>', XI = '<svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  function curUn() { return (meDoc && meDoc.username) || ''; }
  function daysLeft() { var t = meDoc && ms(meDoc.usernameChangedAt); return t ? Math.max(0, Math.ceil((t + 30 * DAY - Date.now()) / DAY)) : 0; }
  function waitText(n) {
    var w = n % 10 === 1 && n % 100 !== 11 ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'дня' : 'дней';
    return tr('Изменить username можно через ' + n + ' ' + w, 'You can change your username in ' + n + (n === 1 ? ' day' : ' days'));
  }
  function psMsg(txt, bad) { var m = $('#psMsg'); m.textContent = txt || ''; m.className = 'ob-hint' + (txt ? (bad ? ' bad' : ' ok') : ''); }
  function psSync() {
    if (!meDoc) { psSave.disabled = true; return; }
    var n = psName.value.trim(), nc = n && n !== (meDoc.displayName || ''), uc = psUn.value.trim().toLowerCase() !== curUn().toLowerCase();
    psSave.disabled = psBusy || (uc && !psUnOk) || !(nc || uc);
  }
  function psUnUI(st, txt) {
    var bad = st === 'taken' || st === 'bad' || st === 'wait';
    $('#psUnField').className = 'ob-field glass' + (st === 'free' ? ' ok' : bad ? ' bad' : '');
    $('#psUnState').innerHTML = st === 'check' ? '<span class="ob-spin"></span>' : st === 'free' ? OKI : bad ? XI : '';
    var h = $('#psUnHint'); h.className = 'ob-hint' + (st === 'free' ? ' ok' : bad ? ' bad' : ''); h.textContent = txt || '';
    psUnOk = !bad && st !== 'check'; psSync();
  }
  function psIdleHint() { var d = daysLeft(); return d ? waitText(d) : tr('Username можно менять раз в 30 дней', 'You can change your username once every 30 days'); }
  function fillPs() {
    if (!meDoc || psDirty) { psSync(); return; }
    psName.value = meDoc.displayName || ''; psUn.value = meDoc.username || '';
    psUnUI('idle', psIdleHint());
  }
  psName.addEventListener('input', function () { psDirty = true; psMsg(); psSync(); });
  psUn.addEventListener('input', function () {
    psDirty = true; psMsg();
    var v = psUn.value.replace(/^@+/, ''); if (v !== psUn.value) psUn.value = v;
    clearTimeout(psTmr); var my = ++psTok;
    if (v.toLowerCase() === curUn().toLowerCase()) return psUnUI('idle', psIdleHint());
    if (!UN_RE.test(v)) return psUnUI('bad', tr('От 3 до 20 символов: латиница, цифры и _', '3–20 characters: letters, digits and _'));
    var dl = daysLeft(); if (dl) return psUnUI('wait', waitText(dl));
    psUnUI('check', tr('Проверяем…', 'Checking…'));
    psTmr = setTimeout(function () {
      F.getDoc(F.doc(db, 'usernames', v.toLowerCase())).then(function (s) {
        if (my !== psTok) return;
        if (s.exists() && s.data().uid !== me) psUnUI('taken', tr('Этот username уже занят', 'This username is already taken'));
        else psUnUI('free', tr('Username свободен', 'Username is available'));
      }).catch(function () { if (my === psTok) psUnUI('bad', tr('Не удалось проверить. Проверь соединение.', 'Could not check. Check your connection.')); });
    }, 380);
  });
  [psName, psUn].forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !psSave.disabled) { el.blur(); psSave.click(); } }); });

  /* смена username одной транзакцией; 30 дней проверяются по usernameChangedAt в Firestore (+ правила, см. ниже) */
  function changeUsername(v) {
    var lower = v.toLowerCase(), uref = F.doc(db, 'users', me), nref = F.doc(db, 'usernames', lower);
    return F.runTransaction(db, function (tx) {
      var old = curUn().toLowerCase();
      return Promise.all([tx.get(uref), tx.get(nref), old ? tx.get(F.doc(db, 'usernames', old)) : Promise.resolve(null)]).then(function (r) {
        var ud = r[0].exists() ? r[0].data() : {}, at = ms(ud.usernameChangedAt), left = Math.ceil((at + 30 * DAY - Date.now()) / DAY);
        if (at && left > 0) throw { code: 'nova/wait', days: left };
        if (r[1].exists() && r[1].data().uid !== me) throw { code: 'nova/taken' };
        if (!r[1].exists()) tx.set(nref, { uid: me });
        if (r[2] && r[2].exists() && r[2].data().uid === me && old !== lower) tx.delete(r[2].ref);
        tx.update(uref, { username: v, usernameLower: lower, usernameChangedAt: F.serverTimestamp() });
      });
    });
  }
  psSave.addEventListener('click', function () {
    if (!me || !meDoc || psBusy) return;
    var n = psName.value.trim().slice(0, 32), v = psUn.value.trim();
    var nc = n && n !== (meDoc.displayName || ''), uc = v.toLowerCase() !== curUn().toLowerCase();
    if (!nc && !uc) return;
    psBusy = true; psSave.disabled = true; psMsg();
    if (nc) NOVA.profile.set({ name: n });       /* displayName уходит в Firestore обёрткой profile.set */
    (uc ? changeUsername(v) : Promise.resolve()).then(function () {
      if (uc) NOVA.profile.set({ username: v });
      psDirty = false; psMsg(tr('Сохранено', 'Saved'));
    }).catch(function (e) {
      if (e && e.code === 'nova/taken') psUnUI('taken', tr('Этот username уже занят', 'This username is already taken'));
      else if (e && e.code === 'nova/wait') psUnUI('wait', waitText(e.days));
      else { console.error('[NOVA] profile save', e); psMsg(tr('Не удалось сохранить. Попробуй ещё раз.', 'Could not save. Please try again.'), true); }
    }).then(function () { psBusy = false; fillPs(); });
  });
  window.addEventListener('nova:langchange', function () { if (!psDirty) fillPs(); });

  setTexts(); renderPrivacy();
})();

/* ---------------------------------------------------------------------
   FIRESTORE RULES — вставь ЦЕЛИКОМ (Firebase Console → Firestore → Rules → Publish):

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /users/{uid} {
         allow read: if request.auth != null;
         allow create, delete: if request.auth != null && request.auth.uid == uid;
         // username можно менять раз в 30 дней — проверяется на сервере по request.time
         allow update: if request.auth != null && request.auth.uid == uid && (
           request.resource.data.get('username', null) == resource.data.get('username', null) ||
           (request.resource.data.usernameChangedAt == request.time &&
            (resource.data.get('usernameChangedAt', null) == null ||
             resource.data.usernameChangedAt + duration.value(30, 'd') <= request.time)));
         match /chatSettings/{c} { allow read, write: if request.auth != null && request.auth.uid == uid; }
       }
       match /usernames/{n} {
         allow read: if request.auth != null;
         allow create: if request.auth != null && request.auth.uid == request.resource.data.uid;
         allow delete: if request.auth != null && request.auth.uid == resource.data.uid;
       }
       match /chats/{c} {
         allow read, update: if request.auth != null && request.auth.uid in resource.data.members;
         allow create: if request.auth != null && request.auth.uid in request.resource.data.members;
         match /messages/{m} {
           allow read, update: if request.auth != null && request.auth.uid in c.split('_');
           allow create: if request.auth != null && request.auth.uid in c.split('_') && request.resource.data.from == request.auth.uid;
           allow delete: if request.auth != null && resource.data.from == request.auth.uid;
         }
       }
     }
   }
   --------------------------------------------------------------------- */

</script>
</body>
