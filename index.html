 ctx.save();ctx.translate(0,shake*1.4);poly([[720,1080],[790,850],[865,805],[1025,810],[1110,895],[1155,1080]],'#253d39');poly([[1190,1080],[1170,890],[1240,835],[1390,850],[1510,1080]],'#253d39');
 // pistol body
 poly([[800,835],[1000,820],[1090,855],[1080,920],[970,932],[930,1010],[865,1000],[875,925],[805,910]],'#141b20','#748087',7);rr(980,835,230,48,10,'#263239','#77828a',5);rr(1180,840,120,30,5,'#171e24');poly([[965,890],[1040,890],[1050,1080],[900,1080]],'#1d272d');
 // supporting hand
 poly([[650,900],[780,850],[900,880],[950,970],[860,1015],[715,1005]],'#c38d70');
 if(flash>0){ctx.globalAlpha=flash;poly([[1240,845],[1410,710],[1360,880],[1500,950],[1310,915],[1270,1080],[1210,925],[1050,970]],'#fff3c2');circle(1290,865,135,'#fff5d2');ctx.globalAlpha=1;}
 ctx.restore();}
function drawMetro(t){ctx.fillStyle=gradient(0,H,'#263940','#080f14');ctx.fillRect(0,0,W,H);poly([[0,0],[600,170],[600,820],[0,1080]],'#18292e');poly([[1920,0],[1320,170],[1320,820],[1920,1080]],'#1a2c32');poly([[600,170],[1320,170],[1920,0],[0,0]],'#31474c');poly([[600,820],[1320,820],[1920,1080],[0,1080]],'#202d31');
 for(let i=0;i<8;i++){let y=200+i*90;line(600,y,1320,y,'#53656a',3);line(600,y,0,y-190,'#35494f',3);line(1320,y,1920,y-190,'#35494f',3);}
 // tracks
 line(780,825,550,1080,'#9ca6a3',9);line(1140,825,1380,1080,'#9ca6a3',9);for(let i=0;i<12;i++){let y=850+i*25;line(760-i*15,y,1160+i*22,y,'#3e4a4e',7);}
 // firelight refuge
 const glow=ctx.createRadialGradient(960,680,10,960,680,320);glow.addColorStop(0,'#f2a84d99');glow.addColorStop(1,'#f2a84d00');ctx.fillStyle=glow;ctx.fillRect(500,250,920,680);
}
function drawScene(kind,t,p){ctx.save();let local=t;
 if(kind==='teaser'){drawBunker(t);rr(760,285,400,495,13,'#111b20','#718087',12);let q=smooth(p);ctx.save();ctx.translate(0,0);poly([[790,315],[1130,315],[1130,750],[790,750]],gradient(315,750,'#fff8db','#d4e4df'));ctx.globalAlpha=q;circle(970,590,100,'#24343a');poly([[920,640],[1020,640],[1080,750],[860,750]],'#27373b');ctx.restore();drawPerson(630,850,1.05,{jacket:'#344d3e',pose:'run'});}
 if(kind==='city'){drawCity(t,true);for(let i=0;i<8;i++)line(i*270,0,i*270+100,500,'#ffffff22',2);if(p>.58){ctx.fillStyle='#f5f6ee';ctx.globalAlpha=(p-.58)*.7;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
 if(kind==='radio'){drawCity(t,false);rr(740,510,440,250,25,'#242b2d','#849196',8);rr(780,550,360,130,12,'#11191e');for(let i=0;i<35;i++){let x=790+i*10;line(x,610+Math.sin(i*4+t*.03)*35,x,610+Math.sin(i*4+t*.03)*-22,'#9fc5cb',3);}drawPerson(1330,900,1.18,{jacket:'#55524a',backpack:false,pose:'idle'});if(p>.5){ctx.globalAlpha=p;circle(1330,545,58,'#c9987e');rr(1265,590,140,210,30,'#55524a');ctx.globalAlpha=1;}}
 if(kind==='bunker'||kind==='bunkerMonster'||kind==='montage'||kind==='repair'||kind==='whiteNoise'||kind==='denisDoor'||kind==='reveal'||kind==='shot'||kind==='transform'){drawBunker(t);if(kind==='bunker'||kind==='montage'||kind==='repair'||kind==='whiteNoise'){drawPerson(960,950,1.1,{jacket:'#354f40',pose:kind==='repair'?'idle':'walk'});}if(kind==='bunkerMonster'){drawPerson(920,950,1,{jacket:'#354f40',pose:'run'});let mx=1280-520*smooth(p);drawMonster(mx,935,1.0,false,t);if(p>.7){flash=0;}}
 if(kind==='repair'){rr(1230,440,280,250,12,'#11191e','#77838a',6);for(let i=0;i<8;i++)line(1260,480+i*22,1470,480+i*22,i%2?'#bd7957':'#6c9b9a',5);if(p>.62){for(let i=0;i<14;i++){let x=1260+Math.random()*210,y=470+Math.random()*200;circle(x,y,3,'#ffcb69');}}}
 if(kind==='whiteNoise'){staticLevel=.35+Math.sin(t*.04)*.18;ctx.fillStyle=`rgba(210,225,220,${.08+Math.sin(t*.04)*.05})`;ctx.fillRect(0,0,W,H);if(p>.65){ctx.fillStyle='#05090d';ctx.fillRect(0,0,W,H);drawPerson(960,950,1,{jacket:'#354f40',pose:'idle'});}}
 if(kind==='denisDoor'){drawPerson(930,945,1.05,{jacket:'#354f40',pose:'idle'});if(p>.27)drawDenis(1270,950,.95,'sit');}
 if(kind==='reveal'){drawPerson(850,945,1,{jacket:'#354f40',pose:'idle'});drawDenis(1260,950,.95,'sit');if(p>.55){circle(960,505,9,'#d9ae75');}}
 if(kind==='shot'){drawBunker(t);drawDenis(1000,920,1.15,'sit');drawGunPOV(t);if(p<.1){ctx.fillStyle='#000';ctx.globalAlpha=1-p*10;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;} }
 if(kind==='transform'){drawPerson(620,950,.95,{jacket:'#354f40',pose:'idle'});let sc=1.05+Math.sin(p*Math.PI)*.15;drawMonster(1190,945,sc,false,t);if(p>.7){ctx.globalAlpha=(p-.7)*2;ctx.fillStyle='#070b0e';ctx.fillRect(1040,870,350,110);ctx.globalAlpha=1;}}
 }
 if(kind==='pack'){drawBunker(t);drawPerson(980,950,1.1,{jacket:'#354f40',pose:'walk'});rr(1210,475,270,220,12,'#10191e','#65747b',5);text('20 METРОВ',1345,535,28,'#d8c9a7','center',800);text('МИМИКИ',1345,585,23,'#a9c4c9','center');}
 if(kind==='outside'||kind==='search'||kind==='ambush'||kind==='winged'){drawCity(t,false);drawSnow(t,true);if(kind==='outside'){drawPerson(960,960,1.15,{jacket:'#354f40',pose:'idle'});rr(1060,610,115,55,18,'#151d22','#94a5a8',4);line(1080,620,1080,655,'#9bbbc3',5);}
 if(kind==='search'){drawPerson(950+Math.sin(t*.001)*120,960,1.05,{jacket:'#354f40',pose:'walk'});for(let i=0;i<7;i++){circle(310+i*205,860+(i%2)*24,8,'#20292e');} }
 if(kind==='ambush'){drawPerson(1000,960,1.1,{jacket:'#354f40',pose:'walk'});drawMonster(1110,940,1.0,false,t);if(p>.75){shake=7;}}
 if(kind==='winged'){drawPerson(800,960,1.05,{jacket:'#354f40',pose:'run'});let xx=1470-750*smooth(p);drawMonster(xx,610+Math.sin(t*.008)*45,1.1,true,t);if(p>.72){shake=9;}}
 }
 if(kind==='metro'||kind==='reunion'||kind==='cliff'){drawMetro(t);if(kind==='metro'){drawPerson(950,950,1.0,{jacket:'#354f40',pose:'walk'});}
 if(kind==='reunion'){drawPerson(650,950,.95,{jacket:'#354f40',pose:'idle'});drawDenis(1120,930,1.0,'sit');rr(880,825,170,18,5,'#534332');for(let i=0;i<9;i++){let yy=815-Math.random()*110;poly([[960+(Math.random()-.5)*25,yy],[930+(Math.random()-.5)*35,yy+40],[980+(Math.random()-.5)*35,yy+25]],'#ffb34f');}circle(960,690,180,'#e59d4a0c');}
 if(kind==='cliff'){drawDenis(1040,930,1,'sit');drawPerson(600,960,1,{jacket:'#354f40',pose:'idle'});let s=.5+smooth(p)*1.5;drawMonster(1100-s*120,500+s*210,s,true,t);if(p>.7){ctx.fillStyle='#edf3ef';ctx.globalAlpha=(p-.7)*2;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
 }
 // scene-specific atmosphere
 if(['city','radio','outside','search','ambush','winged'].includes(kind))vignette(.45);else vignette(.62);
 // subtle film grain
 if(['shot','whiteNoise'].includes(kind)){for(let i=0;i<120;i++){ctx.globalAlpha=Math.random()*.12;ctx.fillStyle='#fff';ctx.fillRect(Math.random()*W,Math.random()*H,2,2);}ctx.globalAlpha=1;}
 ctx.restore();}
function drawOverlay(s,p,t){ // cinematic title and subtitles
 if(s.kind==='city'&&p<.25){rr(60,105,410,64,5,'#07101799');text('17 ОКТЯБРЯ  ·  03:17',88,149,30,'#f0eee6','left',800);}
 if(s.kind==='whiteNoise'){text(`${Math.min(10,Math.floor(p*13)+1)}`,W/2,250,92,'#e8e9df','center',900);}
 if(s.kind==='shot'){text('POV · АРТЁМ',W-90,125,22,'#bac8cb','right',700);}
 if(s.kind==='pack'){text('20 М',W/2,300,58,'#d5c5a0','center',900);}
 if(s.kind==='outside'&&p>.65){text('−20 °C',W-100,160,42,'#d9e7e9','right',800);}
 if(s.kind==='reunion'){text('НАКОНЕЦ-ТО',W/2,230,54,'#ecd6ae','center',900);}
 if(subtitles){const caption=captionFor(s,p);if(caption){let lines=wrapText(caption,74);let boxH=lines.length*40+46;rr(210,H-boxH-70,1500,boxH,12,'#05090dd9','#ffffff20',2);lines.forEach((l,i)=>text(l,W/2,H-92-(lines.length-1-i)*40,31,'#f6f7f4','center',700));}}
 if(flash>0){ctx.fillStyle=`rgba(255,245,218,${flash})`;ctx.fillRect(0,0,W,H);}
}
function captionFor(s,p){if(s.kind==='shot'&&p<.48)return '— Это не ты.';if(s.kind==='reunion'&&p>.58)return 'АРТЁМ: «Наконец-то». ';if(s.kind==='denisDoor'&&p>.55)return 'ДЕНИС: «Открой. Это я». ';return s.caption;}
function wrapText(str,max){const words=str.split(' '),out=[];let line='';for(const w of words){if((line+' '+w).trim().length>max){out.push(line);line=w;}else line=(line+' '+w).trim();}if(line)out.push(line);return out;}
function sceneAt(t){let acc=0;for(let i=0;i<scenes.length;i++){if(t<acc+scenes[i].dur)return {i,local:t-acc,p:(t-acc)/scenes[i].dur};acc+=scenes[i].dur;}return {i:scenes.length-1,local:scenes.at(-1).dur,p:1};}
function render(ts){if(!running)return;if(!paused){if(!lastTs)lastTs=ts;let dt=Math.min(.05,(ts-lastTs)/1000);elapsed+=dt;lastTs=ts;}else lastTs=ts;
 if(elapsed>=total){elapsed=total;paused=true;stage.classList.add('paused');pauseBtn.textContent='▶';}
 const at=sceneAt(elapsed);if(at.i!==sceneIndex){sceneIndex=at.i;enterScene(scenes[sceneIndex]);}
 if(scenes[at.i].kind==='shot' && at.local>3.6 && !gunFired){gunFired=true;sfx('gun');shake=18;flash=1;}
 shake*=.86;if(shake<.15)shake=0;flash*=.84;if(flash<.015)flash=0;
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawScene(scenes[at.i].kind,elapsed,at.p);drawOverlay(scenes[at.i],at.p,elapsed);ctx.restore();
 sceneLabel.textContent=scenes[at.i].name;progressFill.style.width=(elapsed/total*100)+'%';
 requestAnimationFrame(render);
}
function enterScene(s){staticLevel=0;headphoneMix=0;speakLine(s.caption);switch(s.kind){case'teaser':sfx('metal');break;case'city':sfx('deep');break;case'radio':sfx('static');break;case'bunkerMonster':sfx('scrape');setTimeout(()=>{if(running&&!paused&&scenes[sceneAt(elapsed).i]?.kind==='bunkerMonster')sfx('impact');},6000);break;case'repair':sfx('electric');break;case'whiteNoise':sfx('static');break;case'denisDoor':sfx('knock');break;case'shot':gunFired=false;break;case'transform':sfx('transform');break;case'outside':headphoneMix=1;sfx('windMuffled');break;case'ambush':sfx('thudMuffled');shake=8;break;case'winged':sfx('wingMuffled');shake=7;break;case'metro':sfx('metroMuffled');break;case'reunion':sfx('fire');break;case'cliff':sfx('wingMuffled');shake=12;break;}}
// Minimal procedural sound design: no external audio files or network requests.
function ensureAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();master=audioCtx.createGain();master.gain.value=muted?0:.55;master.connect(audioCtx.destination);}
function tone(freq,dur,type='sine',vol=.15,slide=0){if(!audioCtx||muted)return;const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(10,freq+slide),now+dur);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(master);o.start(now);o.stop(now+dur+.03);}
function noise(dur,vol=.1,filter=1600){if(!audioCtx||muted)return;const n=Math.floor(audioCtx.sampleRate*dur),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=Math.random()*2-1;const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=filter;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);src.connect(f);f.connect(g);g.connect(master);src.start();}
function sfx(type){if(!audioCtx||muted)return;switch(type){case'metal':noise(.9,.22,800);tone(75,.8,'sawtooth',.16,-45);break;case'deep':tone(48,2,'sine',.15,-15);break;case'static':noise(2.4,.12,5000);tone(110,.9,'sawtooth',.035,-35);break;case'scrape':noise(1.2,.22,1200);tone(65,.8,'triangle',.12,-20);break;case'impact':tone(58,.45,'sine',.3,-35);noise(.28,.2,500);break;case'electric':tone(180,.15,'square',.08,360);noise(.4,.1,3000);break;case'knock':[0,.32,.64].forEach(v=>setTimeout(()=>{tone(90,.2,'triangle',.28,-35);noise(.13,.12,550);},v*1000));break;case'gun':noise(.5,.5,2400);tone(62,.55,'sawtooth',.42,-40);setTimeout(()=>tone(45,.9,'sine',.18,-25),120);break;case'transform':noise(1.3,.22,900);tone(80,1.2,'sawtooth',.2,110);break;case'windMuffled':noise(2.2,.035,180);break;case'thudMuffled':tone(65,.28,'sine',.12,-24);break;case'wingMuffled':noise(.65,.06,300);tone(42,.5,'triangle',.08,-15);break;case'metroMuffled':tone(55,2,'sine',.08,-10);break;case'fire':noise(2,.07,1200);tone(110,.6,'sine',.04,20);break;}}
function speakLine(line){
 if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance==='undefined' || muted)return;
 try{speechSynthesis.cancel();const clean=line.replace(/^ДЕНИС:\s*/,'').replace(/^АРТЁМ:\s*/,'').replace(/[«»]/g,'').replace(/^—\s*/,'');const u=new SpeechSynthesisUtterance(clean);u.lang='ru-RU';u.rate=.94;u.pitch=.88;u.volume=.9;const voices=speechSynthesis.getVoices();const ru=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ru'));if(ru)u.voice=ru;speechSynthesis.speak(u);}catch(e){}
}
function start(){ensureAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();running=true;paused=false;elapsed=0;sceneIndex=-1;lastTs=0;startScreen.classList.add('hidden');stage.classList.add('playing');stage.classList.remove('paused');pauseBtn.textContent='Ⅱ';requestAnimationFrame(render);}
function togglePause(){if(!running)return;paused=!paused;stage.classList.toggle('paused',paused);pauseBtn.textContent=paused?'▶':'Ⅱ';if(!paused){lastTs=0;requestAnimationFrame(render);}}
function toggleMute(){muted=!muted;if(master&&audioCtx)master.gain.setTargetAtTime(muted?0:.55,audioCtx.currentTime,.04);if(muted&&'speechSynthesis' in window)speechSynthesis.cancel();soundBtn.textContent=muted?'ЗВУК ВЫКЛ':'ЗВУК ВКЛ';}
function restart(){running=false;paused=false;elapsed=0;sceneIndex=-1;startScreen.classList.remove('hidden');stage.classList.remove('playing','paused');progressFill.style.width='0%';sceneLabel.textContent='ПИЛОТНАЯ СЕРИЯ';}
document.getElementById('startBtn').addEventListener('click',start);
pauseBtn.addEventListener('click',togglePause);
soundBtn.addEventListener('click',toggleMute);
subBtn.addEventListener('click',()=>{subtitles=!subtitles;subBtn.textContent=subtitles?'СУБТИТРЫ':'БЕЗ ТЕКСТА';});
document.getElementById('restartBtn').addEventListener('click',restart);
document.getElementById('progress').addEventListener('click',e=>{if(!running)return;const r=e.currentTarget.getBoundingClientRect();elapsed=clamp((e.clientX-r.left)/r.width,0,1)*total;sceneIndex=-1;if(paused){paused=false;stage.classList.remove('paused');pauseBtn.textContent='Ⅱ';requestAnimationFrame(render);}lastTs=0;});
// Draw a quiet poster behind the start button.
ctx.fillStyle=gradient(0,H,'#20343a','#080d12');ctx.fillRect(0,0,W,H);drawBunker(0);drawPerson(740,950,1.12,{jacket:'#354f40',pose:'idle'});drawMonster(1300,940,1.0,false,0);vignette(.72);
})();
