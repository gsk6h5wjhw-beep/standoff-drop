let ac=null,master=null,audioReady=false;function audioStart(){if(audioReady)return;audioReady=true;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A;master=ac.createGain();master.gain.value=.20;master.connect(ac.destination);const n=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const ws=ac.createBufferSource();ws.buffer=n;ws.loop=true;const wf=ac.createBiquadFilter();wf.type='lowpass';wf.frequency.value=560;const wg=ac.createGain();wg.gain.value=.022;ws.connect(wf).connect(wg).connect(master);ws.start();setInterval(()=>bird(),9000+Math.random()*7000);setInterval(()=>bell(),30000+Math.random()*12000)}function bird(){if(!ac||ac.state!=='running')return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(1300+Math.random()*500,ac.currentTime);o.frequency.exponentialRampToValueAtTime(2100,ac.currentTime+.13);o.frequency.exponentialRampToValueAtTime(1200,ac.currentTime+.36);g.gain.setValueAtTime(.00001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.01,ac.currentTime+.03);g.gain.exponentialRampToValueAtTime(.00001,ac.currentTime+.42);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+.45)}function bell(){if(!ac||ac.state!=='running')return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=147;g.gain.setValueAtTime(.00001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.009,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.003,ac.currentTime+1.8);g.gain.exponentialRampToValueAtTime(.00001,ac.currentTime+8.5);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+8.7);setTimeout(()=>{if(!ac)return;const p=ac.createOscillator(),pg=ac.createGain();p.type='sine';p.frequency.value=294;pg.gain.setValueAtTime(.00001,ac.currentTime);pg.gain.exponentialRampToValueAtTime(.003,ac.currentTime+.08);pg.gain.exponentialRampToValueAtTime(.00001,ac.currentTime+6);p.connect(pg).connect(maste let last=performance.now();function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000);last=t;let dx=0,dz=0;if(keys.w||keys.arrowup)dz++;if(keys.s||keys.arrowdown)dz--;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;for(const s of touches.values())if(s.type==='move'){dx+=(s.x-s.ox)/70;dz-=(s.y-s.oy)/70}const L=Math.hypot(dx,dz);if(L>1){dx/=L;dz/=L}const speed=.105,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);let nx=cam.position.x+(rx*dx+fx*dz)*speed,nz=cam.position.z+(rz*dx+fz*dz)*speed;if(!blocked(nx,cam.position.z,cam.position.y))cam.position.x=nx;if(!blocked(cam.position.x,nz,cam.position.y))cam.position.z=nz;vy-=.52*dt;cam.position.y+=vy;const target=floorY(cam.position.x,cam.position.z,cam.position.y);if(cam.position.y<=target){cam.position.y=target;vy=0;ground=true}else ground=false;cam.rotation.y=yaw;cam.rotation.x=pitch;for(const c of clouds)c.position.x+=dt*.28;if(clouds[0].position.x>120)clouds[0].position.x=-120;if(clouds[1].position.x>130)clouds[1].position.x=-130;if(clouds[2].position.x>150)clouds[2].position.x=-150;if(clouds[3].position.x>130)clouds[3].position.x=-130;r.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
