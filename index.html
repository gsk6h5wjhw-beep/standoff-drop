<!DOCTYPE html>
<html lang="ru">
<head>

<title>FORESCAN — демо</title>
<style>
/* ===== Design tokens ===== */
:root{--bg:#04061a;--p:rgba(13,19,60,.64);--b:rgba(110,140,255,.2);--a1:#1e90ff;--a2:#18c6ff;--tx:#eef2ff;--mu:#93a0d0;--ok:#2ee59d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 Inter,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--tx);overflow:hidden;background:radial-gradient(900px 520px at 72% -5%,#16288066,transparent),radial-gradient(700px 500px at 0 100%,#3a198a44,transparent),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;outline:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[data-ic]{display:inline-flex}
.mut{color:var(--mu)}
h2{font-size:26px}h3{font-size:16px;margin-bottom:6px}
h4{font-size:12px;letter-spacing:.08em;color:var(--mu);margin:14px 4px 8px}
/* ===== Layout ===== */
.app{height:100vh;display:grid;grid-template:72px minmax(0,1fr)/232px minmax(0,1fr);gap:0 18px;padding:0 18px 16px}
header{grid-column:1/3;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;width:214px;font-weight:800;font-size:22px;letter-spacing:.07em;cursor:pointer}
.sbar{flex:1;max-width:820px;height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:14px;border:1px solid var(--b);background:#0a1038aa;color:var(--mu);text-align:left;transition:.25s}
.sbar:hover{border-color:var(--a1);box-shadow:0 0 26px #1e90ff33}
.sbar>span:nth-child(2){flex:1}
kbd{font:12px inherit;padding:4px 10px;border-radius:8px;background:#ffffff12;border:1px solid var(--b);color:var(--tx)}
.ib{width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;color:var(--mu);transition:.2s}
.ib:hover{color:#fff;background:#ffffff14}
.ib.on{color:#ffd24a}.ib.t.on{color:#4fd0ff}
.bell{position:relative;margin-left:auto;width:46px;height:46px;border:1px solid var(--b);background:#0a1038aa;color:var(--tx)}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
.prof{position:relative}
.pbtn{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:16px;border:1px solid var(--b);background:#0a1038aa;text-align:left}
.pbtn b{display:block}
.tag{font-size:10px;font-weight:700;font-style:normal;padding:1px 8px;border-radius:8px;background:linear-gradient(90deg,var(--a2),#1e7bff)}
.av{width:38px;height:38px;border-radius:50%}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:230px;padding:12px;border-radius:16px;border:1px solid var(--b);background:#0b1140f2;backdrop-filter:blur(18px);box-shadow:0 20px 50px #000a;opacity:0;visibility:hidden;translate:0 -8px;transition:.22s;z-index:30}
.menu.on{opacity:1;visibility:visible;translate:0 0}
.mh{display:flex;gap:10px;align-items:center;padding:6px 6px 12px;border-bottom:1px solid var(--b);margin-bottom:6px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;color:var(--mu);text-align:left}
.menu button:hover{background:#ffffff12;color:#fff}
.side{display:flex;flex-direction:column;gap:6px;min-height:0;padding-top:8px}
.nv{display:flex;align-items:center;gap:14px;height:50px;padding:0 18px;border-radius:14px;color:var(--mu);text-align:left;transition:.25s}
.nv:hover{background:#ffffff0d;color:#fff}
.nv.on{color:#fff;background:linear-gradient(90deg,#3d5cff,#18c6ff);box-shadow:0 8px 28px #1e7bff66}
.prem{margin-top:auto;text-align:center;display:grid;gap:8px;justify-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 24px;border-radius:13px;font-weight:600;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 8px 26px #1e7bff55;transition:.25s}
.btn:hover{translate:0 -2px;box-shadow:0 12px 34px #7b5dff88;filter:brightness(1.1)}
/* ===== Cards ===== */
main{overflow-y:auto;overflow-x:hidden;min-width:0;padding:2px 4px 8px 2px;perspective:1400px;scrollbar-width:thin;scrollbar-color:#3b4a9a transparent}
.card{background:var(--p);border:1px solid var(--b);border-radius:18px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 14px 40px #0007,inset 0 1px 0 #ffffff14;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s,border-color .3s,box-shadow .3s,translate .3s;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.card:hover{border-color:#7b95ff66;box-shadow:0 18px 50px #000a,0 0 34px #3b5bff22,inset 0 1px 0 #ffffff1c}
@keyframes rise{from{opacity:0;translate:0 22px}}
@keyframes fade{from{opacity:0}}
.ch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:14px}
.ch>.i{color:#4fb0ff}
.ch a{margin-left:auto;font-size:12px;font-weight:500;color:#7ea6ff;cursor:pointer}
.home,.pg{animation:fade .4s}
.home{display:grid;grid-template-columns:1.1fr 1.3fr .85fr;gap:16px}
.hero{grid-column:1/3;min-height:320px;position:relative;overflow:hidden;padding:36px}
.ht{position:relative;z-index:2;max-width:56%}
.hero h1{font-size:clamp(38px,4.2vw,64px);line-height:1.04;font-weight:800;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#1e90ff,#29c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px 0 26px;font-size:18px;color:#c9d2f5}
.globe{position:absolute;right:-30px;top:-40px;width:min(520px,52%);aspect-ratio:1;transition:transform .4s ease-out}
.globe svg{width:100%;height:100%;overflow:visible}
.ln{fill:none;stroke:#5b8bff;stroke-opacity:.28;stroke-width:.8}
.orb{transform-origin:200px 200px;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dt{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}}
.big{display:flex;align-items:center;gap:14px;font-size:38px;font-weight:800}
.big small{display:block;font-size:13px;font-weight:400;color:var(--mu)}
.big .i{width:44px;height:44px;color:#2ee5d0}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.mt b{display:block;font-size:18px}.mt small{color:var(--mu);font-size:11px}.mt .i{width:26px;height:26px;color:#4fb0ff}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;transition:.2s}
.row:hover{background:#ffffff0c}
.rk{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:#4a3cff;flex:none}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none;background:linear-gradient(135deg,hsl(var(--h) 80% 55%),hsl(calc(var(--h) + 60) 70% 30%))}
.nm{flex:1;font-weight:600;min-width:0}
.nm small{display:block;font-weight:400;color:var(--mu);font-size:11px}
.up{color:var(--ok);font-weight:600;font-size:13px;white-space:nowrap}
.sp{width:72px;height:28px;flex:none}
.sp path,.l2{fill:none;stroke:#29c8ff;stroke-width:2;stroke-dasharray:1;animation:dr 1.3s ease-out backwards}
@keyframes dr{from{stroke-dashoffset:1}}
.per{margin-left:auto;display:flex;gap:4px;padding:3px;border-radius:12px;background:#ffffff0d}
.per button{padding:5px 12px;border-radius:9px;font-size:12px;font-weight:500;color:var(--mu);transition:.2s}
.per .on{background:linear-gradient(90deg,#4a3cff,#18c6ff);color:#fff;box-shadow:0 0 16px #1e90ff88}
.gl{stroke:#ffffff14}.ax{fill:var(--mu);font-size:11px}
.ar{animation:fade 1s backwards}
.l2{stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px #7b5dff)}
.art{height:130px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:12px;background:radial-gradient(circle at 30% 20%,#3a2bd6,#0a0f3a)}
.art svg{width:100%;height:100%}
.bdg{position:absolute;top:10px;right:10px;font-size:11px;padding:3px 10px;border-radius:8px;color:var(--ok);background:#0a3a2c99;border:1px solid #2ee59d55}
.ben{grid-column:1/4;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ben .card{display:flex;gap:14px;align-items:center;padding:18px}
.ben .card:hover{translate:0 -5px}
.ben .i{width:34px;height:34px;color:#4fb0ff;transition:.3s}
.ben .card:hover .i{color:#7fdcff;filter:drop-shadow(0 0 8px #18c6ff)}
.ben small{color:var(--mu)}
/* ===== Section pages ===== */
.pg{display:flex;flex-direction:column;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--b);color:var(--mu);font-size:13px;transition:.2s}
.chip:hover{color:#fff;border-color:var(--a1)}
.chip.on{color:#fff;background:linear-gradient(90deg,#3d5cff,#18c6ff);border-color:transparent}
.chip:disabled{opacity:.45;cursor:default}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cat{text-align:left;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.tl{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px #1e7bff55}
.qi{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--b);background:#0a1038aa}
.qi input{flex:1;background:none;border:0}
.qi:focus-within{border-color:var(--a1);box-shadow:0 0 26px #1e90ff44}
.sw{width:46px;height:26px;border-radius:13px;background:#ffffff1f;position:relative;transition:.25s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw.on{background:linear-gradient(90deg,var(--a1),var(--a2))}.sw.on:after{left:23px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--b)}
.sq{width:26px;height:26px;border-radius:8px;border:2px solid transparent}.sq.on{border-color:#fff}
.set input{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--b);background:#0a1038}
/* ===== Overlays ===== */
.scrim{position:fixed;inset:0;background:#02041099;backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.ov{position:fixed;z-index:50;opacity:0;visibility:hidden;transition:.3s cubic-bezier(.2,.8,.2,1);background:#0a1040f2;border:1px solid var(--b);backdrop-filter:blur(20px);box-shadow:0 30px 80px #000c}
.ov.on{opacity:1;visibility:visible}
.modal{left:50%;top:11vh;width:min(680px,92vw);border-radius:22px;padding:18px;translate:-50% 14px;scale:.96}
.modal.on{translate:-50% 0;scale:1}
#sm .qi{box-shadow:0 0 0 1px var(--a1),0 0 34px #1e90ff55}
#sb{max-height:56vh;overflow:auto}
.sr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left}
.sr:hover{background:#ffffff12}.sr small{color:var(--mu);flex:1}.sr .i{color:var(--mu)}
.fld{display:block;margin:12px 0;color:var(--mu)}
.fld input{width:100%;height:44px;margin-top:6px;padding:0 14px;border-radius:12px;border:1px solid var(--b);background:#0a1038}
.panel{right:16px;top:76px;width:380px;max-height:70vh;overflow:auto;border-radius:20px;padding:18px;translate:30px 0}
.panel.on{translate:0 0}
.nt{display:flex;gap:12px;padding:12px;border-radius:12px;cursor:pointer;opacity:.6;transition:.2s}
.nt.u{opacity:1;background:#3b5bff1f}.nt:hover{background:#ffffff12}
.nt i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.nt.u i{background:var(--a1);box-shadow:0 0 8px var(--a1)}
.nt small{display:block;color:var(--mu)}
#toasts{position:fixed;bottom:22px;left:50%;translate:-50% 0;z-index:80;display:grid;gap:8px}
.toast{padding:10px 18px;border-radius:12px;background:#101a5af0;border:1px solid var(--b);animation:rise .4s}
/* ===== Reduced motion ===== */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nomo *{animation:none!important;transition:none!important}

/* ===== Reference redesign: 1:1 stage, liquid glass ===== */

const S={view:'home',q:'',cat:'all',per:1,acc:0,motion:true,notif:true,track:new Set(['Standoff 2','Нейро-агенты']),fav:new Set(['Minecraft']),recent:['Roblox','нейро-агенты']};
const $=s=>document.querySelector(s);

/* ===== Helpers: seeded data, smooth SVG paths ===== */
const rnd=s=>()=>(s=s*16807%2147483647)/2147483647;
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%2147483646,7)+1;
const series=(n,seed)=>{const r=rnd(seed),a=[];let v=30;for(let i=0;i<n;i++){v=Math.max(5,Math.min(95,v+(r()-.42)*14));a.push(v)}return a};
const path=(a,w,h,pad=4,lo=Math.min(...a),hi=Math.max(...a))=>{const X=i=>i*w/(a.length-1),Y=v=>h-pad-(v-lo)/(hi-lo||1)*(h-2*pad);let d=`M0 ${Y(a[0])}`;for(let i=1;i<a.length;i++){const m=(X(i-1)+X(i))/2;d+=`C${m} ${Y(a[i-1])} ${m} ${Y(a[i])} ${X(i)} ${Y(a[i])}`}return d};
const spark=a=>`<svg class="sp" viewBox="0 0 72 28"><path d="${path(a,72,28)}" pathLength="1"/></svg>`;

/* ===== Reusable components ===== */
const row=(x,i,full)=>`<div class="row"${full?'':` data-act="pick" data-v="${x.n}" style="cursor:pointer"`}>${IMG[x.n]?`<img class="tile" src="${IMG[x.n]}" alt="">`:`<span class="tile" style="--h:${hash(x.n)%360}">${x.n[0]}</span>`}<span class="nm">${x.n}<small>${t('c_'+x.c)}</small></span><span class="up">↑ +${x.g}%</span>${spark(series(20,hash(x.n)))}${full?`<button class="ib ${S.fav.has(x.n)?'on':''}" data-act="fav" data-v="${x.n}">${ic('star')}</button><button class="ib t ${S.track.has(x.n)?'on':''}" data-act="trk" data-v="${x.n}">${ic('eye')}</button>`:''}</div>`;
const list=(a,full)=>a.length?a.map((x,i)=>row(x,i,full)).join(''):`<p class="mut" style="padding:14px">${t('empty')}</p>`;
const saved=(set,title)=>`<div class="pg"><h2>${title}</h2><div class="card flat">${list(TOPICS.filter(x=>S[set].has(x.n)),1)}</div><h4>${t('addTo')}</h4><div class="chips">${TOPICS.filter(x=>!S[set].has(x.n)).map(x=>`<button class="chip" data-act="${set=='fav'?'fav':'trk'}" data-v="${x.n}">+ ${x.n}</button>`).join('')}</div></div>`;

const fmt=n=>n==null||isNaN(n)?'—':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('ru');
const dur=s=>s==null||isNaN(s)?'—':Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const ytKP=()=>{const M=YT.M;return[['y28v',fmt(M.v28),'','eye'],['mSubs',fmt(M.subs),'','users'],['mWatch',M.hours==null?'—':fmt(M.hours)+' '+t('hrs'),'','clock'],['yAvgS',dur(M.avg),'','play']]};
const kpHTML=()=>ytKP().map(k=>`<div><small>${t(k[0])}</small><b>${k[1]}</b>${ic(k[3])}</div>`).join('');
function ytHTML(re){const s=YT.state;let body;
if(s=='on')body=`<div class="ch2"><div class="ring">${ic('crown')}</div><div style="min-width:0"><b style="font-size:20px">${esc(YT.M.title||'—')}</b><div class="mut">${esc(YT.M.handle||'')}</div></div></div><div class="kp">${kpHTML()}</div><button class="yb" data-act="yt">${ic('chart')}${t('open')} →</button>`;
else body=`<div class="yem">${ic('chart')}<p>${t('ys_'+s)}</p>${s=='loading'?'<i class="sk"></i>':s=='anon'?`<button class="btn" data-act="login">${t('login')}</button>`:s=='err'?`<p class="mut" style="font-size:12px">${esc(YT.err)}</p><button class="btn" data-act="ytr">${t('retry')}</button>`:`<button class="btn" data-act="ytc">${t('ytc')}</button>`}</div>`;
return `<section class="card flat" id="yt"${re?' style="animation:none"':''}><div class="yh"><span class="ytl"></span>${t('ytT')}<span class="dm ${s=='on'?'':'off'}">${t(s=='on'?'live':'noconn')}</span></div>${body}</section>`}
function renderYT(){const e=$('#yt');if(e&&S.view=='home'&&!$('#yp.on'))e.outerHTML=ytHTML(1);if($('#pm.on')&&S.user)renderPM()}
async function checkYT(){if(!S.user)return;const id=++YT.id;YT.state='loading';YT.err='';renderYT();
try{const st=await api('/api/youtube/status');if(id!=YT.id)return;const c=find(st,['connected','isconnected']),sv=find(st,['status']);
const on=c===true||sv==='connected',off=c===false||['not_connected','disconnected','none'].includes(sv);
if(off){YT.state='off';YT.M=null}else if(!on)throw new Error(t('badfmt'));else{const an=await api('/api/youtube/analytics');if(id!=YT.id)return;YT.M=parseAn(an);YT.state='on'}}
catch(e){if(id!=YT.id)return;YT.state='err';YT.M=null;YT.err=e.status?`${t('apiErr')} ${e.status}: ${e.message}`:(e.message==t('badfmt')?e.message:t('netErr'))}
renderYT()}
async function ytConnect(){if(!S.user)return ACT.login();try{toast('ytGo');const j=await api('/auth/google/start',{method:'POST'});const u=find(j,['url','authurl','authorizationurl','authorization_url']);
if(!/(^|\.)google\.com$/.test(new URL(u).hostname))throw new Error('bad url');location.href=u}catch(e){console.error(e);toast('ytFail')}}
function ytFill(){const M=YT.M,x=(k,c)=>M.ser[k]&&M.ser[k].length>1?area(M.ser[k],c):`<p class="mut">${t('noser')}</p>`;
$('#ytn').textContent=M.title||'—';$('#yth').textContent=M.handle||'';$('#yk').innerHTML=kpHTML();
$('#yc1').innerHTML=x('views','#22d3ee');$('#yc2').innerHTML=x('subscribersGained','#2ee59d')+`<small class="mut">${t('lost')}: ${fmt(M.lost)}</small>`;
$('#yc3').innerHTML=x('estimatedMinutesWatched','#7fdcff');$('#yc4').innerHTML=x('averageViewDuration','#4f8bff');
$('#ytop').innerHTML=[['videosL',fmt(M.videos)],['tvL',fmt(M.tv)],['gained',fmt(M.gain)],['lost',fmt(M.lost)]].map(r=>`<div class="set"><span class="mut">${t(r[0])}</span><b>${r[1]}</b></div>`).join('')}
function renderPM(){const u=S.user,s=YT.state;let y;
y=s=='on'?`<b>${t('ytOn')}: ${esc(YT.M.title||'')}</b>`:s=='loading'?`<span class="mut">${t('ys_loading')}</span>`:s=='err'?`<button class="chip" data-act="ytr">${t('retry')}</button>`:`<button class="btn" style="height:38px" data-act="ytc">${t('ytc')}</button>`;
$('#pb').innerHTML=`<div class="set"><span class="mut">${t('email')}</span><b style="overflow-wrap:anywhere">${esc(u.email)}</b></div><div class="set"><span class="mut">Email</span>${u.emailVerified?`<b style="color:var(--ok)">${t('vOk')}</b>`:`<button class="chip" data-act="resend">${t('resend')}</button>`}</div><div class="set"><span>YouTube</span>${y}</div>${s=='err'?`<p class="mut" style="font-size:12px">${esc(YT.err)}</p>`:''}<button class="btn" style="width:100%;margin-top:14px;background:#ffffff14;box-shadow:none" data-act="logout">${t('logout')}</button>`}
function initAuth(){['ae','ap','ap2'].forEach(i=>$('#'+i).onkeydown=e=>{if(e.key=='Enter')ACT.aSub()});renderUser();
if(!auth){YT.state='err';YT.err=t('noFb');renderYT();return}
auth.onAuthStateChanged(async u=>{S.user=u;renderUser();
if(u){await checkYT();if(ypar){toast(ypar=='connected'?(YT.state=='on'?'ytOk':'ytNot'):'ytFail');ypar=null}}
else{YT.id++;YT.state='anon';YT.M=null;renderYT();if(ypar){toast('needAuth');ypar=null}}})}
/* ===== Init ===== */
function applyLang(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));document.querySelectorAll('[data-av]').forEach(e=>e.innerHTML=AV);document.querySelectorAll('[data-logo]').forEach(e=>e.src=IMG.logo);
$('#nav').innerHTML='<i id="ind"></i>'+[['home','home'],['trends','search'],['cats','grid'],['track','eye'],['favs','star'],['settings','gear']].map(([k,i])=>`<button class="nv" data-act="go" data-v="${k}">${ic(i)}<span data-s="${t(k+'S')==k+'S'?'':t(k+'S')}">${t(k)}</span></button>`).join('');renderN()}
applyLang();go('home');initAuth();
</script>
</body>
</html>
