<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />

<title>Sandstone · 2.0</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a0a;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;opacity:.85}
#crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 3px rgba(0,0,0,.8)}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{left:0;top:50%;width:100%;height:2px;transform:translateY(-50%)}
#crosshair .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.95);transform:translate(-50%,-50%);box-shadow:0 0 4px rgba(0,0,0,.8)}
#fps{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px);padding:5px 10px;border-radius:10px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);letter-spacing:.05em;font-variant-numeric:tabular-nums}
#zone{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:calc(env(safe-area-inset-left) + 14px);padding:5px 12px;border-radius:10px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);letter-spacing:.1em;text-transform:uppercase}
#hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:1.55;max-width:min(90vw,460px);opacity:1;transition:opacity .6s ease;letter-spacing:.01em}
#hint.hide{opacity:0;pointer-events:none}
#hint b{color:#ffcc66;font-weight:800;letter-spacing:.02em}
#hint kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:11px;font-weight:700;margin:0 1px}
#loader{position:fixed;inset:0;z-index:100;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s ease;color:#fff;pointer-events:auto}
#loader.hide{opacity:0;pointer-events:none}
#loader .logo{font-size:56px;font-weight:900;letter-spacing:-.06em;background:linear-gradient(135deg,#f5b400,#e5484d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(245,180,0,.3)}
#loader .sub{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.3em;text-transform:uppercase;font-weight:800}
#loader .bar{width:220px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
#loader .bar i{position:absolute;inset:0;background:linear-gradient(90deg,#f5b400,#e5484d);transform:translateX(-100%);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}50%{transform:translateX(0)}100%{transform:translateX(100%)}}
#mobile{position:fixed;inset:0;z-index:9;pointer-events:none;display:none}
body.touch #mobile{display:block}
#joy{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 32px);left:calc(env(safe-area-inset-left) + 26px);width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),rgba(255,255,255,.03) 60%,transparent 70%);border:1.5px solid rgba(255,255,255,.16);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);pointer-events:auto;touch-action:none;box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.1)}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.14));border:1.5px solid rgba(255,255,255,.4);box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.5);transition:transform .05s linear}
#jumpBtn{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 48px);right:calc(env(safe-area-inset-right) + 30px);width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,rgba(245,180,0,.35),rgba(229,72,77,.28));border:1.5px solid rgba(255,204,102,.55);color:#fff;font-weight:900;font-size:13px;letter-spacing:.14em;display:grid;place-items:center;pointer-events:auto;touch-action:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(245,180,0,.25),inset 0 1px rgba(255,255,255,.25);text-shadow:0 0 12px rgba(255,200,100,.6)}
#jumpBtn:active{transform:scale(.92)}
#lookArea{position:absolute;right:0;top:0;width:60%;height:calc(100% - 220px);pointer-events:auto;touch-action:none}
@media(min-width:801px){#mobile{display:none!important}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div id="crosshair"><div class="dot"></div></div>
  <div id="fps">-- FPS</div>
  <div id="zone">— ЗОНА —</div>
  <div id="hint">
    <b>SANDSTONE</b><br>
    Кликни · <kbd>WASD</kbd> движение · <kbd>Space</kbd> прыжок · <kbd>Shift</kbd> бег
  </div>
</div>

<div id="mobile">
  <div id="joy"><div id="knob"></div></div>
  <div id="jumpBtn">JUMP</div>

</div>

<div id="loader">
  <div class="logo">SANDSTONE</div>
  <div class="sub">загрузка карты</div>
  <div class="bar"><i></i></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. RENDERER
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8b98c, 70, 200);

const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, 0.08, 600);

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

/* ============================================================
   1. PROCEDURAL TEXTURES
   ============================================================ */
function makeSandTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d4b384'; ctx.fillRect(0,0,512,512);
  for (let i = 0; i < 5200; i++){
    const v = 180 + Math.random()*70;
    ctx.fillStyle = `rgba(${v|0},${(v*0.85)|0},${(v*0.62)|0},${0.25+Math.random()*0.25})`;
    ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, Math.random()*2.4 + 0.4, 0, Math.PI*2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(30, 30);
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeBrickTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#8a5a34'; ctx.fillRect(0,0,512,512);
  const bw = 64, bh = 32;
  for (let row = 0; row < 16; row++){
    const off = (row % 2) * (bw/2);
    for (let col = -1; col < 9; col++){
      const s = 0.85 + Math.random()*0.25;
      ctx.fillStyle = `rgb(${(180*s)|0},${(126*s)|0},${(78*s)|0})`;
      ctx.fillRect(col*bw + off + 2, row*bh + 2, bw - 4, bh - 4);
    }
  }
  for (let i = 0; i < 4000; i++){
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.14})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 1.5, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeWoodTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a2f16'; ctx.fillRect(0,0,512,512);
  const planks = 6, ph = 512 / planks;
  for (let i = 0; i < planks; i++){
    const y = i * ph, s = 0.82 + Math.random()*0.3;
    ctx.fillStyle = `rgb(${(160*s)|0},${(112*s)|0},${(60*s)|0})`;
    ctx.fillRect(0, y + 3, 512, ph - 6);
    for (let j = 0; j < 55; j++){
      ctx.strokeStyle = `rgba(60,38,16,${0.12+Math.random()*0.14})`;
      ctx.lineWidth = 0.4 + Math.random()*1.6;
      const yy = y + 4 + Math.random()*(ph - 8);
      ctx.beginPath(); ctx.moveTo(0, yy);
      ctx.bezierCurveTo(170, yy + (Math.random()-0.5)*6, 340, yy + (Math.random()-0.5)*6, 512, yy);
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeMetalTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6a6a6a'; ctx.fillRect(0,0,256,256);
  for (let i = 0; i < 2000; i++){
    const v = 80 + Math.random()*80;
    ctx.fillStyle = `rgba(${v|0},${v|0},${v|0},${Math.random()*0.4})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 2, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const TEX = {
  sand: makeSandTexture(),
  brick: makeBrickTexture(),
  wood: makeWoodTexture(),
  metal: makeMetalTexture()
};

/* ============================================================
   2. ENVIRONMENT / SKY / LIGHTS
   ============================================================ */
(function buildEnv(){
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envScene = new THREE.Scene();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ top:{value:new THREE.Color(0x4a7cc0)}, bot:{value:new THREE.Color(0xe0c090)}, sun:{value:new THREE.Color(0xfff0d0)} },
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 top,bot,sun; void main(){
      vec3 d=normalize(vP); float h=d.y*0.5+0.5;
      vec3 col=mix(bot,top,pow(h,0.7));
      float s=max(dot(d,normalize(vec3(0.6,0.6,0.4))),0.0);
      col+=sun*pow(s,60.0)*2.0; gl_FragColor=vec4(col,1.0);}`
  });
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(80,32,16), skyMat));
  const grd = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshBasicMaterial({color:0xd4b384}));
  grd.rotation.x = -Math.PI/2; grd.position.y = -2; envScene.add(grd);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;
  pmrem.dispose();
})();

(function addSky(){
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{
      top:{value:new THREE.Color(0x3262a0)},
      mid:{value:new THREE.Color(0xa4bdd8)},
      bot:{value:new THREE.Color(0xe6c79a)},
      sunDir:{value:new THREE.Vector3(0.55,0.55,0.35).normalize()}
    },
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 top,mid,bot,sunDir;
      void main(){ vec3 d=normalize(vP); float h=d.y;
        vec3 col=h>0.0?mix(mid,top,pow(h,0.7)):mix(mid,bot,pow(-h,0.5));
        float s=max(dot(d,sunDir),0.0);
        col+=vec3(1.0,0.92,0.72)*pow(s,200.0)*2.5;
        col+=vec3(1.0,0.85,0.6)*pow(s,8.0)*0.12;
        gl_FragColor=vec4(col,1.0);}`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(320,32,16), mat));
})();

const sun = new THREE.DirectionalLight(0xfff1d0, 2.35);
sun.position.set(45, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55;   sun.shadow.camera.bottom = -55;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
scene.add(sun);

scene.add(new THREE.HemisphereLight(0x9fc5ff, 0xb89368, 0.65));
const rim = new THREE.DirectionalLight(0xffa76b, 0.3);
rim.position.set(-30, 12, -30);
scene.add(rim);

/* ============================================================
   3. MATERIALS
   ============================================================ */
const MAT = {
  sand:      new THREE.MeshStandardMaterial({map:TEX.sand, roughness:0.95, metalness:0.02}),
  brick:     new THREE.MeshStandardMaterial({map:TEX.brick, roughness:0.88, metalness:0.02}),
  brickDark: new THREE.MeshStandardMaterial({map:TEX.brick, color:0xb08050, roughness:0.9, metalness:0.02}),
  wood:      new THREE.MeshStandardMaterial({map:TEX.wood, roughness:0.72, metalness:0.03}),
  woodDark:  new THREE.MeshStandardMaterial({map:TEX.wood, color:0x8a5f34, roughness:0.75, metalness:0.03}),
  metal:     new THREE.MeshStandardMaterial({map:TEX.metal, roughness:0.38, metalness:0.82}),
  metalDark: new THREE.MeshStandardMaterial({color:0x3a3a3a, roughness:0.5, metalness:0.75}),
  plaster:   new THREE.MeshStandardMaterial({color:0xd8b88a, roughness:0.85, metalness:0.02}),
  palmTrunk: new THREE.MeshStandardMaterial({color:0x6b4a26, roughness:0.92}),
  palmLeaf:  new THREE.MeshStandardMaterial({color:0x4a7a38, roughness:0.85, side:THREE.DoubleSide}),
  cloth:     new THREE.MeshStandardMaterial({color:0xa8642c, roughness:0.95, side:THREE.DoubleSide}),
  markerRed:   new THREE.MeshBasicMaterial({color:0xff2a2a, transparent:true, opacity:0.35, depthWrite:false}),
  markerYellow:new THREE.MeshBasicMaterial({color:0xffcf3a, transparent:true, opacity:0.35, depthWrite:false}),
  markerBlue:  new THREE.MeshBasicMaterial({color:0x3a8dff, transparent:true, opacity:0.35, depthWrite:false})
};

/* ============================================================
   4. WORLD BUILDER
   ============================================================ */
const worldBoxes = [];

function registerAABB(x, y, z, w, h, d){
  worldBoxes.push({
    min: new THREE.Vector3(x - w/2, y, z - d/2),
    max: new THREE.Vector3(x + w/2, y + h, z + d/2)
  });
}

/* ---- Image → World conversion ---- */
const IMG_CENTER = 250;
const IMG_SCALE  = 0.16; // meters per image pixel (map ≈ 70×70 m)
const WALL_H = 4.2;
const WALL_T = 0.5;
const Wx = x => (x - IMG_CENTER) * IMG_SCALE;
const Wz = y => (y - IMG_CENTER) * IMG_SCALE;

/* ---- Wall between two image points ---- */
function wallLine(x1, y1, x2, y2, h = WALL_H, t = WALL_T, mat = MAT.brick){
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) * IMG_SCALE;
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  const angle = Math.atan2(dy, dx);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len + t, h, t), mat);
  m.position.set(Wx(cx), h/2, Wz(cy));
  m.rotation.y = -angle;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  // approximate AABB
  const hx = Math.abs(Math.cos(angle))*len/2 + Math.abs(Math.sin(angle))*t/2 + t/2;
  const hz = Math.abs(Math.sin(angle))*len/2 + Math.abs(Math.cos(angle))*t/2 + t/2;
  registerAABB(Wx(cx), 0, Wz(cy), hx*2, h, hz*2);
  return m;
}

/* ---- Solid building block (image rect) ---- */
function building(x, y, w, h, height, opts = {}){
  const wx = Wx(x + w/2), wz = Wz(y + h/2);
  const ww = w * IMG_SCALE, wd = h * IMG_SCALE;
  const m = new THREE.Mesh(new THREE.BoxGeometry(ww, height, wd), opts.mat || MAT.brick);
  m.position.set(wx, height/2, wz);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  registerAABB(wx, 0, wz, ww, height, wd);
  if (opts.roof !== false){
    const r = new THREE.Mesh(new THREE.BoxGeometry(ww + 0.5, 0.3, wd + 0.5), MAT.brickDark);
    r.position.set(wx, height + 0.15, wz);
    r.castShadow = true; r.receiveShadow = true;
    scene.add(r);
  }
  return m;
}

/* ---- Crate ---- */
function crate(xImg, yImg, s = 1.2, stacked = 1, baseY = 0){
  const cx = Wx(xImg), cz = Wz(yImg);
  for (let i = 0; i < stacked; i++){
    const y = baseY + i*s;
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), MAT.wood);
    m.position.set(cx, y + s/2, cz);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    registerAABB(cx, y, cz, s, s, s);
    // metal brackets
    const t = 0.06;
    for (const sx of [-1,1]) for (const sz of [-1,1]){
      const bx = new THREE.Mesh(new THREE.BoxGeometry(t*2, s*0.98, t*2), MAT.metalDark);
      bx.position.set(cx + sx*s/2, y + s/2, cz + sz*s/2);
      bx.castShadow = true;
      scene.add(bx);
    }
  }
}

/* ---- Barrel ---- */
function barrel(xImg, yImg, r = 0.42, h = 1.1){
  const cx = Wx(xImg), cz = Wz(yImg);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), MAT.metal);
  m.position.set(cx, h/2, cz);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  registerAABB(cx, 0, cz, r*1.8, h, r*1.8);
  for (const yy of [0.15, 0.55, 0.95]){
    const band = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.03, r + 0.03, 0.06, 20), MAT.metalDark);
    band.position.set(cx, yy, cz); band.castShadow = true; scene.add(band);
  }
}

/* ---- Palm ---- */
function palm(xImg, yImg, scale = 1){
  const g = new THREE.Group();
  const trunkH = 6 * scale;
  const segs = 7, segH = trunkH / segs;
  let offset = 0, prevY = 0;
  for (let i = 0; i < segs; i++){
    const rTop = (0.20 - i*0.018) * scale;
    const rBot = (0.24 - i*0.018) * scale;
    const t = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, segH, 10), MAT.palmTrunk);
    const ox = Math.sin(i*0.4) * 0.15 * scale;
    t.position.set(ox, i*segH + segH/2, 0);
    t.rotation.z = Math.sin(i*0.4) * 0.05;
    t.castShadow = true; g.add(t);
    offset = ox; prevY = i*segH + segH;
  }
  for (let i = 0; i < 9; i++){
    const angle = (i/9) * Math.PI*2 + Math.random()*0.25;
    const len = (1.8 + Math.random()*0.5) * scale;
    const leafGeo = new THREE.PlaneGeometry(len, 0.5*scale, 6, 1);
    const pos = leafGeo.attributes.position;
    for (let v = 0; v < pos.count; v++){
      const x = pos.getX(v);
      const t = (x + len/2) / len;
      pos.setY(v, pos.getY(v) - Math.sin(t*Math.PI*0.5) * 0.6 * scale);
    }
    pos.needsUpdate = true; leafGeo.computeVertexNormals();
    const leaf = new THREE.Mesh(leafGeo, MAT.palmLeaf);
    leaf.position.set(offset, prevY, 0);
    leaf.rotation.y = angle;
    leaf.rotation.z = -0.4 - Math.random()*0.3;
    leaf.translateX(len/2);
    leaf.castShadow = true; g.add(leaf);
  }
  g.position.set(Wx(xImg), 0, Wz(yImg));
  scene.add(g);
  registerAABB(Wx(xImg), 0, Wz(yImg), 0.6*scale, trunkH*0.9, 0.6*scale);
}

/* ---- Ground marker ---- */
function marker(x, y, w, h, mat){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w * IMG_SCALE, h * IMG_SCALE), mat);
  m.rotation.x = -Math.PI/2;
  m.position.set(Wx(x + w/2), 0.02, Wz(y + h/2));
  m.renderOrder = 1;
  scene.add(m);
}

/* ============================================================
   5. THE MAP
   ============================================================ */

/* ---- GROUND ---- */
{
  const g = new THREE.PlaneGeometry(400, 400);
  const m = new THREE.Mesh(g, MAT.sand);
  m.rotation.x = -Math.PI/2;
  m.receiveShadow = true;
  scene.add(m);

/* ============================================================
   6. PLAYER + CONTROLS
   ============================================================ */
const player = {
  pos: new THREE.Vector3(Wx(55), 1.75, Wz(275)),
  vel: new THREE.Vector3(),
  onGround: false,
  yaw: Math.PI,
  pitch: 0
};

const HW = 0.35, PH = 1.75, EYE = 1.62;
const GRAV = -22, JUMP_V = 8.2, WALK = 4.8, RUN = 7.6;

function playerIntersects(x, y, z, b){
  return (x + HW > b.min.x && x - HW < b.max.x) &&
         (y + PH > b.min.y && y     < b.max.y) &&
         (z + HW > b.min.z && z - HW < b.max.z);
}

function moveAndCollide(dt){
  const p = player.pos, v = player.vel;
  p.x += v.x * dt;
  for (const b of worldBoxes){
    if (playerIntersects(p.x, p.y, p.z, b)){
      if (v.x > 0) p.x = b.min.x - HW - 0.001;
      else if (v.x < 0) p.x = b.max.x + HW + 0.001;
      v.x = 0;
    }
  }
  p.z += v.z * dt;
  for (const b of worldBoxes){
    if (playerIntersects(p.x, p.y, p.z, b)){
      if (v.z > 0) p.z = b.min.z - HW - 0.001;
      else if (v.z < 0) p.z = b.max.z + HW + 0.001;
      v.z = 0;
    }
  }
  p.y += v.y * dt;
  player.onGround = false;
  for (const b of worldBoxes){
    if (playerIntersects(p.x, p.y, p.z, b)){
      if (v.y <= 0){ p.y = b.max.y; player.onGround = true; }
      else { p.y = b.min.y - PH - 0.001; }
      v.y = 0;
    }
  }
}

/* ---------- TOUCH ---------- */
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
const joyCenter = {x:0, y:0};
let joyTouchId = null, joyVec = {x:0, y:0};
const JOY_R = 55;

joy.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  const r = joy.getBoundingClientRect();
  joyCenter.x = r.left + r.width/2;
  joyCenter.y = r.top + r.height/2;
  updateJoy(t);
}, {passive:false});

function updateJoy(t){
  let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx/JOY_R; joyVec.y = dy/JOY_R;
}
addEventListener('touchmove', e=>{
  for (const t of e.changedTouches) if (t.identifier === joyTouchId) updateJoy(t);
}, {passive:false});
addEventListener('touchend', e=>{
  for (const t of e.changedTouches) if (t.identifier === joyTouchId){
    joyTouchId = null; joyVec.x = joyVec.y = 0;
    knob.style.transform = 'translate(-50%,-50%)';
  }
});

const jumpBtn = document.getElementById('jumpBtn');
let jumpHeld = false;
jumpBtn.addEventListener('touchstart', e=>{ e.preventDefault(); jumpHeld = true; }, {passive:false});
jumpBtn.addEventListener('touchend', e=>{ e.preventDefault(); jumpHeld = false; }, {passive:false});
jumpBtn.addEventListener('touchcancel', ()=>{ jumpHeld = false; });

const lookArea = document.getElementById('lookArea');
let lookTouch = null, lastLook = {x:0, y:0};
lookArea.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  lookTouch = t.identifier;
  lastLook.x = t.clientX; lastLook.y = t.clientY;
}, {passive:false});
lookArea.addEventListener('touchmove', e=>{
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === lookTouch){
      const dx = t.clientX - lastLook.x, dy = t.clientY - lastLook.y;
      player.yaw -= dx * 0.005;
      player.pitch -= dy * 0.005;
      player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));
      lastLook.x = t.clientX; lastLook.y = t.clientY;
    }
  }
}, {passive:false});
lookArea.addEventListener('touchend', e=>{
  for (const t of e.changedTouches) if (t.identifier === lookTouch) lookTouch = null;
});

/* ============================================================
   7. LOOP
   ============================================================ */
let last = performance.now();
let fpsAcc = 0, fpsCount = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');
const euler = new THREE.Euler(0, 0, 0, 'YXZ');

function step(dt){
  const isTouch = document.body.classList.contains('touch');
  let inputX = 0, inputZ = 0, run = false;

  if (isTouch){
    inputX = joyVec.x; inputZ = joyVec.y;
    if (jumpHeld && player.onGround) player.vel.y = JUMP_V;
  } else {
    if (keys.has('KeyW') || keys.has('ArrowUp'))    inputZ = -1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  inputZ = 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  inputX = -1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) inputX = 1;
    run = keys.has('ShiftLeft') || keys.has('ShiftRight');
    if (keys.has('Space') && player.onGround) player.vel.y = JUMP_V;
  }

  const len = Math.hypot(inputX, inputZ);
  if (len > 1){ inputX /= len; inputZ /= len; }

  const speed = run ? RUN : WALK;
  const cosY = Math.cos(player.yaw), sinY = Math.sin(player.yaw);
  const wx = inputX * cosY - inputZ * sinY;
  const wz = inputX * sinY + inputZ * cosY;

  player.vel.x = wx * speed;
  player.vel.z = wz * speed;
  player.vel.y += GRAV * dt;
  if (player.vel.y < -35) player.vel.y = -35;

  moveAndCollide(dt);

  if (player.pos.y < -10){
    player.pos.set(Wx(55), 2, Wz(275));
    player.vel.set(0, 0, 0);
  }

  camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
  euler.set(player.pitch, player.yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);

  // zone
  const xImg = player.pos.x / IMG_SCALE + IMG_CENTER;
  const yImg = player.pos.z / IMG_SCALE + IMG_CENTER;
  updateZone(xImg, yImg);
}

function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const steps = Math.max(1, Math.ceil(dt / 0.016));
  const sdt = dt / steps;
  for (let i = 0; i < steps; i++) step(sdt);
  renderer.render(scene, camera);
  fpsTimer += dt; fpsCount++;
  if (fpsTimer >= 0.5){
    fpsEl.textContent = Math.round(fpsCount/fpsTimer) + ' FPS';
    fpsTimer = 0; fpsCount = 0;
  }
  requestAnimationFrame(frame);
}

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
