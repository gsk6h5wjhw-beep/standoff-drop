<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOID YARD — FPS Concept</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101418;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
#title{position:absolute;top:calc(env(safe-area-inset-top) + 15px);left:17px;font-size:10px;letter-spacing:3px;opacity:.45}
#cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.5}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{width:2px;height:12px;left:5px}
#cross:after{height:2px;width:12px;top:5px}
#clean{position:absolute;right:15px;top:calc(env(safe-area-inset-top) + 12px);pointer-events:auto;background:#1118;border:1px solid #fff2;color:#fff;border-radius:11px;padding:9px 11px;font-size:9px;letter-spacing:1px}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;letter-spacing:1px;opacity:.3}
</style>
</head>
<body>
<div id="hud">
  <div id="title">VOID YARD / ORIGINAL CONCEPT MAP</div>
  <div id="cross"></div>
  <button id="clean">CLEAN CAPTURE</button>
  <div id="hint">СЛЕВА — ДВИЖЕНИЕ · СПРАВА — ОБЗОР</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x11171b);
scene.fog=new THREE.Fog(0x11171b,25,105);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,160);
camera.position.set(0,1.65,20);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8d6df,0x171b20,1.35));
const sun=new THREE.DirectionalLight(0xffffff,1.9);
sun.position.set(-25,35,15);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const M={
 floor:new THREE.MeshStandardMaterial({color:0x343a3d,roughness:.96}),
 wall:new THREE.MeshStandardMaterial({color:0x6e7475,roughness:.9}),
 dark:new THREE.MeshStandardMaterial({color:0x20262a,roughness:.9}),
 metal:new THREE.MeshStandardMaterial({color:0x374047,metalness:.55,roughness:.6}),
 concrete:new THREE.MeshStandardMaterial({color:0x555b5d,roughness:.95}),
 red:new THREE.MeshStandardMaterial({color:0x71382f,roughness:.8}),
 yellow:new THREE.MeshStandardMaterial({color:0xa58731,roughness:.8}),
 glass:new THREE.MeshStandardMaterial({color:0x2a4146,metalness:.2,roughness:.18,transparent:true,opacity:.72})
};
const obstacles=[];
function box(x,y,z,w,h,d,mat=M.wall){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function obs(x,z,w,d){obstacles.push({x,z,w,d})}

box(0,-.2,0,70,.4,70,M.floor);
box(0,0,0,40,.12,34,M.floor);

box(0,4,-28,58,8,1.2);box(0,4,28,58,8,1.2);
box(-28,4,0,1.2,8,58);box(28,4,0,1.2,58);

box(-11,2.8,-2,1,5.6,19,M.concrete);obs(-11,-2,1,19);
box(11,2.8,3,1,5.6,17,M.concrete);obs(11,3,1,17);
box(0,2.8,-11,14,5.6,1,M.concrete);obs(0,-11,14,1);
box(0,2.8,11,18,5.6,1,M.concrete);obs(0,11,18,1);

box(-20,3,-18,13,6,10,M.dark);obs(-20,-18,13,10);
box(-20,6,-18,13.5,.45,10.5,M.metal);
box(-20,3,-12,9,6,1,M.concrete);obs(-20,-12,9,1);
for(let i=0;i<3;i++)box(-24+i*4,3,-23.1,2.6,4.8,.18,M.metal);

box(19,3,-17,12,6,13,M.dark);obs(19,-17,12,13);
box(19,1.7,-10.2,8,3.2,.8,M.concrete);
box(15.5,3,-23.2,3.8,4.5,.3,M.glass);
box(22.5,3,-23.2,3.8,4.5,.3,M.glass);

function container(x,z,mat){
 box(x,1.25,z,6.2,2.5,2.7,mat);obs(x,z,6.2,2.7);
 for(let i=-2;i<=2;i++)box(x+i*1.15,1.3,z-1.38,.12,2.25,.08,M.dark);
}
container(-19,3,M.red);container(-19,7,M.metal);
container(18,9,M.yellow);container(18,13,M.metal);

function crate(x,y,z,s=1.7){box(x,y,z,s,s,s,M.metal);obs(x,z,s,s)}
for(let i=0;i<3;i++)crate(-5,.85+i*1.7,17);
for(let i=0;i<2;i++)crate(6,.85+i*1.7,-17);
for(let i=0;i<2;i++)crate(8,.85+i*1.7,17);

box(-4,1.4,4,4,2.8,2,M.concrete);obs(-4,4,4,2);
box(5,1.1,4,3,2.2,2,M.metal);obs(5,4,3,2);
box(4,1.1,-4,5,2.2,2,M.concrete);obs(4,-4,5,2);
box(-5,1,-6,3,2,2,M.metal);obs(-5,-6,3,2);

for(let z=-25;z<=25;z+=2){
 box(-27.35,.25,z,.08,.05,.9,z%4===0?M.yellow:M.dark);
 box(27.35,.25,z,.08,.05,.9,z%4===0?M.yellow:M.dark);
}

function lamp(x,y,z){
 box(x,y/2,z,.12,y,.12,M.dark);
 const glow=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshBasicMaterial({color:0xdde9d8}));
 glow.position.set(x,y,z);scene.add(glow);
 const l=new THREE.PointLight(0xdde9d8,3,14,2);l.position.set(x,y,z);scene.add(l);
}
lamp(-9,5,-1);lamp(9,5,7);lamp(-2,4,24);lamp(22,4,0);

function blocked(x,z,r=.34){
 if(Math.abs(x)>26.6-r||Math.abs(z)>26.6-r)return true;
 for(const o of obstacles){
  if(x>o.x-o.w/2-r&&x<o.x+o.w/2+r&&z>o.z-o.d/2-r&&z<o.z+o.d/2+r)return true;
 }
 return false;
}

let yaw=0,pitch=0;
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const touches=new Map();
renderer.domElement.addEventListener("touchstart",e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  if(t.clientX<innerWidth*.5&&!Array.from(touches.values()).some(v=>v.type==="move"))
   touches.set(t.identifier,{type:"move",ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY});
  else if(!Array.from(touches.values()).some(v=>v.type==="look"))
   touches.set(t.identifier,{type:"look",x:t.clientX,y:t.clientY});
 }
},{passive:false});
renderer.domElement.addEventListener("touchmove",e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  const s=touches.get(t.identifier);if(!s)continue;
  if(s.type==="move"){s.x=t.clientX;s.y=t.clientY}
  else{
   yaw-=(t.clientX-s.x)*.006;
   pitch-=(t.clientY-s.y)*.004;
   pitch=Math.max(-1.3,Math.min(1.3,pitch));
   s.x=t.clientX;s.y=t.clientY;
  }
 }
},{passive:false});
renderer.domElement.addEventListener("touchend",e=>{for(const t of e.changedTouches)touches.delete(t.identifier)},{passive:true});
renderer.domElement.addEventListener("touchcancel",e=>{for(const t of e.changedTouches)touches.delete(t.identifier)},{passive:true});

function move(dx,dz){
 const speed=.065;
 const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
 const rx=Math.cos(yaw),rz=-Math.sin(yaw);
 const nx=camera.position.x+(rx*dx+fx*dz)*speed;
 const nz=camera.position.z+(rz*dx+fz*dz)*speed;
 if(!blocked(nx,camera.position.z))camera.position.x=nx;
 if(!blocked(camera.position.x,nz))camera.position.z=nz;
}

function loop(){
 requestAnimationFrame(loop);
 let dx=0,dz=0;
 if(keys.w||keys.arrowup)dz+=1;
 if(keys.s||keys.arrowdown)dz-=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;
 for(const s of touches.values())if(s.type==="move"){
  dx+=(s.x-s.ox)/55;
  dz-=(s.y-s.oy)/55;
 }
 const len=Math.hypot(dx,dz);
 if(len>1){dx/=len;dz/=len}
 move(dx,dz);
 camera.rotation.y=yaw;camera.rotation.x=pitch;
 renderer.render(scene,camera);
}
loop();

document.getElementById("clean").onclick=()=>document.getElementById("hud").classList.toggle("hidden");
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
