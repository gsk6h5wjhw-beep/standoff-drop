<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050914" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Шурш — Messenger</title>
<style>
:root{
  --bg:#050914;--bg2:#0a1024;
  --panel:rgba(16,22,44,.72);--panel2:rgba(20,28,54,.62);
  --glass:rgba(19,27,53,.55);--glass2:rgba(28,38,68,.45);
  --line:rgba(120,150,230,.16);--line2:rgba(120,150,230,.24);
  --text:#f2f5ff;--muted:#8b96b8;--muted2:#6b7796;
  --accent:#6e63ff;--accent2:#4d9dff;
  --blue:#3d6bff;--violet:#7a4dff;
  --danger:#ff4d67;--success:#28d17c;--creator:#4aa8ff;
  --shadow:0 30px 90px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#050914;color:var(--text);position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(700px 480px at 78% -5%,rgba(80,80,255,.28),transparent 62%),radial-gradient(560px 480px at -10% 40%,rgba(120,60,255,.18),transparent 65%),radial-gradient(650px 500px at 100% 110%,rgba(60,110,255,.16),transparent 68%),linear-gradient(180deg,#070c1c 0%,#050914 60%,#030711 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1100px 700px at 50% -30%,rgba(60,90,220,.10),transparent 70%);mix-blend-mode:screen}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:0;height:0}

/* ============ AUTH ============ */
.auth-wrap{position:fixed;inset:0;z-index:10;overflow:hidden;display:flex;align-items:stretch;justify-content:center}
.auth-stage{position:relative;width:100%;max-width:480px;padding:0 22px;display:flex;flex-direction:column;z-index:2;height:100dvh;overflow:hidden}
.bubbles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bubbles i{position:absolute;display:block;border-radius:60% 40% 55% 45%;background:radial-gradient(circle at 32% 28%,rgba(160,190,255,.95) 0 6%,rgba(90,110,255,.65) 20%,rgba(90,50,200,.55) 55%,rgba(30,20,80,.15) 78%,transparent 79%),linear-gradient(140deg,rgba(70,110,255,.55),rgba(140,60,255,.42));border:1px solid rgba(140,170,255,.30);box-shadow:inset 14px 12px 26px rgba(255,255,255,.10),inset -18px -22px 40px rgba(30,10,90,.30),0 0 40px rgba(80,90,255,.18);filter:blur(.2px);animation:floaty 14s ease-in-out infinite}
.bubbles i:nth-child(1){width:170px;height:120px;left:-70px;top:14%;transform:rotate(26deg)}
.bubbles i:nth-child(2){width:210px;height:150px;right:-85px;top:3%;transform:rotate(22deg);animation-delay:-7s}
.bubbles i:nth-child(3){width:230px;height:150px;left:-95px;bottom:14%;transform:rotate(24deg);animation-delay:-5s}
.bubbles i:nth-child(4){width:150px;height:100px;right:-60px;bottom:22%;transform:rotate(-24deg);animation-delay:-2s}
.bubbles i:nth-child(5){width:70px;height:46px;right:22%;top:18%;opacity:.65;animation-delay:-10s;animation-duration:18s}
@keyframes floaty{0%,100%{translate:0 0;scale:1;rotate:0deg}25%{translate:8px -16px;scale:1.04;rotate:3deg}50%{translate:-8px 8px;scale:.97;rotate:-2deg}75%{translate:14px 14px;scale:1.02;rotate:2deg}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(40px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));opacity:0;transform:translateX(28px);pointer-events:none;transition:opacity .38s ease,transform .46s cubic-bezier(.22,.9,.24,1);z-index:3;overflow-y:auto;overscroll-behavior:contain}
.screen.active{opacity:1;transform:none;pointer-events:auto}
.screen.leaving{opacity:0;transform:translateX(-24px);pointer-events:none}
.welcome{justify-content:center;text-align:center}
.app-mark{position:relative;width:132px;height:132px;margin:0 auto 26px;border-radius:38px;background:linear-gradient(150deg,#233a8a,#121a44 55%,#3a1e7a);border:1.5px solid rgba(150,175,255,.55);box-shadow:0 0 0 6px rgba(90,120,255,.05),0 0 55px rgba(80,110,255,.42),0 26px 70px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.24),inset 0 -20px 40px rgba(120,60,255,.20);display:grid;place-items:center;overflow:hidden}
.app-mark::after{content:"";position:absolute;width:62px;height:32px;right:-8px;top:2px;border-radius:65% 30% 60% 30%;transform:rotate(28deg);background:linear-gradient(135deg,rgba(120,200,255,.95),rgba(120,70,255,.85));filter:blur(1px);box-shadow:0 0 26px rgba(80,150,255,.65)}
.app-mark span{font-size:74px;font-weight:900;color:#f2f4ff;letter-spacing:-.06em;text-shadow:0 0 26px rgba(255,255,255,.25);position:relative;z-index:2}
.app-mark::before{content:"";position:absolute;inset:1px;border-radius:37px;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(120,120,255,.14))}
.welcome h1{font-size:44px;font-weight:800;letter-spacing:-.055em;margin:0}
.welcome .tagline{font-size:19px;color:#a8b3d5;margin-top:10px}
.welcome .btn-primary{margin-top:auto}

.btn-primary{position:relative;width:100%;height:58px;border-radius:22px;background:linear-gradient(120deg,#3d6bff 0%,#5c54ff 45%,#7a4dff 100%);color:#fff;font-weight:800;font-size:17px;border:1px solid rgba(170,195,255,.45);box-shadow:0 18px 45px rgba(70,85,255,.32),inset 0 1px rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .25s cubic-bezier(.34,1.4,.5,1);overflow:hidden}
.btn-primary::before{content:"";position:absolute;inset:-40% -10%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%);transform:translateX(-80%);animation:sweep 4.5s ease-in-out infinite}
.btn-primary:active{transform:scale(.975)}
.btn-ghost{width:100%;height:52px;border-radius:18px;background:rgba(30,40,70,.55);border:1px solid rgba(130,160,240,.20);color:#e8edff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(18px);transition:transform .2s}
.btn-ghost:active{transform:scale(.97)}
@keyframes sweep{0%,60%{transform:translateX(-90%)}85%,100%{transform:translateX(90%)}}
.welcome .link{margin-top:20px;color:#8995b8;font-size:14px;text-align:center}
.welcome .link button{color:#c9d3ff;font-weight:800;padding:4px 6px}

.screen-head{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-top:6px}
.screen-head .back{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(30,40,70,.5);border:1px solid rgba(120,150,230,.14);font-size:20px;color:#cdd4ea;backdrop-filter:blur(16px)}
.screen-head h2{font-size:26px;font-weight:800;margin:0;letter-spacing:-.035em}
.screen-head p{margin:6px 0 0;color:#8b96b8;font-size:13px;line-height:1.5}

.g-account{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;margin-bottom:12px;background:rgba(22,30,55,.68);border:1px solid rgba(120,150,230,.14);backdrop-filter:blur(22px);text-align:left;width:100%;transition:transform .2s}
.g-account:active{transform:scale(.985)}
.g-account .g-icon{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;color:#4285f4;font-size:20px;flex:0 0 38px}
.g-account .g-meta{flex:1;min-width:0}
.g-account .g-meta strong{display:block;font-size:14px;font-weight:700}
.g-account .g-meta span{display:block;font-size:12px;color:#8b96b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-account .arrow{color:#7384a4;font-size:20px}
.g-note{margin-top:14px;text-align:center;color:#7a86a6;font-size:12px;line-height:1.5}

.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(150deg,#6545d9,#a05cff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;background-size:cover;background-position:center;flex:0 0 auto}
.avatar.sm{width:44px;height:44px;font-size:17px}
.avatar.lg{width:96px;height:96px;font-size:32px}
.avatar-ring{position:relative;width:120px;height:120px;margin:0 auto 16px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#7188ff,#b06aff,#4cbeff);box-shadow:0 0 0 6px rgba(90,120,255,.08),0 18px 55px rgba(90,110,255,.35)}
.avatar-ring .avatar{width:100%;height:100%;border:3px solid #0a1024}
.avatar-cam{position:absolute;right:-2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#6f86ff,#7958ff);color:#fff;border:2.5px solid #0a1024;font-size:17px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(90,100,255,.5)}
.avatar-cam:active{transform:scale(.92)}

.field{margin:16px 0}
.field label{display:block;font-size:12.5px;font-weight:700;color:#7e8eae;margin-bottom:8px;letter-spacing:.02em}
.field input,.field textarea{width:100%;padding:14px 16px;border-radius:16px;background:rgba(11,18,34,.65);border:1px solid rgba(130,160,230,.16);color:var(--text);outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:96px;resize:none;font-family:inherit;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:rgba(130,150,255,.55);box-shadow:0 0 0 3px rgba(110,100,255,.14);background:rgba(15,24,45,.85)}
.field .counter{text-align:right;color:#6b7796;font-size:11px;margin-top:6px}
.avatar-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.avatar-choice{height:48px;border-radius:14px;background:rgba(30,42,72,.55);border:1px solid rgba(120,150,230,.14);font-size:24px;display:grid;place-items:center;transition:.18s}
.avatar-choice.sel{background:rgba(110,100,255,.22);border-color:rgba(130,150,255,.65);box-shadow:0 0 20px rgba(110,100,255,.28)}

.theme-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-card{padding:16px 8px;border-radius:18px;background:rgba(22,30,55,.55);border:1px solid rgba(120,150,230,.14);color:#c4cde0;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.22s}
.theme-card b{font-size:22px;font-weight:400;line-height:1}
.theme-card span{font-size:11px;font-weight:700}
.theme-card.sel{background:linear-gradient(145deg,rgba(80,110,255,.28),rgba(120,70,240,.18));border-color:rgba(150,180,255,.55);box-shadow:0 0 26px rgba(110,100,255,.22),inset 0 1px rgba(255,255,255,.14)}

.switch-row{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:8px 0;background:rgba(22,30,55,.5);border:1px solid rgba(120,150,230,.13);border-radius:18px;backdrop-filter:blur(20px)}
.switch-row .ico{width:38px;height:38px;border-radius:12px;background:rgba(50,70,120,.5);border:1px solid rgba(120,150,230,.16);display:grid;place-items:center;font-size:18px;color:#b8c4e4;flex:0 0 38px}
.switch-row .txt{flex:1;min-width:0}
.switch-row strong{display:block;font-size:14px;font-weight:700}
.switch-row span{display:block;font-size:11px;color:#7e8eae;margin-top:3px}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:rgba(60,72,110,.65);border:1px solid rgba(130,160,240,.16);transition:background .25s;flex:0 0 46px}
.switch::after{content:"";position:absolute;left:3px;top:2px;width:22px;height:22px;border-radius:50%;background:#d8dff5;transition:transform .3s cubic-bezier(.34,1.4,.5,1),background .25s;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.switch.on{background:linear-gradient(120deg,#4d70ff,#7a4dff);border-color:rgba(170,195,255,.5);box-shadow:0 0 20px rgba(110,100,255,.35)}
.switch.on::after{transform:translateX(18px);background:#fff}

.accent-dots{display:flex;gap:12px;padding:6px 4px}
.accent-dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:.2s;background:#7567ff;box-shadow:0 0 18px rgba(110,100,255,.45)}
.accent-dot[data-a=blue]{background:#5f7fff}
.accent-dot[data-a=cyan]{background:#49cfff}
.accent-dot[data-a=pink]{background:#e16cff}
.accent-dot[data-a=green]{background:#62d78b}
.accent-dot[data-a=orange]{background:#ff8b5c}
.accent-dot.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(110,100,255,.45),0 0 26px rgba(110,100,255,.55)}

.lang-list{display:grid;gap:8px;margin-top:4px}
.lang-option{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:16px;background:rgba(22,30,55,.5);border:1px solid rgba(120,150,230,.13);color:#dbe2f1;text-align:left;transition:.2s}
.lang-option span{font-size:22px}
.lang-option strong{flex:1;font-size:14px;font-weight:700}
.lang-option b{opacity:0;color:#a9c4ff;font-size:16px;transition:opacity .2s}
.lang-option.sel{background:linear-gradient(120deg,rgba(80,110,255,.22),rgba(120,70,240,.14));border-color:rgba(150,180,255,.5);box-shadow:0 0 22px rgba(110,100,255,.20)}
.lang-option.sel b{opacity:1}

.success-screen{justify-content:center;text-align:center;gap:20px}
.success-icon{width:96px;height:96px;margin:0 auto;border-radius:50%;background:linear-gradient(145deg,#4dd18b,#2ea86f);display:grid;place-items:center;font-size:44px;color:#fff;box-shadow:0 20px 55px rgba(50,200,120,.4),inset 0 2px rgba(255,255,255,.35)}
.success-screen h2{font-size:26px;font-weight:800;margin:0}
.success-screen p{color:#8b96b8;font-size:14px;line-height:1.5;max-width:280px;margin:0 auto}

/* ============ APP ============ */
.app{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);max-width:1500px;margin:0 auto;left:0;right:0}
.sidebar{position:relative;display:flex;flex-direction:column;min-width:0;background:rgba(6,12,26,.85);backdrop-filter:blur(30px) saturate(150%);border-right:1px solid rgba(110,140,220,.14);height:100dvh;min-height:0}
.app-head{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid rgba(110,140,220,.10)}
.app-title{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.app-title button{color:#b4bfdb;font-size:20px;display:grid;place-items:center;padding:2px}
.head-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,rgba(45,65,110,.65),rgba(30,45,85,.55));border:1px solid rgba(120,150,230,.24);display:grid;place-items:center;color:#cfd8ef;font-size:22px;box-shadow:inset 0 1px rgba(255,255,255,.10),0 6px 20px rgba(0,0,0,.25);transition:.22s}
.head-btn:active{transform:scale(.92)}

.pages{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;opacity:0;transform:translateX(24px) scale(.99);pointer-events:none;transition:opacity .34s ease,transform .48s cubic-bezier(.22,.9,.24,1);padding-bottom:14px}
.page.active{opacity:1;transform:none;pointer-events:auto}
.page.leaving{opacity:0;transform:translateX(-20px);pointer-events:none}
.page::-webkit-scrollbar{width:0}

.searchbar{margin:10px 14px 4px;position:relative}
.searchbar input{width:100%;height:48px;padding:0 16px 0 44px;border-radius:16px;background:rgba(14,22,45,.85);border:1px solid rgba(110,140,220,.16);color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.searchbar input::placeholder{color:#7a86a6}
.searchbar input:focus{border-color:rgba(130,150,255,.55);box-shadow:0 0 0 3px rgba(110,100,255,.14)}
.searchbar::before{content:"";position:absolute;left:16px;top:14px;width:20px;height:20px;border:2px solid #7a86a6;border-radius:50%;pointer-events:none}
.searchbar::after{content:"";position:absolute;left:30px;top:29px;width:8px;height:2px;background:#7a86a6;transform:rotate(45deg);border-radius:2px;pointer-events:none}

.chat-list{flex:1;overflow-y:auto;padding:6px 8px 8px;scrollbar-width:none}
.chat-list::-webkit-scrollbar{width:0}
.chat-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:20px;width:100%;background:transparent;color:var(--text);text-align:left;border:1px solid transparent;margin:2px 0;transition:.2s}
.chat-item:active{transform:scale(.985)}
.chat-item.active{background:linear-gradient(100deg,rgba(80,110,255,.18),rgba(128,70,255,.08));border-color:rgba(120,150,255,.24);box-shadow:0 10px 30px rgba(40,60,150,.14)}
.chat-item .av{position:relative;flex:0 0 auto}
.chat-item .av .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--success);border:2.5px solid #06101e;box-shadow:0 0 12px rgba(60,220,140,.6)}
.chat-item .meta{flex:1;min-width:0}
.chat-item .meta strong{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .meta .prev{font-size:12.5px;color:#8b96b8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.chat-item .side .time{font-size:11px;color:#7a86a6}
.chat-item .side .badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:linear-gradient(120deg,#4d70ff,#7a4dff);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 14px rgba(90,90,255,.45)}

.search-tabs{display:flex;gap:8px;padding:4px 14px 10px;overflow-x:auto;scrollbar-width:none}
.search-tabs::-webkit-scrollbar{display:none}
.stab{padding:8px 16px;border-radius:14px;background:rgba(22,30,55,.55);border:1px solid rgba(120,150,230,.14);color:#b0bcd8;font-size:12.5px;font-weight:700;white-space:nowrap;transition:.2s}
.stab.sel{background:linear-gradient(120deg,rgba(80,110,255,.45),rgba(120,70,240,.35));border-color:rgba(150,180,255,.5);color:#fff;box-shadow:0 6px 20px rgba(110,100,255,.28)}
.search-section{padding:6px 18px 4px;font-size:12px;font-weight:800;color:#7a86a6;letter-spacing:.1em;text-transform:uppercase}
.search-result{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin:2px 6px;background:rgba(22,30,55,.42);border:1px solid rgba(120,150,230,.10);text-align:left;width:calc(100% - 12px);transition:.2s}
.search-result .meta{flex:1;min-width:0}
.search-result .meta strong{display:block;font-size:14px;font-weight:700}
.search-result .meta span{display:block;font-size:11.5px;color:#8b96b8;margin-top:3px}
.search-result .go{color:#7384a4;font-size:18px}

.page-head{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.page-head .eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#7888aa;font-weight:800}
.page-head h2{margin:4px 0 0;font-size:27px;font-weight:800;letter-spacing:-.035em}
.page-head .act{width:42px;height:42px;border-radius:13px;background:rgba(30,40,70,.5);border:1px solid rgba(120,150,230,.14);display:grid;place-items:center;color:#cfd8ef;font-size:18px;backdrop-filter:blur(16px)}

.profile-hero{text-align:center;padding:6px 20px 16px}
.profile-hero .avatar-ring{width:112px;height:112px;margin-bottom:14px}
.profile-hero .name-line{display:flex;align-items:center;justify-content:center;gap:6px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.profile-hero .handle{color:#8b96b8;font-size:14px;margin-top:6px}
.profile-hero .presence{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#7dd4a4;font-weight:700}
.profile-hero .presence span{width:7px;height:7px;border-radius:50%;background:#35d27b;box-shadow:0 0 10px rgba(53,210,123,.7)}
.profile-hero .bio{font-size:13.5px;color:#aeb9d0;line-height:1.5;margin:14px auto 0;max-width:300px}

.creator-badge{display:inline-grid;place-items:center;width:20px;height:20px;min-width:20px;border-radius:50%;background:linear-gradient(140deg,#4aa8ff,#1688ff);color:#fff;box-shadow:0 0 0 1.5px rgba(130,180,255,.45),0 0 16px rgba(60,150,255,.55);vertical-align:middle}
.creator-badge svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:6px 18px 14px;padding:1px;border-radius:20px;background:rgba(120,150,230,.10);border:1px solid rgba(120,150,230,.10)}
.stats>div{padding:14px 6px;text-align:center;background:rgba(14,22,44,.75);border-radius:19px}
.stats b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stats span{display:block;font-size:10.5px;color:#7a86a6;margin-top:4px}

.list-group{margin:6px 14px;padding:6px;background:rgba(16,24,48,.55);border:1px solid rgba(120,150,230,.13);border-radius:22px;backdrop-filter:blur(20px)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;color:var(--text);width:100%;text-align:left;transition:.18s;border:0;background:transparent}
.list-row:active{background:rgba(110,140,220,.10)}
.list-row .ico{width:38px;height:38px;border-radius:12px;background:rgba(50,70,120,.5);border:1px solid rgba(120,150,230,.16);display:grid;place-items:center;color:#b8c4e4;font-size:17px;flex:0 0 38px}
.list-row .ico.crown{color:#d0bcff;background:rgba(110,80,190,.35);border-color:rgba(150,110,255,.3)}
.list-row .txt{flex:1;min-width:0}
.list-row .txt strong{display:block;font-size:14px;font-weight:700}
.list-row .txt span{display:block;font-size:11px;color:#7e8eae;margin-top:3px}
.list-row .arrow{color:#7384a4;font-size:20px;font-weight:400}
.list-row .val{color:#8b96b8;font-size:12px;font-weight:600}

.bottom-nav{position:relative;isolation:isolate;overflow:hidden;margin:6px 10px max(10px,env(safe-area-inset-bottom));padding:8px 6px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:linear-gradient(145deg,rgba(15,24,50,.85),rgba(8,14,30,.85));border:1px solid rgba(120,150,235,.22);border-radius:26px;backdrop-filter:blur(30px) saturate(155%);box-shadow:0 22px 55px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.10)}
.bottom-nav::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.06),transparent 30%,transparent 70%,rgba(140,150,255,.05));border-radius:inherit}
.nav-pill{position:absolute;top:8px;left:0;height:48px;border-radius:20px;background:radial-gradient(circle at 50% 20%,rgba(160,190,255,.45),transparent 55%),linear-gradient(145deg,rgba(86,117,255,.62),rgba(83,59,191,.55));border:1px solid rgba(170,200,255,.45);box-shadow:0 0 26px rgba(90,120,255,.42),0 10px 30px rgba(30,40,120,.24),inset 0 1px rgba(255,255,255,.30),inset 0 -8px 16px rgba(50,50,180,.18);backdrop-filter:blur(22px) saturate(160%);transition:transform .62s cubic-bezier(.34,1.5,.5,1),width .5s cubic-bezier(.34,1.5,.5,1),filter .4s,border-radius .4s;will-change:transform,width;pointer-events:none;z-index:0;transform:translateX(6px)}
.nav-pill.moving{filter:blur(.9px) brightness(1.10) saturate(1.15);border-radius:24px}
.nav-pill.moving::before{content:"";position:absolute;inset:-25%;border-radius:inherit;background:radial-gradient(circle,rgba(140,170,255,.55),transparent 62%);animation:pillRipple .62s ease-out forwards;pointer-events:none}
.nav-pill.moving::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:pillSheen .62s ease-out forwards;pointer-events:none}
@keyframes pillRipple{0%{transform:scale(.6);opacity:.95}60%{opacity:.35}100%{transform:scale(1.5);opacity:0}}
@keyframes pillSheen{0%{transform:translateX(-60%);opacity:0}30%{opacity:1}100%{transform:translateX(60%);opacity:0}}
.nav-btn{position:relative;z-index:2;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;color:#8c99b6;font-size:10.5px;font-weight:800;border-radius:20px;transition:color .3s,transform .3s}
.nav-btn .ni{font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .4s cubic-bezier(.34,1.5,.5,1),filter .3s}
.nav-btn.active{color:#fff;text-shadow:0 0 12px rgba(200,215,255,.35)}
.nav-btn.active .ni{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(160,180,255,.55))}
.nav-btn:active{transform:scale(.96)}

/* ============ CHAT (right) ============ */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh;background:linear-gradient(180deg,rgba(5,10,20,.4),rgba(4,7,16,.6));backdrop-filter:blur(30px)}
.chat-empty{margin:auto;text-align:center;color:#8b96b8;padding:24px}
.chat-empty h2{color:#f2f5ff;font-size:24px;font-weight:800;margin:0 0 8px}
.chat-head{height:calc(72px + env(safe-area-inset-top));flex:0 0 calc(72px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;display:flex;align-items:center;gap:8px;background:rgba(6,13,28,.80);backdrop-filter:blur(30px);border-bottom:1px solid rgba(110,140,220,.14);position:relative;z-index:2}
.chat-head .center{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;max-width:55%;text-align:center}
.chat-head .center strong{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chat-head .center span{font-size:11px;color:#8b96b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chat-head .center span.online{color:#7dd4a4}
.head-icon{width:42px;height:42px;border-radius:14px;background:rgba(30,42,72,.55);border:1px solid rgba(120,150,230,.16);display:grid;place-items:center;color:#cfd8ef;font-size:18px;transition:.2s;backdrop-filter:blur(16px)}
.head-icon:active{transform:scale(.92)}
.head-actions{margin-left:auto;display:flex;gap:6px}

.messages{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg-row{display:flex;flex-direction:column;max-width:min(80%,680px);animation:msgIn .25s cubic-bezier(.18,.9,.22,1)}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.msg-row.theirs{align-self:flex-start;align-items:flex-start}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.msg{padding:10px 14px;border-radius:20px;line-height:1.42;word-break:break-word;position:relative;max-width:100%;box-shadow:0 8px 26px rgba(0,0,0,.14);border:1px solid transparent}
.msg.mine{background:linear-gradient(135deg,#506dff,#7651ff);color:#fff;border-bottom-right-radius:6px;border-color:rgba(171,190,255,.22);box-shadow:0 12px 30px rgba(65,72,210,.22),inset 0 1px rgba(255,255,255,.14)}
.msg.theirs{background:rgba(16,26,48,.82);color:var(--text);border-bottom-left-radius:6px;border-color:rgba(130,160,225,.18);backdrop-filter:blur(18px)}
.msg-meta{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:10px;opacity:.72;margin-top:4px}
.checks.read{color:#a9d4ff}
.reply-preview{padding:6px 9px;border-left:3px solid #b18dff;background:rgba(255,255,255,.08);border-radius:9px;margin-bottom:6px;font-size:11px;color:#ddd;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.reaction-row{display:flex;gap:4px;padding:2px 0;margin-top:5px}
.reaction-row span{background:rgba(255,255,255,.08);border-radius:11px;padding:2px 7px;font-size:12px;line-height:1}
.day-sep{display:flex;justify-content:center;align-items:center;margin:10px 0 4px}
.day-sep span{font-size:11px;font-weight:800;color:#aaa6b5;background:rgba(26,30,41,.7);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:5px 11px;backdrop-filter:blur(8px)}

.composer{flex:0 0 auto;min-height:72px;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:rgba(6,13,28,.88);backdrop-filter:blur(30px);border-top:1px solid rgba(110,140,220,.14);display:flex;gap:9px;align-items:flex-end}
.composer .attach{width:44px;height:48px;border-radius:16px;background:rgba(30,42,72,.5);border:1px solid rgba(120,150,230,.16);color:#b8c4e4;font-size:20px;display:grid;place-items:center;flex:0 0 44px}
.composer input{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:16px;background:rgba(14,25,47,.72);border:1px solid rgba(112,144,221,.20);color:var(--text);outline:none;transition:.2s;font-size:15px}
.composer input:focus{border-color:rgba(130,150,255,.55);box-shadow:0 0 0 3px rgba(110,100,255,.14)}
.send{width:48px;height:48px;padding:0;border-radius:50%;background:linear-gradient(135deg,#4e78ff,#814df2);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(70,85,255,.34),inset 0 1px rgba(255,255,255,.25);transition:transform .2s;flex:0 0 48px}
.send:active{transform:scale(.9)}
.reply-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(10,18,38,.9);border-top:1px solid rgba(110,140,220,.14);font-size:12px}
.reply-bar .reply-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar button{background:transparent;color:#aaa;font-size:18px}
.scroll-down{position:absolute;right:16px;bottom:96px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(16,26,48,.85);color:var(--text);border:1px solid rgba(120,150,230,.2);box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:4;font-size:20px;backdrop-filter:blur(18px)}

/* MODALS */
.panel{position:fixed;inset:0;z-index:20;background:rgba(2,5,12,.68);backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);display:grid;place-items:center;padding:18px;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:min(500px,100%);max-height:min(92dvh,780px);overflow-y:auto
