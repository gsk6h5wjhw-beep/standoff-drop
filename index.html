<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#9bb5c3"><title>VOID YARD — FPS Concept</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb5c3}body{touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#rotate{display:none;position:fixed;inset:0;z-index:20;place-items:center;background:#101519;color:#fff;font:12px system-ui;letter-spacing:2px;text-align:center}@media(orientation:portrait){#rotate{display:grid}}#jump{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:74px;height:74px;border-radius:50%;border:1px solid #fff2;background:#fff1;opacity:.12;z-index:5}#boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0e1317;color:#fff}#boot button{padding:14px 22px;border:1px solid #fff3;border-radius:13px;background:#fff1;color:#fff;font:11px system-ui;letter-spacing:2px}</style></head><body><div id="rotate">ПОВЕРНИТЕ IPHONE ГОРИЗОНТАЛЬНО</div><div id="boot"><button>ENTER MAP</button></div><button id="jump" aria-label="jump"></button><script type="module">

const C=document.createElement('canvas'),cx=C.getContext('2d');C.width=C.height=512;
function texture(type){cx.clearRect(0,0,512,512);if(type==='concrete'){cx.fillStyle='#77736b';cx.fillRect(0,0,512,512);for(let i=0;i<15000;i++){let v=65+Math.random()*100;cx.fillStyle=`rgba(${v},${v*.96},${v*.9},${Math.random()*.18})`;cx.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*5,1+Math.random()*3)}cx.strokeStyle='rgba(45,43,40,.5)';cx.lineWidth=2;for(let i=0;i<20;i++){cx.beginPath();cx.moveTo(Math.random()*512,Math.random()*512);cx.lineTo(Math.random()*512,Math.random()*512);cx.stroke()}}if(type==='brick'){cx.fillStyle='#806b5c';cx.fillRect(0,0,512,512);for(let y=0;y<512;y+=30)for(let x=-55+(y/30%2)*27;x<512;x+=56){cx.fillStyle=['#856f60','#977d68','#705c50'][Math.floor(Math.random()*3)];cx.fillRect(x+1,y+1,53,27)}}if(type==='metal'){cx.fillStyle='#3c474a';cx.fillRect(0,0,512,512);for(let y=0;y<512;y+=48){cx.fillStyle='#59676a';cx.fillRect(0,y,512,2)}for(let i=0;i<2500;i++)cx.fillStyle=`rgba(190,200,195,${Math.random()*.12})`,cx.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*4,1)}if(type==='asphalt'){cx.fillStyle='#3c403f';cx.fillRect(0,0,512,512);for(let i=0;i<10000;i++){let v=35+Math.random()*45;cx.fillStyle=`rgb(${v},${v+2},${v+1})`;cx.fillRect(Math.random()*512,Math.random()*512,1,1)}}let copy=document.createElement('canvas');copy.width=512;copy.height=512;copy.getContext('2d').drawImage(C,0,0);let t=new THREE.CanvasTexture(copy);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=r.capabilities.getMaxAnisotropy();t.colorSpace=THREE.SRGBColorSpace;return t}

const col=[];function box(x,y,z,w,h,d,m=M.concrete,c=true){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);if(c)col.push({x,z,w,d});return q}function roof(x,y,z,w,d){return box(x,y,z,w,.22,d,M.concrete,false)}function cyl(x,y,z,rad,h,m,c=false){let q=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,16),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);if(c)col.push({x,z,w:rad*2,d:rad*2});return q}

/* containers and tactical cover */function cont(x,z,rot=0,m=M.metal){let g=new THREE.Group();g.position.set(x,1.25,z);g.rotation.y=rot;let b=new THREE.Mesh(new THREE.BoxGeometry(6.2,2.5,2.6),m);b.castShadow=b.receiveShadow=true;g.add(b);for(let i=-2;i<=2;i++){let s=new THREE.Mesh(new THREE.BoxGeometry(.1,2.25,.08),M.dark);s.position.set(i*1.15,0,-1.34);g.add(s)}scene.add(g);col.push({x,z,w:6.2,d:2.6})}cont(-16,1,0,M.red);cont(-16,4);cont(12,10);cont(12,13,0,M.red);cont(20,5,Math.PI/2,M.red);

box(-4,1.4,4,4,2.8,2);box(5,1.1,4,3,2.2,2,M.metal);box(4,1.1,-4,5,2.2,2);box(-5,1,-6,3,2,2,M.metal);
/* palms, vents, cables, debris */function palm(x,z,s=1){cyl(x,2.2*s,z,.25*s,4.4*s,M.wood);let lm=new THREE.MeshStandardMaterial({color:0x3e6549,roughness:1,side:THREE.DoubleSide});for(let i=0;i<7;i++){let p=new THREE.Mesh(new THREE.PlaneGeometry(3.2*s,.5*s),lm);p.position.set(x,4.4*s,z);p.rotation.set(.35,i*Math.PI/3.5,-.15);scene.add(p)}}[[-25,-6],[-17,-23],[-7,-14],[14,-24],[25,-12],[-27,18],[20,23],[5,25]].forEach(p=>palm(p[0],p[1],.8+Math.random()*.3));
function lamp(x,y,z){box(x,y/2,z,.12,y,.12,M.dark,false);let p=new THREE.Mesh(new THREE.SphereGeometry(.17,10,10),new THREE.MeshBasicMaterial({color:0xffe4ae}));p.position.set(x,y,z);scene.add(p);let l=new THREE.PointLight(0xffd39a,2.1,10,2);l.position.set(x,y,z);scene.add(l)}[-28,-2,17,-20,10].forEach((x,i)=>lamp(x,4,[-16,-19,-12,14,17][i]));
for(let i=0;i<60;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(.08+Math.random()*.35,.04,.08+Math.random()*.35),M.dark);m.position.set((Math.random()-.5)*58,.03,(Math.random()-.5)*50);m.rotation.y=Math.random()*6.28;scene.add(m)}

/* sky, sun and clouds */let sky=new THREE.Mesh(new THREE.SphereGeometry(250,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{a:{value:new THREE.Color(0x72a0b7)},b:{value:new THREE.Color(0xdfe7e4)}},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0)}',fragmentShader:'varying vec3 p;uniform vec3 a,b;void main(){float h=normalize(p).y;gl_FragColor=vec4(mix(b,a,smoothstep(-.1,.75,h)),1.0)}'}));scene.add(sky);
function cloud(x,y,z,s){let g=new THREE.Group();g.position.set(x,y,z);let m=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.72,roughness:1,depthWrite:false});for(let i=0;i<6;i++){let p=new THREE.Mesh(new THREE.SphereGeometry((1.5+Math.random()*2)*s,10,7),m);p.position.set((i-2.5)*2*s,Math.random()*1.1*s,Math.sin(i)*.6*s);g.add(p)}scene.add(g)}cloud(-35,35,-50,2.1);cloud(10,32,-70,1.7);cloud(45,39,-35,2.4);cloud(-5,31,18,1.3);
let sun=new THREE.DirectionalLight(0xfff0d0,3.2);sun.position.set(-38,48,26);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;sun.shadow.camera.far=160;sun.shadow.bias=-.0003;scene.add(sun);scene.add(new THREE.HemisphereLight(0xd5e8f0,0x514b42,1.25));

/* controls */let yaw=0,pitch=0,vy=0,ground=true;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&ground){vy=.19;ground=false}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const touch=new Map();r.domElement.addEventListener('touchstart',e=>{e.preventDefault();for(let t of e.changedTouches){if(t.clientX<innerWidth*.5&&!Array.from(touch.values()).some(v=>v.type==='m'))touch.set(t.identifier,{type:'m',ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY});else if(!Array.from(touch.values()).some(v=>v.type==='l'))touch.set(t.identifier,{type:'l',x:t.clientX,y:t.clientY})}},{passive:false});r.domElement.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches){let s=touch.get(t.identifier);if(!s)continue;if(s.type==='m'){s.x=t.clientX;s.y=t.clientY}else{yaw-=(t.clientX-s.x)*.0058;pitch-=(t.clientY-s.y)*.004;pitch=Math.max(-1.3,Math.min(1.3,pitch));s.x=t.clientX;s.y=t.clientY}}},{passive:false});r.domElement.addEventListener('touchend',e=>{for(let t of e.changedTouches)touch.delete(t.identifier)},{passive:true});document.getElementById('jump').addEventListener('touchstart',e=>{e.preventDefault();if(ground){vy=.19;ground=false}},{passive:false});
let mouse=false,mx=0,my=0;r.domElement.addEventListener('mousedown',e=>{mouse=true;mx=e.clientX;my=e.clientY});addEventListener('mouseup',()=>mouse=false);addEventListener('mousemove',e=>{if(!mouse)return;yaw-=(e.clientX-mx)*.0035;pitch-=(e.clientY-my)*.0025;pitch=Math.max(-1.3,Math.min(1.3,pitch));mx=e.clientX;my=e.clientY});
/* ambient audio only: water/wind/birds/bell/easter eggs; no steps/jump/turn sounds */let ac,master,waterGain,started=false;function audioStart(){if(started)return;started=true;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A;master=ac.createGain();master.gain.value=.22;master.connect(ac.destination);let n=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let w=ac.createBufferSource();w.buffer=n;w.loop=true;let f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=650;let wg=ac.createGain();wg.gain.value=.035;w.connect(f).connect(wg).connect(master);w.start();let s=ac.createBufferSource();s.buffer=n;s.loop=true;let b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=500;b.Q.value=.5;waterGain=ac.createGain();waterGain.gain.value=0;s.connect(b).connect(waterGain).connect(master);s.start();setInterval(()=>bell(),18000);setInterval(()=>bird(),10500)}function bell(){if(!ac||ac.state!=='running')return;let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=440;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.045,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+2.8);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+3)}function bird(){if(!ac||ac.state!=='running')return;let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(1400,ac.currentTime);o.frequency.exponentialRampToValueAtTime(2200,ac.currentTime+.12);o.frequency.exponentialRampToValueAtTime(1200,ac.currentTime+.28);g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.018,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.34);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+.36)}
function ambient(){if(!ac)return;let d=Math.max(0,Math.min(1,(cam.position.z+30)/38));waterGain.gain.setTargetAtTime(.005+.12*Math.pow(1-d,1.7),ac.currentTime,.12);if(Math.hypot(cam.position.x-20,cam.position.z+10)<5&&Math.random()<.012)tick();if(Math.hypot(cam.position.x+21,cam.position.z-8)<4&&Math.random()<.003)clink()}function tick(){let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=850;g.gain.value=.012;o.connect(g).connect(master);o.start();o.stop(ac.currentTime+.045)}function clink(){let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(1300,ac.currentTime);o.frequency.exponentialRampToValueAtTime(650,ac.currentTime+.2);g.gain.setValueAtTime(.02,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.3);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+.35)}
document.querySelector('#boot button').onclick=async()=>{audioStart();if(ac)await ac.resume();document.getElementById('boot').remove()};
let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.033,(t-last)/1000);last=t;let dx=0,dz=0;if(keys.w||keys.arrowup)dz++;if(keys.s||keys.arrowdown)dz--;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;for(let s of touch.values())if(s.type==='m'){dx+=(s.x-s.ox)/58;dz-=(s.y-s.oy)/58}let L=Math.hypot(dx,dz);if(L>1){dx/=L;dz/=L}let speed=.075,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),nx=cam.position.x+(rx*dx+fx*dz)*speed,nz=cam.position.z+(rz*dx+fz*dz)*speed;if(!blocked(nx,cam.position.z))cam.position.x=nx;if(!blocked(cam.position.x,nz))cam.position.z=nz;vy-=.48*dt;cam.position.y+=vy;if(cam.position.y<=1.72){cam.position.y=1.72;vy=0;ground=true}cam.rotation.y=yaw;cam.rotation.x=pitch;if(water.material.map){water.material.map.offset.x=(t*.000012)%1;water.material.map.offset.y=(t*.000006)%1;}if(ac&&ac.state==='suspended')ac.resume();if(ac)ambient();r.render(scene,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
