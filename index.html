<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050a1c" id="metaTheme">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVA">
<meta name="format-detection" content="telephone=no">
<title>NOVA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23070d24'/%3E%3Cpath d='M50 12C53 38 62 47 88 50 62 53 53 62 50 88 47 62 38 53 12 50 38 47 47 38 50 12Z' fill='%23fff'/%3E%3C/svg%3E">

<!-- ============================================================
     NOVA THEME ENGINE
     Единственное место, которое знает конкретные значения акцента.
     Всё остальное в интерфейсе работает от CSS-переменных.
     API:  NOVA.theme.setMode('system'|'light'|'dark')
           NOVA.theme.setAccent('blue'|'violet'|'pink'|'red'|'green'|'orange'|'cyan')
           NOVA.theme.setCustomAccent('#ff7a00')
     ============================================================ -->
<script>
(function () {
  var KEY = 'nova.theme.v1';
  var root = document.documentElement;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mqLight = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  var PRESETS = {
    blue:   { h: 224, s: 100, l: 63 },
    violet: { h: 263, s: 92,  l: 68 },
    pink:   { h: 327, s: 92,  l: 66 },
    red:    { h: 3,   s: 88,  l: 62 },
    green:  { h: 148, s: 68,  l: 50 },
    orange: { h: 28,  s: 96,  l: 58 },
    cyan:   { h: 190, s: 92,  l: 54 }
  };
  var state = { mode: 'dark', accent: 'blue', custom: null };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      if (saved.mode === 'light' || saved.mode === 'dark' || saved.mode === 'system') state.mode = saved.mode;
      if (saved.accent && (PRESETS[saved.accent] || (saved.accent === 'custom' && saved.custom))) {
        state.accent = saved.accent; state.custom = saved.custom || null;
      }
    }
  } catch (e) {}

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function hexToHsl(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    var n = parseInt(m[1], 16);
    var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    var h = 0, l = (max + min) / 2, s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return { h: Math.round(h), s: Math.round(clamp(s * 100, 55, 100)), l: Math.round(clamp(l * 100, 52, 68)) };
  }

  function resolveAccent() {
    if (state.accent === 'custom' && state.custom) return state.custom;
    return PRESETS[state.accent] || PRESETS.blue;
  }
  function effectiveMode() {
    if (state.mode === 'system') return mqLight && mqLight.matches ? 'light' : 'dark';
    return state.mode;
  }

  function applyNow() {
    var a = resolveAccent(), mode = effectiveMode();
    root.setAttribute('data-theme', mode);
    root.style.setProperty('--accent-h', a.h);
    root.style.setProperty('--accent-s', a.s + '%');
    root.style.setProperty('--accent-l-base', a.l + '%');
    var meta = document.getElementById('metaTheme');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#050a1c' : '#eef2fb');
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    window.dispatchEvent(new CustomEvent('nova:themechange', { detail: { mode: state.mode, effective: mode, accent: state.accent } }));
  }

  /* плавная смена: View Transitions (iOS 18+/Chromium), иначе — переход основных свойств */
  function apply(animate) {
    if (animate && !reduce && document.startViewTransition) {
      try { document.startViewTransition(applyNow); return; } catch (e) {}
    }
    if (animate && !reduce) {
      root.classList.add('theme-anim');
      applyNow();
      setTimeout(function () { root.classList.remove('theme-anim'); }, 520);
      return;
    }
    applyNow();
  }

  if (mqLight) {
    var onSys = function () { if (state.mode === 'system') apply(true); };
    if (mqLight.addEventListener) mqLight.addEventListener('change', onSys);
    else if (mqLight.addListener) mqLight.addListener(onSys);
  }

  window.NOVA = window.NOVA || {};
  window.NOVA.theme = {
    presets: PRESETS,
    get: function () { return { mode: state.mode, effective: effectiveMode(), accent: state.accent, custom: state.custom }; },
    setMode: function (m) { if (m !== 'dark' && m !== 'light' && m !== 'system') return; state.mode = m; apply(true); },
    setAccent: function (name) { if (!PRESETS[name]) return; state.accent = name; apply(true); },
    setCustomAccent: function (hex) { var c = hexToHsl(hex); if (!c) return; state.accent = 'custom'; state.custom = c; apply(false); }
  };

  applyNow();
})();
</script>

<style>
/* =====================================================================
   1. ТОКЕНЫ — единая система цвета NOVA
   Ни один компонент ниже не содержит «своих» цветов: всё берётся отсюда.
   ===================================================================== */

/* цвет профиля — отдельная настройка, плавно анимируется только на карточках профиля */
@property --pc-h { syntax: '<number>';     inherits: true; initial-value: 224; }
@property --pc-s { syntax: '<percentage>'; inherits: true; initial-value: 100%; }
@property --pc-l { syntax: '<percentage>'; inherits: true; initial-value: 63%; }

:root {
  /* источник глобального акцента (меняется из NOVA.theme) */
  --accent-h: 224;
  --accent-s: 100%;
  --accent-l-base: 63%;
  /* оттенок базового фона темы (Midnight = сине-чёрный) */
  --bg-h: 224;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;

  /* safe areas (на десктопе подменяются рамкой устройства) */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);

  /* геометрия */
  --page-gutter: 20px;
  --nav-h: 76px;
  --nav-pad: 6px;
  --nav-ex: 3px;
  --nav-side: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

/* ---------- NOVA Midnight (Dark) ---------- */
:root,
:root[data-theme="dark"] {
  color-scheme: dark;
  --accent-l: var(--accent-l-base);

  --background:           hsl(var(--bg-h) 62% 4.5%);
  --background-secondary: hsl(var(--bg-h) 54% 8.5%);
  --surface:              hsl(var(--bg-h) 44% 13%);
  --surface-glass:        hsl(var(--bg-h) 80% 78% / .075);
  --surface-glass-strong: hsl(var(--bg-h) 85% 82% / .14);
  --glass-hi:             rgb(255 255 255 / .09);
  --page-bg:              hsl(var(--bg-h) 70% 2.5%);

  --accent:           hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --accent-secondary: hsl(calc(var(--accent-h) + 44) 92% calc(var(--accent-l) + 4%));
  --accent-light:     hsl(var(--accent-h) 100% 84%);
  --accent-soft:      hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .14);
  --accent-med:       hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .32);
  --accent-strong:    hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .60);
  --icon-accent:      var(--accent-light);
  --on-accent:        #fff;

  --text-primary:   hsl(var(--bg-h) 45% 98%);
  --text-secondary: hsl(var(--accent-h) 55% 74%);
  --text-tertiary:  hsl(var(--accent-h) 30% 62% / .9);

  --border:      hsl(var(--accent-h) 90% 78% / .20);
  --border-soft: hsl(var(--accent-h) 70% 80% / .10);
  --divider:     hsl(var(--accent-h) 60% 80% / .08);
  --pressed:     hsl(var(--accent-h) 80% 80% / .10);

  --shadow: hsl(var(--bg-h) 80% 2% / .55);
  --glow:   hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .38);

  --rim-1: rgb(255 255 255 / .42);
  --rim-2: hsl(var(--accent-h) 90% 80% / .10);
  --rim-3: hsl(var(--accent-h) 90% 80% / .08);
  --rim-4: hsl(var(--accent-h) 100% 72% / .55);
  --edge-light: rgb(255 255 255 / .16);
  --edge-dark:  rgb(0 0 0 / .30);

  --blur-glass: blur(24px) saturate(1.7);
  --blur-nav:   blur(30px) saturate(1.8);
  --blur-lens:  blur(9px) saturate(2) brightness(1.14);

  --star-from: #fff;
  --star-to:   hsl(var(--accent-h) 100% 82%);

  --tab-idle:   hsl(var(--accent-h) 45% 74% / .82);
  --tab-active: #fff;

  --lens-fill:
    radial-gradient(110% 80% at 28% 4%, rgb(255 255 255 / .26), transparent 58%),
    radial-gradient(90% 110% at 85% 118%, hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .72), transparent 64%),
    linear-gradient(180deg, hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .16), rgb(255 255 255 / .03));
  --lens-shadow:
    inset 0 1.5px 1px rgb(255 255 255 / .55),
    inset 0 -1.5px 3px hsl(var(--accent-h) 100% 78% / .55),
    inset 2px 0 3px rgb(255 255 255 / .14),
    inset -2px 0 3px rgb(255 255 255 / .10),
    0 0 0 1px hsl(var(--accent-h) 100% 84% / .30),
    0 8px 26px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .38),
    0 2px 10px rgb(0 0 0 / .35);
  --lens-spec: rgb(255 255 255 / .38);

  --success: hsl(146 72% 50%);
  --badge-muted-bg: hsl(var(--bg-h) 55% 62% / .30);

  --pc-shift: 0%;           /* поправка яркости цвета профиля */

  --bg-image:
    radial-gradient(75% 40% at 14% -6%, hsl(var(--accent-h) 90% 55% / .24), transparent 70%),
    radial-gradient(60% 36% at 104% 20%, hsl(calc(var(--accent-h) + 44) 90% 58% / .13), transparent 70%),
    radial-gradient(95% 42% at 50% 114%, hsl(var(--accent-h) 90% 52% / .20), transparent 70%),
    linear-gradient(180deg, var(--background-secondary) 0%, var(--background) 58%);
  --star: rgb(205 222 255);
  --stars-opacity: .55;
  --ridge: hsl(var(--bg-h) 45% 15%);
  --ridge-opacity: .55;
}

/* ---------- NOVA Light ---------- */
:root[data-theme="light"] {
  color-scheme: light;
  --accent-l: calc(var(--accent-l-base) - 12%);

  --background:           hsl(var(--bg-h) 55% 96.5%);
  --background-secondary: hsl(var(--bg-h) 65% 92%);
  --surface:              hsl(0 0% 100% / .9);
  --surface-glass:        rgb(255 255 255 / .55);
  --surface-glass-strong: rgb(255 255 255 / .82);
  --glass-hi:             rgb(255 255 255 / .70);
  --page-bg:              hsl(var(--bg-h) 28% 80%);

  --icon-accent: var(--accent);

  --text-primary:   hsl(var(--bg-h) 50% 11%);
  --text-secondary: hsl(var(--accent-h) 34% 34%);
  --text-tertiary:  hsl(var(--accent-h) 20% 46% / .9);

  --border:      hsl(var(--accent-h) 50% 40% / .16);
  --border-soft: hsl(var(--accent-h) 40% 40% / .09);
  --divider:     hsl(var(--accent-h) 40% 30% / .09);
  --pressed:     hsl(var(--accent-h) 60% 40% / .09);

  --shadow: hsl(var(--bg-h) 45% 30% / .20);
  --glow:   hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .26);

  --rim-1: rgb(255 255 255 / 1);
  --rim-2: hsl(var(--accent-h) 60% 50% / .10);
  --rim-3: hsl(var(--accent-h) 60% 50% / .08);
  --rim-4: hsl(var(--accent-h) 80% 50% / .34);
  --edge-light: rgb(255 255 255 / .9);
  --edge-dark:  hsl(var(--bg-h) 40% 30% / .08);

  --blur-glass: blur(26px) saturate(1.5);
  --blur-nav:   blur(30px) saturate(1.5);
  --blur-lens:  blur(8px) saturate(1.6) brightness(1.04);

  --star-from: hsl(var(--accent-h) 100% 78%);
  --star-to:   var(--accent);

  --tab-idle:   hsl(var(--accent-h) 22% 40% / .85);
  --tab-active: var(--accent);

  --lens-fill:
    radial-gradient(110% 80% at 28% 2%, rgb(255 255 255 / .95), transparent 60%),
    radial-gradient(90% 110% at 85% 118%, hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .26), transparent 62%),
    linear-gradient(180deg, rgb(255 255 255 / .62), rgb(255 255 255 / .28));
  --lens-shadow:
    inset 0 1.5px 1px rgb(255 255 255 / 1),
    inset 0 -1.5px 3px hsl(var(--accent-h) 80% 50% / .30),
    inset 2px 0 3px rgb(255 255 255 / .7),
    inset -2px 0 3px rgb(255 255 255 / .5),
    0 0 0 1px hsl(var(--accent-h) 60% 45% / .22),
    0 8px 24px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .26),
    0 2px 8px hsl(var(--bg-h) 40% 30% / .14);
  --lens-spec: rgb(255 255 255 / .9);

  --success: hsl(146 68% 40%);
  --badge-muted-bg: hsl(var(--bg-h) 40% 40% / .14);

  --pc-shift: -8%;

  --bg-image:
    radial-gradient(75% 40% at 14% -6%, hsl(var(--accent-h) 90% 60% / .22), transparent 70%),
    radial-gradient(60% 36% at 104% 20%, hsl(calc(var(--accent-h) + 44) 90% 62% / .16), transparent 70%),
    radial-gradient(95% 42% at 50% 114%, hsl(var(--accent-h) 90% 60% / .18), transparent 70%),
    linear-gradient(180deg, var(--background-secondary) 0%, var(--background) 58%);
  --stars-opacity: 0;
  --ridge-opacity: 0;
}

/* =====================================================================
   2. БАЗА
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--page-bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
  overflow: hidden;
  min-height: 100dvh;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: inherit; }
a { color: inherit; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: inherit; }

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* плавная смена темы / акцента */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .42s; animation-timing-function: ease; }
.theme-anim, .theme-anim *, .theme-anim *::before, .theme-anim *::after {
  transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease, fill .4s ease, stroke .4s ease !important;
}
.booting .pcard { transition: none !important; }

/* ---------- приложение ---------- */
.app {
  position: fixed; inset: 0;
  overflow: hidden;
  background: var(--background);
  isolation: isolate;
}

/* ---------- атмосфера фона ---------- */
.bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--bg-image); }
.bg-stars {
  position: absolute; inset: 0; opacity: var(--stars-opacity);
  background-image:
    radial-gradient(1.2px 1.2px at 24px 38px, var(--star), transparent),
    radial-gradient(1px 1px at 96px 120px, var(--star), transparent),
    radial-gradient(1.4px 1.4px at 168px 54px, var(--star), transparent),
    radial-gradient(1px 1px at 52px 190px, var(--star), transparent),
    radial-gradient(1.2px 1.2px at 210px 170px, var(--star), transparent),
    radial-gradient(1px 1px at 140px 226px, var(--star), transparent),
    radial-gradient(1px 1px at 8px 120px, var(--star), transparent);
  background-size: 240px 240px;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgb(0 0 0 / .5) 45%, transparent 85%);
          mask-image: linear-gradient(to bottom, #000 0%, rgb(0 0 0 / .5) 45%, transparent 85%);
}
.bg-ridge {
  position: absolute; left: -10px; right: -10px; top: 0; height: 240px;
  opacity: var(--ridge-opacity); filter: blur(5px);
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent);
          mask-image: linear-gradient(to bottom, #000 30%, transparent);
}
.bg-ridge path { fill: var(--ridge); }

/* =====================================================================
   3. LIQUID GLASS — базовый материал
   ===================================================================== */
.glass {
  position: relative;
  background:
    linear-gradient(158deg, var(--glass-hi) 0%, transparent 46%),
    var(--surface-glass);
  -webkit-backdrop-filter: var(--blur-glass);
          backdrop-filter: var(--blur-glass);
  box-shadow:
    inset 0 1px 0 var(--edge-light),
    inset 0 -1px 0 var(--edge-dark),
    0 10px 30px var(--shadow);
}
/* тонкая светящаяся граница: градиент от блика к акценту */
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(150deg, var(--rim-1) 0%, var(--rim-2) 36%, var(--rim-3) 62%, var(--rim-4) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
          mask-composite: exclude;
}

.pressable {
  transition: transform .42s var(--ease), box-shadow .42s var(--ease), background-color .3s ease;
  -webkit-tap-highlight-color: transparent;
}
.pressable:active { transform: scale(.95); transition-duration: .12s; }

/* =====================================================================
   4. ЭКРАНЫ, СКРОЛЛ, ШАПКИ
   ===================================================================== */
.screens { position: absolute; inset: 0; z-index: 1; }
.screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none; }
.screen.is-active { opacity: 1; visibility: visible; pointer-events: auto; }

.scroll {
  position: absolute; inset: 0;
  overflow-x: hidden; overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: calc(var(--nav-h) + max(var(--sab), 10px) + 4px + 30px);
}
.scroll::-webkit-scrollbar { display: none; }

.topbar, .pagebar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--sat) + 10px) var(--page-gutter) 12px;
}
.pagebar { justify-content: flex-start; gap: 10px; }
.topbar::before, .pagebar::before {
  content: ""; position: absolute; inset: 0 0 -16px 0; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, var(--background) 0%, var(--background-secondary) 55%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
          backdrop-filter: blur(18px) saturate(1.5);
  -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent);
          mask-image: linear-gradient(to bottom, #000 62%, transparent);
  opacity: 0; transition: opacity .35s ease;
}
.is-scrolled .topbar::before, .is-scrolled .pagebar::before { opacity: .94; }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 0 10px var(--glow)); }
.brand-name { font-size: 33px; line-height: 1; font-weight: 700; letter-spacing: .035em; color: var(--text-primary); }
.brand-tag { margin-top: 4px; font-size: 14px; line-height: 1.1; font-weight: 500; color: var(--text-secondary); }

.me { width: 48px; height: 48px; border-radius: 50%; padding: 3px; display: block; flex: none; }
.me .avatar { width: 100%; height: 100%; }
.me .dot {
  position: absolute; right: -1px; bottom: 1px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 3px var(--background), 0 0 10px var(--success);
}

/* верхняя панель внутренних страниц */
.back {
  width: 40px; height: 40px; margin-left: -10px; flex: none; border-radius: 50%;
  display: grid; place-items: center; color: var(--accent);
}
.back .ic { width: 30px; height: 30px; stroke-width: 2; }
.pagebar-text { min-width: 0; }
.pagebar h1 { font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
.pagebar p { margin-top: 4px; font-size: 14px; line-height: 1.2; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pagebar--root { padding-left: calc(var(--page-gutter) + 4px); }

/* ---------- аватары ---------- */
.avatar { position: relative; display: block; border-radius: 50%; overflow: hidden; flex: none; background: var(--surface); }
.avatar svg, .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.avatar::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  box-shadow: inset 0 0 0 1px var(--border), inset 0 2px 8px rgb(255 255 255 / .07);
}
.avatar--initial { display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--text-primary); background: linear-gradient(145deg, var(--accent-med), var(--accent-soft)); }

/* =====================================================================
   5. ПОИСК
   ===================================================================== */
.search {
  display: flex; align-items: center; gap: 12px;
  height: 50px; margin: 6px var(--page-gutter) 0; padding: 0 18px;
  border-radius: 25px;
  transition: box-shadow .4s var(--ease), transform .4s var(--ease), background-color .3s ease;
}
.search .ic { width: 22px; height: 22px; color: var(--text-secondary); flex: none; transition: color .3s ease; }
.search input {
  flex: 1; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent;
  font-size: 17px; letter-spacing: -.005em; color: var(--text-primary);
  -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--text-tertiary); opacity: 1; }
.search:focus-within {
  transform: scale(1.012);
  box-shadow:
    inset 0 1px 0 var(--edge-light),
    inset 0 -1px 0 var(--edge-dark),
    0 0 0 1.5px var(--accent-med),
    0 0 0 5px var(--accent-soft),
    0 10px 34px var(--glow);
}
.search:focus-within .ic { color: var(--accent); }

/* =====================================================================
   6. СОЗДАНИЕ АНОНИМНОГО ЧАТА
   ===================================================================== */
.quick { display: flex; padding: 20px 14px 0; }
.quick-item { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 104px; min-width: 0; }
.quick-tile {
  width: 66px; height: 66px; border-radius: 24px;
  display: grid; place-items: center; color: var(--icon-accent);
  transition: transform .42s var(--ease), box-shadow .42s var(--ease);
}
.quick-tile .ic { width: 32px; height: 32px; stroke-width: 1.6; }
.quick-label { font-size: 13px; line-height: 1.2; font-weight: 500; color: var(--text-primary); opacity: .9; text-align: center; max-width: 100px; }
.quick-item:active .quick-tile { transform: scale(.93); box-shadow: inset 0 1px 0 var(--edge-light), 0 0 0 1.5px var(--accent-med), 0 6px 24px var(--glow); transition-duration: .12s; }
@media (hover: hover) { .quick-item:hover .quick-tile { box-shadow: inset 0 1px 0 var(--edge-light), 0 8px 26px var(--glow); } }

/* =====================================================================
   7. СПИСОК ЧАТОВ И EMPTY STATE
   ===================================================================== */
.chats { padding: 18px 8px 0; }
.chat-item { position: relative; }
.chat-item:not(:last-child)::after {
  content: ""; position: absolute; left: 80px; right: 12px; bottom: 0; height: 1px; background: var(--divider); pointer-events: none;
}
.chat {
  width: 100%; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 6px 12px; border-radius: 22px;
  transition: background-color .3s ease, transform .4s var(--ease);
}
.chat:active { background: var(--pressed); transform: scale(.985); transition-duration: .1s; }
@media (hover: hover) { .chat:hover { background: var(--pressed); } }
.chat .avatar { width: 56px; height: 56px; box-shadow: 0 4px 14px var(--shadow); }

.chat-main { min-width: 0; display: block; }
.chat-title { display: flex; align-items: center; gap: 6px; }
.chat-name { font-size: 17px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.verified { width: 17px; height: 17px; flex: none; color: var(--accent); filter: drop-shadow(0 0 6px var(--glow)); }
.chat-preview { display: block; margin-top: 2px; }
.chat-line { display: block; font-size: 14.5px; line-height: 1.32; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; align-self: stretch; justify-content: center; }
.chat-time { font-size: 13px; line-height: 1; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.badge {
  min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;
  color: var(--on-accent);
  background: linear-gradient(180deg, hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 8%)), var(--accent));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .35), 0 3px 12px var(--glow);
}
.badge--muted {
  color: var(--text-primary);
  background: var(--badge-muted-bg);
  box-shadow: inset 0 0 0 1px var(--border-soft), inset 0 1px 0 var(--edge-light);
}

/* пустое состояние (чаты, каналы, «скоро добавим») */
.state {
  margin: 56px var(--page-gutter) 0;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
}
.state-ic {
  width: 72px; height: 72px; border-radius: 50%; margin-bottom: 8px;
  display: grid; place-items: center; color: var(--icon-accent);
  box-shadow: inset 0 1px 0 var(--edge-light), inset 0 -1px 0 var(--edge-dark), 0 10px 30px var(--shadow), 0 0 34px var(--accent-soft);
}
.state-ic .ic { width: 34px; height: 34px; stroke-width: 1.6; }
.state h2 { font-size: 20px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
.state p { max-width: 280px; font-size: 15px; line-height: 1.4; color: var(--text-secondary); }

/* =====================================================================
   8. НИЖНЯЯ СТЕКЛЯННАЯ КАПСУЛА + LIQUID GLASS ПЕРЕКЛЮЧАТЕЛЬ
   ===================================================================== */
.bottom-fade {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  height: calc(var(--nav-h) + max(var(--sab), 10px) + 52px);
  background: linear-gradient(to top, var(--background) 18%, transparent);
}
.nav {
  position: absolute; z-index: 30;
  left: var(--nav-side); right: var(--nav-side);
  bottom: calc(max(var(--sab), 10px) + 4px);
  height: var(--nav-h);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.nav-bg {
  position: absolute; inset: 0; border-radius: calc(var(--nav-h) / 2); pointer-events: none;
  -webkit-backdrop-filter: var(--blur-nav); backdrop-filter: var(--blur-nav);
  box-shadow:
    inset 0 1px 0 var(--edge-light),
    inset 0 -1px 0 var(--edge-dark),
    0 14px 44px var(--shadow),
    0 0 36px var(--accent-soft);
}

/* базовые вкладки — неподвижны */
.tabs, .lens-tabs {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: var(--nav-pad);
}
.tabs { position: absolute; inset: 0; z-index: 0; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-width: 0; border-radius: 999px;
  color: var(--tab-idle);
  font-size: 12px; line-height: 1; font-weight: 600; letter-spacing: .01em;
}
.tab .ic { width: 26px; height: 26px; stroke-width: 1.85; }
.tab:focus-visible { outline-offset: -3px; }

/* активный Liquid Glass — единственный подвижный элемент */
.lens {
  position: absolute; left: 0; z-index: 1; pointer-events: none;
  top: calc(var(--nav-pad) - var(--nav-ex));
  bottom: calc(var(--nav-pad) - var(--nav-ex));
  width: 25%;
  will-change: transform;
  opacity: 0; transition: opacity .3s ease;
}
.ready .lens { opacity: 1; }
.lens-glass {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--lens-fill);
  -webkit-backdrop-filter: var(--blur-lens); backdrop-filter: var(--blur-lens);
  box-shadow: var(--lens-shadow);
}
/* зеркальный блик сверху */
.lens-glass::before {
  content: ""; position: absolute; left: 14%; right: 14%; top: 5%; height: 36%; border-radius: 50%;
  background: linear-gradient(to bottom, var(--lens-spec), transparent);
  opacity: .55; filter: blur(.6px);
}
/* каустика снизу */
.lens-glass::after {
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 4%; height: 22%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--accent-strong), transparent);
  opacity: .7; filter: blur(3px);
}
.lens-flash {
  position: absolute; inset: 0; border-radius: 999px; pointer-events: none;
  background: radial-gradient(circle at 50% 38%, var(--lens-spec), transparent 68%);
  opacity: calc(var(--press, 0) * .5);
}
.lens-clip { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; }
.lens-tabs {
  position: absolute; left: 0;
  top: calc(var(--nav-ex) - var(--nav-pad));
  height: var(--nav-h);
  will-change: transform;
}
.lens-tabs .tab { color: var(--tab-active); }
.lens-tabs .tab .ic { transform: scale(1.1); filter: drop-shadow(0 0 7px var(--glow)); }

.nav.is-dragging { cursor: grabbing; }

/* =====================================================================
   9. НАСТРОЙКИ И ВНУТРЕННИЕ СТРАНИЦЫ
   ===================================================================== */

/* ----- профильные карточки: цвет профиля отделён от глобального акцента ----- */
.pcard {
  --pc:      hsl(var(--pc-h) var(--pc-s) calc(var(--pc-l) + var(--pc-shift)));
  --pc-soft: hsl(var(--pc-h) var(--pc-s) calc(var(--pc-l) + var(--pc-shift)) / .16);
  --pc-med:  hsl(var(--pc-h) var(--pc-s) calc(var(--pc-l) + var(--pc-shift)) / .34);
  --pc-glow: hsl(var(--pc-h) var(--pc-s) calc(var(--pc-l) + var(--pc-shift)) / .55);
  transition: --pc-h .35s ease, --pc-s .35s ease, --pc-l .35s ease;
}
.hero {
  margin: 10px var(--page-gutter) 0; padding: 26px 16px 20px; border-radius: 32px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  background:
    radial-gradient(90% 75% at 50% 0%, var(--pc-med), transparent 72%),
    linear-gradient(180deg, var(--pc-soft), transparent 85%),
    var(--surface-glass);
}
.ring {
  position: relative; width: 108px; height: 108px; border-radius: 50%; padding: 4px;
  background: linear-gradient(145deg, rgb(255 255 255 / .55), var(--pc) 45%, var(--pc-med));
  box-shadow: 0 0 0 1px var(--pc-med), 0 0 34px var(--pc-glow);
}
.ring .avatar { width: 100%; height: 100%; box-shadow: 0 0 0 3px var(--background); }
.cam {
  position: absolute; right: -4px; bottom: -4px; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; color: var(--text-primary);
  background: var(--surface-glass-strong);
  box-shadow: 0 0 0 3px var(--background), 0 0 0 4px var(--pc-med), 0 6px 18px var(--pc-glow);
}
.cam .ic { width: 19px; height: 19px; }
.hero-name { margin-top: 16px; font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: .03em; }
.hero-handle { margin-top: 4px; font-size: 16px; color: var(--text-secondary); }
.hero-status { margin-top: 8px; display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 500; color: var(--success); }
.hero-status i { width: 9px; height: 9px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }

.note { margin: 14px calc(var(--page-gutter) + 6px) 0; font-size: 14px; line-height: 1.4; color: var(--text-tertiary); text-align: center; }

/* ----- карточки-строки ----- */
.card { margin: 14px var(--page-gutter) 0; border-radius: 26px; overflow: hidden; }
.row {
  position: relative; width: 100%; display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; text-decoration: none; color: inherit; text-align: left;
  transition: transform .16s ease-out, background-color .16s ease-out;
}
.row:active { transform: scale(.985); background: var(--pressed); }
.row-ic {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  display: grid; place-items: center; color: var(--icon-accent);
  background: radial-gradient(circle at 30% 25%, var(--accent-med), var(--accent-soft));
  box-shadow: inset 0 0 0 1px var(--border), 0 0 16px var(--accent-soft);
}
.row-ic .ic { width: 23px; height: 23px; stroke-width: 1.7; }
.row-text { flex: 1; min-width: 0; display: block; }
.row-title { display: block; font-size: 17px; line-height: 1.25; font-weight: 600; letter-spacing: -.005em; }
.row-sub { display: block; margin-top: 2px; font-size: 14px; line-height: 1.3; color: var(--text-secondary); }
.chev { width: 20px; height: 20px; flex: none; color: var(--text-secondary); stroke-width: 2; }
.list-card li + li::before {
  content: ""; position: absolute; top: 0; left: 76px; right: 16px; height: 1px; background: var(--divider); pointer-events: none;
}
.list-card li { position: relative; }

.pc-card { display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 16px; }
.pc-swatches {
  margin-left: auto; display: flex; align-items: center; gap: 4px; padding: 5px;
  border-radius: 999px; background: var(--surface-glass); box-shadow: inset 0 0 0 1px var(--border-soft);
}
.pc-sw {
  position: relative; width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 28%, hsl(var(--h) var(--s) calc(var(--l) + 14%)), hsl(var(--h) var(--s) calc(var(--l) - 8%)));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .4);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.pc-sw:active { transform: scale(.9); }
.pc-sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--background), 0 0 0 4.5px hsl(var(--h) var(--s) var(--l)), 0 0 16px hsl(var(--h) var(--s) var(--l) / .6); }

/* ----- выбор из вариантов (radio) ----- */
.group-label { margin: 24px calc(var(--page-gutter) + 6px) 10px; font-size: 14px; font-weight: 600; letter-spacing: .01em; color: var(--text-secondary); }
.options { margin: 0 var(--page-gutter); border-radius: 26px; overflow: hidden; }
.option {
  position: relative; width: 100%; height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 18px;
  font-size: 17px; font-weight: 500; text-align: left;
  transition: background-color .25s ease, transform .16s ease-out;
}
.option + .option::before { content: ""; position: absolute; top: 0; left: 56px; right: 18px; height: 1px; background: var(--divider); }
.option:active { transform: scale(.985); background: var(--pressed); }
.radio {
  width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 2px solid var(--text-tertiary); color: var(--on-accent);
  transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.radio .ic { width: 14px; height: 14px; stroke-width: 3; opacity: 0; transform: scale(.5); transition: opacity .2s ease, transform .35s var(--ease); }
.option[aria-checked="true"] { background: var(--accent-soft); font-weight: 600; }
.option[aria-checked="true"] .radio { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
.option[aria-checked="true"] .radio .ic { opacity: 1; transform: none; }

/* ----- сегмент (тема) ----- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin: 0 var(--page-gutter); padding: 4px; border-radius: 18px; }
.seg button {
  height: 42px; border-radius: 14px; text-align: center; font-size: 15px; font-weight: 600; color: var(--text-secondary);
  transition: background-color .3s ease, color .3s ease, box-shadow .3s ease, transform .16s ease-out;
}
.seg button:active { transform: scale(.97); }
.seg button[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); box-shadow: 0 4px 16px var(--glow), inset 0 1px 0 rgb(255 255 255 / .3); }

/* ----- цветовой акцент ----- */
.accents { margin: 0 var(--page-gutter); padding: 18px 8px 14px; border-radius: 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 0; }
.accent-opt { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.sw {
  position: relative; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 32% 28%, hsl(var(--sw-h) var(--sw-s) calc(var(--sw-l) + 14%)), hsl(var(--sw-h) var(--sw-s) calc(var(--sw-l) - 8%)));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .4), 0 4px 14px var(--shadow);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.sw .ic { width: 22px; height: 22px; stroke-width: 3; opacity: 0; transform: scale(.5); transition: opacity .2s ease, transform .35s var(--ease); }
.accent-opt:active .sw { transform: scale(.92); }
.accent-opt[aria-pressed="true"] .sw, .accent-opt[data-active="true"] .sw {
  box-shadow: 0 0 0 3px var(--background), 0 0 0 5px hsl(var(--sw-h) var(--sw-s) var(--sw-l)), 0 0 18px hsl(var(--sw-h) var(--sw-s) var(--sw-l) / .6);
}
.accent-opt[aria-pressed="true"] .sw .ic, .accent-opt[data-active="true"] .sw .ic { opacity: 1; transform: none; }
.sw--custom { background: conic-gradient(from 90deg, #ff5a5a, #ffb84d, #6be675, #4dd0ff, #6a7bff, #c55bff, #ff5a5a); --sw-h: var(--accent-h); --sw-s: var(--accent-s); --sw-l: var(--accent-l); }
.sw--custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.accent-name { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); text-align: center; }

/* ----- toast ----- */
.toast {
  position: absolute; left: 50%; z-index: 80; pointer-events: none; white-space: nowrap;
  bottom: calc(max(var(--sab), 10px) + 4px + var(--nav-h) + 14px);
  padding: 12px 20px; border-radius: 20px; font-size: 15px; font-weight: 500;
  opacity: 0; transform: translate(-50%, 10px);
  transition: opacity .3s ease, transform .4s var(--ease);
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

/* =====================================================================
   10. ДЕСКТОП-ПРЕВЬЮ: рамка iPhone 16 Pro Max (на телефоне не показывается)
   ===================================================================== */
.statusbar, .island, .home-indicator { display: none; }

@media (min-width: 520px) {
  body { display: grid; place-items: center; }
  .app {
    position: relative; inset: auto;
    width: 440px; height: min(956px, calc(100dvh - 32px));
    border-radius: 58px;
    --sat: 56px; --sab: 30px;
    box-shadow: 0 0 0 10px hsl(var(--bg-h) 30% 7%), 0 0 0 11px rgb(255 255 255 / .09), 0 50px 140px rgb(0 0 0 / .55);
  }
  .island { display: block; position: absolute; z-index: 100; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    position: absolute; z-index: 99; top: 0; left: 0; right: 0; height: 56px; padding: 6px 34px 0 40px;
    font-size: 17px; font-weight: 600; pointer-events: none; color: var(--text-primary);
  }
  .statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { fill: currentColor; }
  .home-indicator { display: block; position: absolute; z-index: 100; left: 50%; bottom: 8px; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: var(--text-primary); opacity: .55; pointer-events: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* =====================================================================
   11. ONBOARDING (первый запуск) — только токены NOVA, без своих цветов
   ===================================================================== */
.ob { position: absolute; inset: 0; z-index: 60; overflow: hidden; background: var(--background); transition: opacity .7s ease; }
.ob.is-out { opacity: 0; pointer-events: none; }
.ob .bg { z-index: 0; }
.ob-step {
  position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
  padding: calc(var(--sat) + 62px) 22px calc(max(var(--sab), 14px) + 16px);
  opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(44px);
  transition: opacity .45s ease, transform .55s var(--ease), visibility 0s .55s;
}
.ob-step.is-left { transform: translateX(-44px); }
.ob-step.is-active { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }
.ob.is-boot .ob-step { display: none; }
.ob-boot { position: absolute; inset: 0; z-index: 1; display: none; place-items: center; }
.ob.is-boot .ob-boot { display: grid; }
.ob-boot svg { width: 64px; height: 64px; filter: drop-shadow(0 0 18px var(--glow)); animation: obPulse 1.6s ease-in-out infinite; }
@keyframes obPulse { 50% { transform: scale(1.12); opacity: .75; } }

.ob-back { position: absolute; z-index: 5; left: 12px; top: calc(var(--sat) + 8px); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); transition: opacity .3s ease, transform .4s var(--ease); }
.ob-back .ic { width: 30px; height: 30px; stroke-width: 2; }
.ob[data-s="0"] .ob-back, .ob.is-boot .ob-back { opacity: 0; pointer-events: none; }

.ob h1 { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.015em; }
.ob .ob-sub { margin-top: 8px; font-size: 16px; line-height: 1.35; font-weight: 500; color: var(--text-secondary); max-width: 320px; }
.ob-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; margin: 0 -8px; padding: 18px 8px; overflow-y: auto; scrollbar-width: none; }
.ob-body::-webkit-scrollbar { display: none; }
.ob .bg { animation: obBg 1.2s ease both; }
@keyframes obBg { from { opacity: 0; } }

/* CTA: основная кнопка — стеклянная линза акцентного цвета */
.ob-btn {
  position: relative; width: 100%; height: 58px; flex: none; border-radius: 29px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 18px; font-weight: 600; letter-spacing: -.005em; color: var(--on-accent);
  background: linear-gradient(180deg, rgb(255 255 255 / .28), transparent 52%), linear-gradient(180deg, hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 7%)), var(--accent));
  box-shadow: inset 0 1.5px 1px rgb(255 255 255 / .5), inset 0 -2px 4px hsl(var(--accent-h) 100% 80% / .35), 0 0 0 1px hsl(var(--accent-h) 100% 84% / .28), 0 10px 30px var(--glow);
  transition: transform .42s var(--ease), box-shadow .42s var(--ease), opacity .3s ease, filter .3s ease;
}
.ob-btn:active { transform: scale(.97); transition-duration: .12s; }
.ob-btn .ic { width: 22px; height: 22px; stroke-width: 2.2; margin-left: auto; position: absolute; right: 22px; }
.ob-btn:disabled { cursor: default; opacity: .5; filter: saturate(.4); box-shadow: inset 0 1px 0 var(--edge-light); transform: none; }
.ob-btn--glass { color: var(--text-primary); background: linear-gradient(158deg, var(--glass-hi) 0%, transparent 46%), var(--surface-glass); box-shadow: inset 0 1px 0 var(--edge-light), inset 0 -1px 0 var(--edge-dark), 0 10px 30px var(--shadow); }
.ob-btn--glass:disabled { opacity: .7; filter: none; }
.ob-btn--glass svg.g { width: 24px; height: 24px; flex: none; }
.ob-spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent-med); border-top-color: var(--accent); animation: obSpin .8s linear infinite; flex: none; }
@keyframes obSpin { to { transform: rotate(360deg); } }

.ob-msg { min-height: 20px; margin: 0 4px 14px; font-size: 14px; line-height: 1.35; color: hsl(3 88% 62%); text-align: center; }
.ob-msg:empty { display: none; }

/* 1. приветствие */
.ob-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 8px; }
.ob-hero > * { animation: obIn 1s var(--ease) both; animation-delay: calc(var(--i) * .22s + .15s); }
.ob-star { width: 132px; height: 132px; filter: drop-shadow(0 0 34px var(--glow)); }
.ob-word { margin-top: 6px; font-size: 62px; line-height: 1; font-weight: 800; letter-spacing: .06em; padding-left: .06em; }
.ob-tag { margin-top: 14px; font-size: 20px; font-weight: 500; color: var(--accent-light); }
:root[data-theme="light"] .ob-tag { color: var(--accent); }
.ob-lead { margin-top: 44px; max-width: 280px; font-size: 16px; line-height: 1.45; color: var(--text-secondary); }
.ob-cta { animation: obIn 1s var(--ease) both; animation-delay: 1.2s; }
@keyframes obIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }
.ob-step:not(.is-active) .ob-hero > *, .ob-step:not(.is-active) .ob-cta { animation: none; }

/* 2. вход */
.ob-google { display: flex; flex-direction: column; flex: 1; }

/* 3. аватары */
.ob-avs { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 16px; max-width: 340px; margin: 0 auto; }
.ob-av { position: relative; width: 96px; height: 96px; border-radius: 50%; padding: 4px; transition: transform .45s var(--ease), box-shadow .45s var(--ease); box-shadow: 0 0 0 1px var(--border-soft), 0 6px 18px var(--shadow); }
.ob-av img { width: 100%; height: 100%; border-radius: 50%; display: block; }
.ob-av[aria-pressed="true"] { transform: scale(1.1); box-shadow: 0 0 0 2.5px var(--accent), 0 0 0 6px var(--accent-soft), 0 0 28px var(--glow); }
.ob-av i { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); background: var(--accent); box-shadow: 0 0 0 3px var(--background), 0 4px 12px var(--glow); opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .4s var(--ease); }
.ob-av i .ic { width: 16px; height: 16px; stroke-width: 3.2; }
.ob-av[aria-pressed="true"] i { opacity: 1; transform: none; }

/* 4. username */
.ob-field { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 16px; border-radius: 29px; transition: box-shadow .4s var(--ease); }
.ob-field > .ic { width: 22px; height: 22px; color: var(--text-secondary); flex: none; }
.ob-field .at { font-size: 18px; color: var(--text-tertiary); margin-right: -6px; }
.ob-field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 18px; color: var(--text-primary); -webkit-appearance: none; appearance: none; }
.ob-field input::placeholder { color: var(--text-tertiary); opacity: 1; }
.ob-field:focus-within { box-shadow: inset 0 1px 0 var(--edge-light), 0 0 0 1.5px var(--accent-med), 0 0 0 5px var(--accent-soft), 0 10px 34px var(--glow); }
.ob-state { width: 24px; height: 24px; flex: none; display: grid; place-items: center; }
.ob-state .ic { width: 22px; height: 22px; stroke-width: 2.6; }
.ob-hint { margin: 12px 8px 0; min-height: 20px; font-size: 14px; line-height: 1.35; color: var(--text-tertiary); }
.ob-hint.ok { color: var(--success); }
.ob-hint.bad { color: hsl(3 88% 62%); }
.ob-field.ok .ob-state { color: var(--success); }
.ob-field.bad .ob-state { color: hsl(3 88% 62%); }

/* 5. тема */
.ob-themes { display: flex; gap: 14px; }
.ob-theme { flex: 1; min-width: 0; border-radius: 28px; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
.ob-theme[aria-pressed="true"] { transform: scale(1.03); box-shadow: inset 0 1px 0 var(--edge-light), 0 0 0 2px var(--accent), 0 0 0 6px var(--accent-soft), 0 12px 36px var(--glow); }
.ob-theme b { font-size: 16px; font-weight: 600; }
.ob-mini { position: relative; width: 100%; aspect-ratio: 3/4.1; border-radius: 18px; padding: 12px 9px; display: flex; flex-direction: column; gap: 7px; }
.ob-mini--l { --m-bg: #eef2fb; --m-card: #fff; --m-line: #c9d3ea; background: linear-gradient(180deg, #f6f8ff, #e3e9f8); }
.ob-mini--d { --m-bg: #070d24; --m-card: #111a3a; --m-line: #34436f; background: linear-gradient(180deg, #0b1330, #050a1c); }
.ob-mini u { height: 11px; width: 42%; margin: 0 auto 3px; border-radius: 6px; background: var(--accent); opacity: .85; }
.ob-mini span { display: flex; align-items: center; gap: 6px; padding: 7px; border-radius: 10px; background: var(--m-card); box-shadow: 0 2px 6px rgb(0 0 0 / .12); }
.ob-mini span::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); flex: none; opacity: .9; }
.ob-mini span::after { content: ""; flex: 1; height: 5px; border-radius: 3px; background: var(--m-line); box-shadow: 0 9px 0 -1px var(--m-line); margin-bottom: 8px; }
.ob-theme > i { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); background: var(--accent); box-shadow: 0 4px 12px var(--glow); opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .4s var(--ease); }
.ob-theme > i .ic { width: 15px; height: 15px; stroke-width: 3.2; }
.ob-theme[aria-pressed="true"] > i { opacity: 1; transform: none; }

/* 6–7. профиль */
.ob .hero { margin: 0; }
.ob .pc-swatches { margin: 18px 0 0; justify-content: center; }
.ob-kv { margin-top: 14px; border-radius: 26px; overflow: hidden; }
.ob-kv div { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; font-size: 16px; }
.ob-kv div + div { border-top: 1px solid var(--divider); }
.ob-kv span { color: var(--text-secondary); display: flex; align-items: center; gap: 9px; }
.ob-kv i { width: 14px; height: 14px; border-radius: 50%; background: hsl(var(--h) var(--s) var(--l)); box-shadow: 0 0 10px hsl(var(--h) var(--s) var(--l) / .7); }
.ob-bio { margin-top: 12px; font-size: 15px; color: var(--text-secondary); }

/* финальный экран */
.ob-done { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; text-align: center; background: var(--background); opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s .6s; }
.ob-done .bg { opacity: 1; }
.ob-done > div { position: relative; z-index: 1; }
.ob.is-done .ob-done { opacity: 1; visibility: visible; transition-delay: 0s; }
.ob.is-done .ob-done > div { animation: obIn 1s var(--ease) both .2s; }
.ob-done .ob-star { width: 110px; height: 110px; }
.ob-done .ob-word { font-size: 50px; }
.ob-done p { margin-top: 12px; font-size: 20px; font-weight: 500; color: var(--accent-light); }
:root[data-theme="light"] .ob-done p { color: var(--accent); }
@media (max-height: 700px) { .ob-body { justify-content: flex-start; } .ob-star { width: 96px; height: 96px; } .ob-word { font-size: 50px; } .ob-lead { margin-top: 26px; } .ob-av { width: 84px; height: 84px; } }

/* =====================================================================
   NOVA CHAT — окно переписки, профиль собеседника, меню, шиты, поиск.
   Только переменные темы NOVA (никаких жёстких цветов, кроме красного «ошибка»).
   ===================================================================== */
.cw { --danger: hsl(0 84% 62%); position: absolute; left: 0; right: 0; top: 0; height: var(--vvh, 100%); z-index: 35; display: flex; flex-direction: column; overflow: hidden; }
.cw[hidden], .pf[hidden], .pop[hidden], .sh[hidden] { display: none; }
.cw-bg { position: absolute; inset: 0; z-index: 0; background-color: var(--background); background-image: var(--bg-image); background-size: cover; background-position: center; }
.cw-bg::after { content: ""; position: absolute; inset: 0; background: var(--background); opacity: 0; }
.cw-bg.has-img { background-size: cover; background-position: center; }
.cw-bg.has-img::after { opacity: .38; }
.cw-bg[data-p="aurora"] { background-image: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%), radial-gradient(90% 60% at 100% 100%, color-mix(in srgb, var(--accent-secondary) 22%, transparent), transparent 70%); }
.cw-bg[data-p="dusk"] { background-image: linear-gradient(165deg, color-mix(in srgb, var(--accent) 30%, var(--background)), var(--background) 70%); }
.cw-bg[data-p="spots"] { background-image: radial-gradient(60% 40% at 12% 22%, color-mix(in srgb, var(--accent) 28%, transparent), transparent), radial-gradient(55% 40% at 90% 62%, color-mix(in srgb, var(--accent-secondary) 24%, transparent), transparent); }
.cw.has-acc { --accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l)); --accent-secondary: hsl(calc(var(--accent-h) + 44) 92% calc(var(--accent-l) + 4%)); --accent-light: hsl(var(--accent-h) 100% 84%); --accent-soft: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .14); --accent-med: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .32); --accent-strong: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .60); --glow: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .38); --border: hsl(var(--accent-h) 90% 78% / .20); --rim-4: hsl(var(--accent-h) 100% 72% / .55); }
.app.in-chat .screens { transform: scale(.95); opacity: 0; filter: blur(6px); transition: transform .5s var(--ease), opacity .4s ease, filter .4s ease; }
.screens { transition: transform .5s var(--ease), opacity .4s ease, filter .4s ease; }

/* шапка */
.cw-top, .cw-scroll, .cw-bot { position: relative; z-index: 1; }
.cw-top { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 10px) 14px 8px; }
.cw-back { height: 54px; min-width: 54px; padding: 0 4px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--text-primary); flex: none; }
.cw-back .ic { width: 26px; height: 26px; margin: 0 10px; }
.cw-back.has-ub .ic { margin: 0 2px 0 12px; }
.cw-ub { min-width: 32px; height: 32px; margin-right: 8px; padding: 0 9px; border-radius: 16px; display: grid; place-items: center; font-size: 16px; font-weight: 600; color: var(--on-accent); background: linear-gradient(145deg, var(--accent-secondary), var(--accent)); box-shadow: 0 0 16px var(--glow), inset 0 1px 0 rgb(255 255 255 / .4); }
.cw-ub[hidden] { display: none; }
.cw-name { flex: 1; min-width: 0; height: 58px; border-radius: 29px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-primary); }
.cw-name b { max-width: 100%; padding: 0 14px; font-size: 19px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-name span { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.1; color: var(--text-secondary); }
.cw-name span i { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
.cw-name.off span i { display: none; }
.cw-name.on span { color: var(--text-secondary); }
.cw-av { width: 58px; height: 58px; padding: 4px; border-radius: 50%; flex: none; }
.cw-av .avatar { width: 100%; height: 100%; }

/* сообщения */
.cw-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 8px 14px; }
.cw-list { display: flex; flex-direction: column; gap: 6px; min-height: 100%; justify-content: flex-end; }
.cw-empty { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: var(--text-secondary); font-size: 15px; pointer-events: none; }
.cw-empty[hidden] { display: none; }
.cs { align-self: center; margin: 10px 0 4px; padding: 7px 16px; border-radius: 16px; font-size: 14px; color: var(--text-secondary); background: var(--surface-glass); border: 1px solid var(--border-soft); }
.msg { position: relative; display: flex; flex-direction: column; max-width: 82%; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.theirs { align-self: flex-start; align-items: flex-start; }
.msg .rpi { position: absolute; right: -34px; top: 50%; width: 24px; height: 24px; margin-top: -12px; color: var(--accent-light); opacity: calc(var(--sp, 0)); transform: scale(calc(.5 + var(--sp, 0) * .5)); pointer-events: none; }
.msg.theirs .rpi { display: none; }
.mb { position: relative; display: block; padding: 9px 14px 8px; border-radius: 22px; font-size: 17px; line-height: 1.3; color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; transition: transform .35s var(--ease); }
.mb::after { content: ""; display: block; clear: both; }
.theirs .mb { background: linear-gradient(158deg, var(--glass-hi), transparent 55%), var(--surface-glass-strong); border: 1px solid var(--border-soft); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border-bottom-left-radius: 8px; }
.mine .mb { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); border: 1px solid var(--accent-strong); box-shadow: 0 6px 20px var(--glow); border-bottom-right-radius: 8px; }
.cw.bs-solid .mine .mb { background: var(--accent); }
.mt.del { opacity: .65; font-style: italic; }
.mm { display: inline-flex; align-items: center; gap: 4px; margin-left: 12px; vertical-align: -3px; font-size: 12.5px; line-height: 1; opacity: .85; white-space: nowrap; user-select: none; }
.tkw { display: inline-flex; }
.tkw > svg:not(.clk), .mf { animation: npop .34s var(--ease); }
.mbd { display: inline; }
.mine .mm { color: var(--on-accent); }
.theirs .mm { color: var(--text-secondary); }
.tk { width: 17px; height: 17px; stroke-width: 2.2; }
.tk { opacity: .7; }
.tk.rd { color: var(--on-accent); opacity: 1; }
.tk.clk { animation: nspin 1.6s linear infinite; }
.mf { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; background: var(--danger); }
.fw { display: block; margin-bottom: 3px; font-size: 13px; font-weight: 600; color: var(--accent-light); }
.mine .fw { color: var(--on-accent); opacity: .9; }
.rq { display: block; margin-bottom: 6px; padding: 4px 10px; border-left: 3px solid var(--accent-light); border-radius: 4px 10px 10px 4px; background: var(--accent-soft); font-size: 14px; line-height: 1.25; }
.rq b { display: block; font-weight: 600; color: var(--accent-light); }
.rq span { display: block; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
.rx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.rx span { padding: 3px 9px; border-radius: 13px; font-size: 14px; background: var(--surface-glass-strong); border: 1px solid var(--border-soft); color: var(--text-primary); animation: npop .38s var(--ease); }
.rx span.mine { border-color: var(--accent); background: var(--accent-soft); }
.msg.hl .mb { animation: nflash 1.2s ease; }

/* ввод */
.cw-bot { flex: none; padding: 6px 14px calc(var(--sab) + 14px); }
.cw-rp { display: flex; align-items: center; gap: 10px; margin: 0 6px 8px; padding: 8px 8px 8px 14px; border-radius: 20px; animation: nrise .3s var(--ease); }
.cw-rp[hidden] { display: none; }
.cw-rp div { flex: 1; min-width: 0; border-left: 3px solid var(--accent-light); padding-left: 10px; font-size: 14px; line-height: 1.25; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw-rp b { display: block; color: var(--accent-light); font-weight: 600; }
.cw-rp button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--text-secondary); }
.cw-in { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 20px; border-radius: 30px; }
.cw-in textarea { flex: 1; min-width: 0; height: 46px; min-height: 46px; max-height: 120px; padding: 12px 0; margin: 0; border-radius: 0; -webkit-appearance: none; appearance: none; caret-color: var(--accent); font: inherit; font-size: 17px; line-height: 22px; color: var(--text-primary); background: none; border: 0; outline: 0; resize: none; }
.cw-in textarea::placeholder { color: var(--text-tertiary); opacity: 1; }
.cw-send { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--on-accent); background: linear-gradient(145deg, var(--accent-secondary), var(--accent)); box-shadow: 0 0 18px var(--glow), inset 0 1px 0 rgb(255 255 255 / .4); transition: opacity .25s ease, transform .42s var(--ease); }
.cw-send.idle { opacity: .55; }
.cw-send .ic { width: 22px; height: 22px; }

/* всплывающее меню сообщения */
.pop { position: absolute; inset: 0; z-index: 6; }
.pop-sc { position: absolute; inset: 0; background: var(--background); opacity: .6; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: nfade .25s ease; }
.pop-cl { position: absolute; max-width: none; pointer-events: none; animation: npop .32s var(--ease); }
.pop-m { position: absolute; width: 258px; padding: 6px; border-radius: 26px; transform-origin: 50% 0; animation: npop .34s var(--ease); }
.pop-rx { display: flex; flex-wrap: wrap; justify-content: space-between; padding: 6px 6px 8px; border-bottom: 1px solid var(--divider); }
.pop-rx button { width: 38px; height: 38px; border-radius: 50%; font-size: 24px; line-height: 1; transition: transform .2s var(--ease); }
.pop-rx button:active { transform: scale(1.35); }
.pop-rx.grid button { font-size: 22px; }
.pop-it { display: flex; align-items: center; width: 100%; padding: 12px 14px; border-radius: 16px; font-size: 16px; text-align: left; color: var(--text-primary); }
.pop-it:active { background: var(--pressed); }
.pop-it.del { color: var(--danger); }
.pop-info { padding: 12px 14px; font-size: 15px; line-height: 1.5; color: var(--text-secondary); }
.pop-info b { color: var(--text-primary); font-weight: 600; }

/* профиль собеседника */
.pf { position: absolute; inset: 0; z-index: 5; overflow-y: auto; background: var(--background); padding: 0 var(--page-gutter) 40px; }
.pf-top { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; padding: calc(var(--sat) + 10px) 0 8px; }
.pf-b { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--text-primary); }
.pf-b .ic { width: 22px; height: 22px; }
.pf .hero { margin: 8px 0 14px; }
.hero-status.off { color: var(--text-secondary); }
.hero-status.off i { display: none; }
.pf .card { margin: 0 0 14px; }
.pf-kv { display: flex; justify-content: space-between; gap: 12px; padding: 15px 18px; font-size: 16px; }
.pf-kv + .pf-kv { border-top: 1px solid var(--divider); }
.pf-kv span:first-child { color: var(--text-secondary); }

/* универсальный шит */
.sh { position: absolute; inset: 0; z-index: 50; display: flex; align-items: flex-end; }
.sh-sc { position: absolute; inset: 0; background: var(--background); opacity: .55; animation: nfade .25s ease; }
.sh-p { position: relative; width: 100%; max-height: 82%; display: flex; flex-direction: column; border-radius: 30px 30px 0 0; padding: 8px 0 calc(var(--sab) + 16px); animation: nsheet .45s var(--ease); }
.sh-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px 8px; }
.sh-h h3 { font-size: 19px; font-weight: 650; }
.sh-h button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text-secondary); background: var(--pressed); }
.sh-b { overflow-y: auto; padding: 0 18px; }
.sh-l { margin: 16px 4px 8px; font-size: 14px; font-weight: 600; color: var(--text-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 16px; border-radius: 16px; font-size: 15px; font-weight: 500; color: var(--text-primary); background: var(--surface-glass); border: 1px solid var(--border-soft); transition: background-color .25s ease, border-color .25s ease, transform .16s ease-out; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
.csw { width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent; background: hsl(var(--h) var(--s) var(--l)); box-shadow: 0 0 0 2px var(--background); }
.csw[aria-pressed="true"] { border-color: var(--text-primary); box-shadow: 0 0 14px hsl(var(--h) var(--s) var(--l) / .6); }
.csw.none { background: var(--surface-glass-strong); display: grid; place-items: center; font-size: 12px; color: var(--text-secondary); }
.urow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 6px; border-radius: 16px; text-align: left; color: var(--text-primary); }
.urow:active { background: var(--pressed); }
.urow .avatar { width: 46px; height: 46px; }
.urow .un { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; }
.urow .un small { display: block; font-weight: 400; font-size: 13.5px; color: var(--text-secondary); }
.sh-in { width: 100%; height: 46px; padding: 0 16px; border-radius: 16px; font: inherit; font-size: 16px; color: var(--text-primary); background: var(--surface-glass); border: 1px solid var(--border-soft); outline: 0; margin-bottom: 8px; }
.sh-in:focus { border-color: var(--accent); }

.sh--prev .sh-sc { opacity: 0; animation: none; }
.sh--prev .sh-p { max-height: 50%; }

#toast { white-space: normal; width: max-content; max-width: min(88vw, 340px); text-align: center; line-height: 1.3; }

/* список чатов: аватар + индикатор «в сети» */
.avw { position: relative; display: block; flex: none; }
.odot { position: absolute; right: 1px; bottom: 1px; width: 14px; height: 14px; border-radius: 50%; background: var(--success); border: 2px solid var(--background); box-shadow: 0 0 8px var(--success); }
.chat .avw .avatar { display: block; }

/* поиск */
.res { margin-top: 6px; }
.res .chat-meta { align-self: center; }
.res .st { font-size: 13px; color: var(--text-secondary); }
.res .st.on { color: var(--success); }

@keyframes nspin { to { transform: rotate(360deg); } }
@keyframes npop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
@keyframes nfade { from { opacity: 0; } }
@keyframes nrise { from { opacity: 0; transform: translateY(12px); } }
@keyframes nsheet { from { transform: translateY(100%); } }
@keyframes nflash { 0%, 100% { filter: none; } 30% { filter: brightness(1.5); } }
@media (prefers-reduced-motion: reduce) { .cw *, .sh *, .pop * { animation-duration: .01s !important; } }

/* ===== NOVA: интро-логотип ===== */
.intro .brand-mark, .intro .brand-text { opacity: 0; }
.fly-logo { position: fixed; left: 0; top: 0; z-index: 200; margin: 0; pointer-events: none; transform-origin: 0 0; will-change: transform; filter: drop-shadow(0 0 10px var(--glow)); }
.ob.is-fly .ob-boot svg, .ob.is-fly .ob-done .ob-star { visibility: hidden; animation: none; }

/* ===== NOVA: фоны профиля ===== */
[data-pbg="nova"] { --pbg: radial-gradient(120% 90% at 18% 0%, #3d6dff 0%, transparent 58%), radial-gradient(90% 80% at 100% 100%, #8b4dff 0%, transparent 62%), linear-gradient(160deg, #0c1a5e, #060b2b); }
[data-pbg="midnight"] { --pbg: radial-gradient(70% 60% at 82% 0%, #27346b 0%, transparent 65%), radial-gradient(1.5px 1.5px at 20% 30%, #fffc 98%, transparent), radial-gradient(1px 1px at 70% 62%, #fffa 98%, transparent), radial-gradient(1.5px 1.5px at 45% 82%, #fff9 98%, transparent), radial-gradient(1px 1px at 88% 78%, #fff8 98%, transparent), linear-gradient(170deg, #0b1030, #03050f); }
[data-pbg="ocean"] { --pbg: radial-gradient(90% 55% at 50% 118%, #27d6e8 0%, transparent 68%), linear-gradient(170deg, #1fa8d8 0%, #0d5fb4 48%, #07285a 100%); }
[data-pbg="aurora"] { --pbg: radial-gradient(80% 60% at 15% 10%, #2ee6a6aa, transparent 62%), radial-gradient(70% 60% at 90% 30%, #7b5cff99, transparent 64%), radial-gradient(90% 50% at 50% 110%, #19b5d899, transparent 66%), linear-gradient(180deg, #07142a, #050b1c); }
[data-pbg="neon"] { --pbg: radial-gradient(70% 60% at 0% 0%, #ff2fd2aa, transparent 62%), radial-gradient(70% 60% at 100% 100%, #18e0ffaa, transparent 62%), linear-gradient(160deg, #150a2e, #07040f); }
.hero[data-pbg], .bgt[data-pbg] { background: var(--pbg); }
.hero[data-pbg] .hero-name { color: #fff; text-shadow: 0 2px 14px rgb(0 0 0 / .35); }
.hero[data-pbg] .hero-handle { color: rgb(255 255 255 / .8); }
.bgt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px var(--page-gutter) 0; }
.bgt { position: relative; height: 78px; border-radius: 20px; display: flex; align-items: flex-end; padding: 9px 11px; font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 8px rgb(0 0 0 / .4); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .16); }
.bgt[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--background), 0 0 0 4.5px var(--accent), 0 0 18px var(--glow); }
.ps-avs { display: flex; gap: 12px; padding: 4px 16px 16px; overflow-x: auto; scrollbar-width: none; }
.ps-avs::-webkit-scrollbar { display: none; }
.ps-av { width: 58px; height: 58px; border-radius: 50%; flex: none; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border-soft); }
.ps-av img { width: 100%; height: 100%; display: block; }
.ps-av[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--background), 0 0 0 4.5px var(--accent), 0 0 14px var(--glow); }
.ps-field { margin: 0 var(--page-gutter); }
.ps-field .ob-field { height: 54px; }
.ps-save { display: block; width: calc(100% - var(--page-gutter) * 2); height: 54px; margin: 22px var(--page-gutter) 0; border-radius: 27px; font-size: 17px; font-weight: 600; text-align: center; color: var(--on-accent); background: linear-gradient(145deg, var(--accent-secondary), var(--accent)); box-shadow: 0 0 18px var(--glow), inset 0 1px 0 rgb(255 255 255 / .4); }
.ps-save:disabled { opacity: .45; }
</style>
</head>
